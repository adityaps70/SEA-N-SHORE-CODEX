name: AWS Learning LMS Phase 1 Migration

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - 'infra/aws/database/migrations/0019_learning_lms_phase_1.sql'
      - 'scripts/aws/learning-lms-phase-1-migration.sh'
      - 'scripts/aws/learning-lms-phase-1-migration-action.txt'
      - 'scripts/aws/learning-lms-phase-1-migration.test.mjs'
      - '.github/workflows/aws-learning-lms-phase-1-migration.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-south-1
  EXPECTED_ACCOUNT: '310356785722'
  BRANCH: feat/aws-native-phase-0-1
  DEPLOY_ROLE: arn:aws:iam::310356785722:role/sea-n-shore-staging-github-deploy

jobs:
  apply-gate:
    runs-on: ubuntu-latest
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/aws/learning-lms-phase-1-migration-action.txt
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/learning-lms-phase-1-migration-action.txt)"
          case "$ACTION" in
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GUARD_FILE: scripts/aws/learning-lms-phase-1-migration-action.txt
          RUNNER_FILES: "infra/aws/database/migrations/0019_learning_lms_phase_1.sql scripts/aws/learning-lms-phase-1-migration.sh scripts/aws/learning-lms-phase-1-migration.test.mjs"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(tr -d '[:space:]' < "$GUARD_FILE")"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          commits = event.get("commits") or []
          files = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
          watched = os.environ["RUNNER_FILES"].split()
          # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
          complete = bool(commits) and len(commits) < 2048 and bool(files)
          print("true" if complete and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ubuntu-latest
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  migrate:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/learning-lms-phase-1-migration-action.txt)"
          case "$ACTION" in
            plan|migrate-once) ;;
            *) echo "Unsupported action: $ACTION" >&2; exit 1 ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "LMS_PHASE_1_MIGRATION_ACTION=$ACTION"

      - name: Plan-only guard status
        if: steps.guard.outputs.action == 'plan'
        run: echo 'LMS Phase 1 migration is plan-only; no AWS write is permitted.'

      - name: Require exact branch push for migration
        if: steps.guard.outputs.action == 'migrate-once'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event_name }}" == "push" ]]
          [[ "${{ github.ref }}" == "refs/heads/${BRANCH}" ]]

      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.guard.outputs.action == 'migrate-once'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            ROW="$(jq -c '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0] // empty' <<<"$JSON")"
            if [[ -n "$ROW" ]]; then
              STATUS="$(jq -r '.status' <<<"$ROW")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<<"$ROW")"
              echo "AWS Infrastructure CI status=$STATUS conclusion=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]]
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head AWS Infrastructure CI.' >&2
          exit 1

      - name: Guard moved branch
        if: steps.guard.outputs.action == 'migrate-once'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          [[ "$(git rev-parse "origin/$BRANCH")" == "$GITHUB_SHA" ]]

      - name: Configure AWS credentials
        if: steps.guard.outputs.action == 'migrate-once'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assert AWS account
        if: steps.guard.outputs.action == 'migrate-once'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT" == "$EXPECTED_ACCOUNT" ]]
          echo "AWS_ACCOUNT_VERIFIED=$ACCOUNT"

      - name: Discover staging bootstrap
        if: steps.guard.outputs.action == 'migrate-once'
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          INSTANCE_ID="$(jq -r '.[0]' <<<"$IDS")"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "BOOTSTRAP_INSTANCE=$INSTANCE_ID"

      - name: Send guarded LMS Phase 1 migration through SSM
        if: steps.guard.outputs.action == 'migrate-once'
        id: command
        env:
          INSTANCE_ID: ${{ steps.bootstrap.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TRIGGER_SHA" > /tmp/ssm-parameters.json <<'PYTHON'
          import json, shlex, sys
          sha = sys.argv[1]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-learning-lms-phase-1.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$WORK_DIR/repo"
          cd "$WORK_DIR/repo"
          git checkout --quiet --detach {sha}
          test "$(git rev-parse HEAD)" = "{sha}"
          export LEARNING_LMS_PHASE_1_MIGRATION_EXPECTED_SHA={sha}
          export AWS_REGION=ap-south-1
          bash scripts/aws/learning-lms-phase-1-migration.sh
          """
          print(json.dumps({"executionTimeout": ["1200"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore LMS Phase 1 migration $TRIGGER_SHA" --timeout-seconds 1200 --parameters file:///tmp/ssm-parameters.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface migration evidence
        if: steps.guard.outputs.action == 'migrate-once'
        env:
          INSTANCE_ID: ${{ steps.bootstrap.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          echo "=== LMS PHASE 1 MIGRATION STDOUT ==="
          jq -r '.StandardOutputContent // empty' /tmp/result.json
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          [[ -z "$STDERR_CONTENT" ]] || { echo "=== LMS PHASE 1 MIGRATION STDERR ===" >&2; printf '%s\n' "$STDERR_CONTENT" >&2; }
          FINAL_STATUS=$(jq -r '.Status' /tmp/result.json)
          echo "SSM final status: $FINAL_STATUS"
          [[ "$FINAL_STATUS" == Success ]]
          STDOUT_CONTENT=$(jq -r '.StandardOutputContent // empty' /tmp/result.json)
          grep -q 'LEARNING_LMS_PHASE_1_MIGRATION_APPLY_VERIFIED=true\|LEARNING_LMS_PHASE_1_MIGRATION_ALREADY_APPLIED=true' <<<"$STDOUT_CONTENT"
