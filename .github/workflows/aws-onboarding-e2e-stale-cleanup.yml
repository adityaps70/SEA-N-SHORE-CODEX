name: AWS Onboarding E2E Stale Cleanup

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/onboarding-e2e-stale-cleanup.sh
      - scripts/aws/onboarding-e2e-stale-cleanup-action.txt
      - scripts/aws/onboarding-e2e-stale-cleanup.test.mjs
      - .github/workflows/aws-onboarding-e2e-stale-cleanup.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-onboarding-e2e-stale-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Verify cleanup contract
        shell: bash
        run: node scripts/aws/onboarding-e2e-stale-cleanup.test.mjs

      - name: Resolve stale cleanup action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/onboarding-e2e-stale-cleanup-action.txt)"
          case "$ACTION" in
            plan)
              echo "run_cleanup=false" >> "$GITHUB_OUTPUT"
              ;;
            cleanup-once)
              [[ "$GITHUB_EVENT_NAME" == "push" ]] || {
                echo "cleanup-once is allowed only from an exact branch push." >&2
                exit 1
              }
              echo "run_cleanup=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported stale cleanup action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.action.outputs.run_cleanup == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || {
                echo "Exact-head AWS Infrastructure CI is not green." >&2
                exit 1
              }
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-head AWS Infrastructure CI." >&2
          exit 1

      - name: Guard cleanup against a moved branch
        if: steps.action.outputs.run_cleanup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || {
            echo "Branch moved after stale cleanup started; refusing stale execution." >&2
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.action.outputs.run_cleanup == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        if: steps.action.outputs.run_cleanup == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || {
            echo "Refusing stale cleanup in unexpected AWS account $ACCOUNT_ID." >&2
            exit 1
          }

      - name: Discover bootstrap instance
        if: steps.action.outputs.run_cleanup == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "instance_id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"

      - name: Send guarded stale cleanup through SSM
        if: steps.action.outputs.run_cleanup == 'true'
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TRIGGER_SHA" > /tmp/onboarding-e2e-stale-cleanup.json <<'PYTHON'
          import json, shlex, sys
          sha = sys.argv[1]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-onboarding-cleanup.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$WORK_DIR/repo"
          cd "$WORK_DIR/repo"
          git checkout --quiet --detach {sha}
          test "$(git rev-parse HEAD)" = "{sha}"
          export ONBOARDING_E2E_EXPECTED_SHA={sha}
          bash scripts/aws/onboarding-e2e-stale-cleanup.sh
          """
          print(json.dumps({"executionTimeout": ["600"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore onboarding E2E stale cleanup $TRIGGER_SHA" --timeout-seconds 600 --parameters file:///tmp/onboarding-e2e-stale-cleanup.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface stale cleanup evidence
        if: steps.action.outputs.run_cleanup == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/onboarding-e2e-stale-cleanup-result.json
          STDOUT_CONTENT=$(jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-stale-cleanup-result.json)
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/onboarding-e2e-stale-cleanup-result.json)
          printf '%s\n' "$STDOUT_CONTENT"
          [[ -z "$STDERR_CONTENT" ]] || printf '%s\n' "$STDERR_CONTENT" >&2
          [[ "$(jq -r '.Status' /tmp/onboarding-e2e-stale-cleanup-result.json)" == Success ]]
          grep -q '^ONBOARDING_E2E_STALE_CLEANUP_VERIFIED=true$' <<<"$STDOUT_CONTENT"
