name: AWS Learning Assignment Review E2E

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/learning-assignment-review-e2e-action.txt
      - scripts/aws/learning-assignment-review-e2e-guard.test.mjs
      - scripts/aws/learning-assignment-review-staging-e2e.mjs
      - scripts/aws/learning-assignment-review-e2e-ssm.mjs
      - scripts/aws/learning-assignment-review-e2e-remote.sh
      - .github/workflows/aws-learning-assignment-review-e2e.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-learning-assignment-review-e2e
  cancel-in-progress: false

jobs:
  apply-gate:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    # Gate-only job. Cost cut 7: vars.GATE_RUNNER=ubuntu-slim (a third of the ubuntu-latest rate) while the repo is private; GitHub does not serve ubuntu-slim to it while public.
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      # Cost cut 7 (owner-approved 14 Nov; proved in run 43619379498): the tools this gate uses must be on ubuntu-slim;
      # a missing one fails the gate (it refuses).
      - name: Check the gate's tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash curl jq python3 git; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }
          done
          echo "CUT7_TOOLS bash=${BASH_VERSION} curl=$(curl --version | head -1 | cut -d' ' -f2) $(jq --version) python3=$(python3 -c 'import platform; print(platform.python_version())') $(git --version)"
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/learning-assignment-review-e2e-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/learning-assignment-review-e2e-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            # Round 16 follow-up: read-only and test-data runs (E2E, audits, test-account cleanup) never wait.
            plan|discover|run-once) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Pre-private: GitHub Pro does not enforce the approval environment's required reviewer on a private repo. Any guard
      # value but plan/discover also needs its arm commit to be a pull request merged by adityaps70 whose guard file
      # names the exact commit it arms (scripts/aws/arm-commit-guard.sh).
      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/learning-assignment-review-e2e-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/learning-assignment-review-e2e-action.txt
          RUNNER_FILES: "scripts/aws/learning-assignment-review-e2e-guard.test.mjs scripts/aws/learning-assignment-review-staging-e2e.mjs scripts/aws/learning-assignment-review-e2e-ssm.mjs scripts/aws/learning-assignment-review-e2e-remote.sh"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          watched = os.environ["RUNNER_FILES"].split()
          before, after = event.get("before") or "", event.get("after") or ""
          files = None
          # Cost cut 7 (14 Nov): the files this push changed, from the compare API. It is exact for any push, a pull
          # request merge included (the commit list in the event is not). Under 300 files only; any doubt runs the plan.
          if len(before) == 40 and before.strip("0") and len(after) == 40:
              try:
                  url = "%s/repos/%s/compare/%s...%s" % (os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], before, after)
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  data = json.load(urllib.request.urlopen(request, timeout=20))
                  changed = data.get("files") or []
                  if data.get("status") == "ahead" and 0 < len(changed) < 300:
                      files = {f["filename"] for f in changed} | {f["previous_filename"] for f in changed if f.get("previous_filename")}
              except Exception:
                  files = None
          if files is None:
              commits = event.get("commits") or []
              listed = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
              # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
              complete = bool(commits) and len(commits) < 2048 and bool(listed)
              files = listed if complete else None
          print("true" if files is not None and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  learning-assignment-review-e2e:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') && (github.ref == 'refs/heads/feat/aws-native-phase-0-1') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      COGNITO_POOL_NAME: sea-n-shore-staging-users

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve public site URL
        shell: bash
        run: |
          set -euo pipefail
          SITE="$(tr -d '[:space:]' < scripts/aws/public-site-url.txt)"
          [[ "$SITE" =~ ^https://[a-z0-9.-]+$ ]] || { echo "scripts/aws/public-site-url.txt must hold one https origin." >&2; exit 1; }
          echo "SITE_URL=$SITE" >> "$GITHUB_ENV"
          echo "Public site URL: $SITE"

      - name: Resolve learning assignment review E2E action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/learning-assignment-review-e2e-action.txt | tr -d '[:space:]')"
          echo "LEARNING_ASSIGNMENT_REVIEW_E2E_ACTION=$ACTION" >> "$GITHUB_ENV"
          case "$ACTION" in
            plan)
              echo "run_e2e=false" >> "$GITHUB_OUTPUT"
              ;;
            run-once)
              [[ "$GITHUB_EVENT_NAME" == push ]] || { echo "run-once is permitted only from an exact branch push." >&2; exit 1; }
              [[ "$GITHUB_REF" == refs/heads/feat/aws-native-phase-0-1 ]] || { echo "run-once is restricted to feat/aws-native-phase-0-1." >&2; exit 1; }
              echo "run_e2e=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported learning assignment review E2E action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == completed ]]; then
              [[ "$CONCLUSION" == success ]] || { echo "Exact-head AWS Infrastructure CI is not green." >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-head AWS Infrastructure CI." >&2
          exit 1

      - name: Guard push E2E against a moved branch
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after learning assignment review E2E started; refusing stale execution." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.action.outputs.run_e2e == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || { echo "Refusing E2E in unexpected AWS account $ACCOUNT_ID." >&2; exit 1; }

      - name: Discover bootstrap instance
        if: steps.action.outputs.run_e2e == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          [[ "$COUNT" -eq 1 ]] || { echo "Expected exactly one running bootstrap; found $COUNT." >&2; exit 1; }
          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      - name: Generate disposable learning identities
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="sea-n-shore-learning-review-e2e-${GITHUB_RUN_ID}"
          MENTOR_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Mentor9"
          LEARNER_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Learner9"
          echo "::add-mask::$MENTOR_PASSWORD"
          echo "::add-mask::$LEARNER_PASSWORD"
          {
            echo "E2E_MENTOR_EMAIL=${PREFIX}-mentor@example.com"
            echo "E2E_LEARNER_EMAIL=${PREFIX}-learner@example.com"
            echo "E2E_MENTOR_PASSWORD=$MENTOR_PASSWORD"
            echo "E2E_LEARNER_PASSWORD=$LEARNER_PASSWORD"
            echo "E2E_MENTOR_NAME=E2E Learning Mentor ${GITHUB_RUN_ID}"
            echo "E2E_LEARNER_NAME=E2E Learning Learner ${GITHUB_RUN_ID}"
            echo "E2E_COURSE_TITLE=E2E Learning Review Course ${GITHUB_RUN_ID}"
            echo "E2E_COURSE_SLUG=${PREFIX}"
            echo "E2E_FEEDBACK=E2E mentor pass feedback."
            echo "E2E_REVISION_FEEDBACK=E2E mentor revision feedback. Add stronger controls and verification evidence."
          } >> "$GITHUB_ENV"

      - name: Use Node 22 for staging browser E2E
        if: steps.action.outputs.run_e2e == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install browser E2E dependencies
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium

      - name: Create disposable public sign-ups
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: signup
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Confirm disposable sign-ups through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs confirm)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_CONFIRM_VERIFIED=true$' <<<"$OUTPUT"

      - name: Complete disposable professional onboarding
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: onboarding
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Create disposable published assignment fixture through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs create-fixture)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_FIXTURE_VERIFIED=true$' <<<"$OUTPUT"

      - name: Submit first assignment attempt through live learner UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: learner-submit
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Verify first learner submission through read-only SSM audit
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs verify-submitted)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_SUBMISSION_VERIFIED=true$' <<<"$OUTPUT"

      - name: Request revision through live mentor UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: mentor-revision
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Verify revision grade and locked progression through read-only SSM audit
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs verify-revision)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_REVISION_VERIFIED=true$' <<<"$OUTPUT"

      - name: Resubmit revised assignment through live learner UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: learner-resubmit
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Verify preserved first attempt and pending second attempt through read-only SSM audit
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs verify-resubmitted)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_RESUBMISSION_VERIFIED=true$' <<<"$OUTPUT"

      - name: Review revised attempt and pass through live mentor UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: mentor-pass
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Verify second-attempt pass and completion through read-only SSM audit
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs verify-passed)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_PASS_VERIFIED=true$' <<<"$OUTPUT"

      - name: Verify final mentor feedback and progression unlock through live learner UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: learner-verify
        run: node scripts/aws/learning-assignment-review-staging-e2e.mjs

      - name: Cleanup every disposable learning assignment review artifact
        if: always() && steps.action.outputs.run_e2e == 'true' && steps.instance.outputs.instance_id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/learning-assignment-review-e2e-ssm.mjs cleanup)"
          printf '%s\n' "$OUTPUT"
          grep -q '^LEARNING_ASSIGNMENT_REVIEW_E2E_CLEANUP_VERIFIED=true$' <<<"$OUTPUT"
