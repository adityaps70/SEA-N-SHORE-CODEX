name: AWS Legacy Dump Upload Permission

on:
  push:
    branches: [feat/aws-native-phase-0-1]
    paths:
      - infra/aws/bootstrap/main.tf
      - scripts/aws/bootstrap-legacy-dump-upload-permission.sh
      - .github/workflows/aws-legacy-dump-upload-permission.yml

permissions:
  id-token: write
  contents: read

concurrency:
  group: sea-n-shore-legacy-dump-upload-permission
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - name: Verify account and discover bootstrap
        id: instance
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "310356785722"
          IDS="$(aws ec2 describe-instances --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)"
          test "$(jq length <<<"$IDS")" -eq 1
          echo "id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"
      - name: Apply scoped upload permission on bootstrap
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "$SHA" > /tmp/params.json <<'PY'
          import json,shlex,sys
          sha=sys.argv[1]
          cmd=f"""set -euo pipefail
          D=$(mktemp -d /var/tmp/sns-legacy-upload-perm.XXXXXX)
          trap 'rm -rf "$D"' EXIT
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$D/repo"
          cd "$D/repo"
          git checkout --quiet --detach {sha}
          bash scripts/aws/bootstrap-legacy-dump-upload-permission.sh
          """
          print(json.dumps({"executionTimeout":["600"],"commands":["runuser -u ssm-user -- bash -lc "+shlex.quote(cmd)]}))
          PY
          CID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters file:///tmp/params.json --query 'Command.CommandId' --output text)"
          for i in $(seq 1 120); do
            S="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$S" in Pending|InProgress|Delayed) sleep 5;; *) break;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          jq -r '.StandardOutputContent // empty' /tmp/result.json
          jq -r '.StandardErrorContent // empty' /tmp/result.json >&2
          test "$(jq -r .Status /tmp/result.json)" = Success
          grep -q 'LEGACY_DUMP_UPLOAD_PERMISSION_APPLIED=true' <(jq -r '.StandardOutputContent // empty' /tmp/result.json)
