name: AWS Google Auth Live Verify

on:
  # Actions minutes: started once per deploy by aws-staging-deploy.yml (after the ECS rollout is
  # verified), or by hand; not on every push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sea-n-shore-google-auth-live-verify
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify probe contract
        run: node --test scripts/aws/google-auth-live-probe.test.mjs
      - name: Verify live Google auth entry points
        run: bash scripts/aws/google-auth-live-probe.sh
