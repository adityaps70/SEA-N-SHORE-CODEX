name: AWS Post Feed Diagnostic

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-post-feed-diagnostic.yml

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: sea-n-shore-staging
      ECS_SERVICE: sea-n-shore-staging-web
      ECS_CONTAINER_NAME: web
      LOG_GROUP: /ecs/sea-n-shore-staging/web
    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify live task and bucket wiring
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$TASK_ARN" --query taskDefinition --output json > /tmp/task.json
          echo "LIVE_TASK_ARN=$TASK_ARN"
          echo "LIVE_TASK_ROLE=$(jq -r '.taskRoleArn' /tmp/task.json)"
          echo "AWS_MEDIA_BUCKET=$(jq -r --arg NAME "$ECS_CONTAINER_NAME" '.containerDefinitions[] | select(.name==$NAME) | (.environment // [])[] | select(.name=="AWS_MEDIA_BUCKET") | .value' /tmp/task.json)"

      - name: Review recent publication events
        run: |
          set -euo pipefail
          START_MS=$(( ($(date +%s) - 1800) * 1000 ))
          aws logs filter-log-events --region "$AWS_REGION" --log-group-name "$LOG_GROUP" --start-time "$START_MS" --output json > /tmp/logs.json
          echo "RECENT_LOG_EVENTS=$(jq '.events | length' /tmp/logs.json)"
          echo "=== FEED PUBLICATION EVENTS ==="
          jq -r '.events[].message' /tmp/logs.json | grep -E '\[feed_(publish|media)_' | tail -n 50 || true
          echo "=== RELATED ERROR EVENTS ==="
          jq -r '.events[].message' /tmp/logs.json | grep -Eai 'AccessDenied|NoSuchKey|SignatureDoesNotMatch|feed_media|feed_publish|HTTP[[:space:]]+[45][0-9][0-9]|image|s3' | tail -n 80 || true
