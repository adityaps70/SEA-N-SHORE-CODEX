name: AWS Post Feed Diagnostic

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-post-feed-diagnostic.yml

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: sea-n-shore-staging
      ECS_SERVICE: sea-n-shore-staging-web
      ECS_CONTAINER_NAME: web
      LOG_GROUP: /ecs/sea-n-shore-staging/web
      ECS_TASK_ROLE: sea-n-shore-staging-ecs-task
      ECS_MEDIA_POLICY: sea-n-shore-staging-ecs-task-media
    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify live task and bucket wiring
        run: |
          set -euo pipefail
          TASK_ARN=$(aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$TASK_ARN" --query taskDefinition --output json > /tmp/task.json
          echo "LIVE_TASK_ARN=$TASK_ARN"
          echo "LIVE_TASK_ROLE=$(jq -r '.taskRoleArn' /tmp/task.json)"
          echo "AWS_MEDIA_BUCKET=$(jq -r --arg NAME "$ECS_CONTAINER_NAME" '.containerDefinitions[] | select(.name==$NAME) | (.environment // [])[] | select(.name=="AWS_MEDIA_BUCKET") | .value' /tmp/task.json)"

      - name: Inspect live ECS media inline policy
        run: |
          set +e
          aws iam get-role-policy --role-name "$ECS_TASK_ROLE" --policy-name "$ECS_MEDIA_POLICY" --output json > /tmp/policy.json 2>/tmp/policy.err
          CODE=$?
          set -e
          echo "IAM_READ_EXIT=$CODE"
          if [ "$CODE" -ne 0 ]; then
            cat /tmp/policy.err
            exit 0
          fi
          jq '{RoleName,PolicyName,PolicyDocument}' /tmp/policy.json
          ACTIONS=$(jq -r '.PolicyDocument.Statement[] | select(.Sid=="PostMediaObjects") | .Action[]?' /tmp/policy.json | sort | tr '\n' ' ')
          RESOURCE=$(jq -r '.PolicyDocument.Statement[] | select(.Sid=="PostMediaObjects") | .Resource' /tmp/policy.json)
          echo "MEDIA_ACTIONS=$ACTIONS"
          echo "MEDIA_RESOURCE=$RESOURCE"

      - name: Review post-fix application errors
        run: |
          set -euo pipefail
          START_MS=1788723280000
          aws logs filter-log-events --region "$AWS_REGION" --log-group-name "$LOG_GROUP" --start-time "$START_MS" --output json > /tmp/logs.json
          echo "POST_FIX_LOG_EVENTS=$(jq '.events | length' /tmp/logs.json)"
          echo "=== POST-FIX STRONG ERROR MATCHES ==="
          jq -r '.events[].message' /tmp/logs.json | grep -Eai 'error|exception|unhandled|fatal|HTTP[[:space:]]+[45][0-9][0-9]|AccessDenied|ECONN|ETIMEDOUT|upload|publish' | tail -n 80 || true
