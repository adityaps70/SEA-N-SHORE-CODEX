name: AWS Legacy User Import

on:
  push:
    branches: [feat/aws-native-phase-0-1]
    paths:
      - scripts/aws/legacy-user-import.sh
      - scripts/aws/legacy-user-import-action.txt
      - scripts/migration/beaufortmarine-import.mjs
      - .github/workflows/aws-legacy-user-import.yml

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-legacy-user-import
  cancel-in-progress: true

jobs:
  apply-gate:
    # Gate-only job. Cost cut 7: vars.GATE_RUNNER=ubuntu-slim (a third of the ubuntu-latest rate) while the repo is private; GitHub does not serve ubuntu-slim to it while public.
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      # Cost cut 7 (owner-approved 14 Nov; proved in run 43619379498): the tools this gate uses must be on ubuntu-slim;
      # a missing one fails the gate (it refuses).
      - name: Check the gate's tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash curl jq python3 git; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }
          done
          echo "CUT7_TOOLS bash=${BASH_VERSION} curl=$(curl --version | head -1 | cut -d' ' -f2) $(jq --version) python3=$(python3 -c 'import platform; print(platform.python_version())') $(git --version)"
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/legacy-user-import-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/legacy-user-import-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Pre-private: GitHub Pro does not enforce the approval environment's required reviewer on a private repo. Any guard
      # value but plan/discover also needs its arm commit to be a pull request merged by adityaps70 whose guard file
      # names the exact commit it arms (scripts/aws/arm-commit-guard.sh).
      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/legacy-user-import-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/legacy-user-import-action.txt
          RUNNER_FILES: "scripts/aws/legacy-user-import.sh scripts/migration/beaufortmarine-import.mjs"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          watched = os.environ["RUNNER_FILES"].split()
          before, after = event.get("before") or "", event.get("after") or ""
          files = None
          # Cost cut 7 (14 Nov): the files this push changed, from the compare API. It is exact for any push, a pull
          # request merge included (the commit list in the event is not). Under 300 files only; any doubt runs the plan.
          if len(before) == 40 and before.strip("0") and len(after) == 40:
              try:
                  url = "%s/repos/%s/compare/%s...%s" % (os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], before, after)
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  data = json.load(urllib.request.urlopen(request, timeout=20))
                  changed = data.get("files") or []
                  if data.get("status") == "ahead" and 0 < len(changed) < 300:
                      files = {f["filename"] for f in changed} | {f["previous_filename"] for f in changed if f.get("previous_filename")}
              except Exception:
                  files = None
          if files is None:
              commits = event.get("commits") or []
              listed = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
              # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
              complete = bool(commits) and len(commits) < 2048 and bool(listed)
              files = listed if complete else None
          print("true" if files is not None and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  import:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    env:
      AWS_REGION: ap-south-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Resolve legacy import action
        id: legacy_action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/legacy-user-import-action.txt | tr -d '[:space:]')"
          case "$ACTION" in plan|import-once) ;; *) echo "Unsupported action: $ACTION" >&2; exit 1 ;; esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.legacy_action.outputs.action == 'import-once'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API")"
            STATUS="$(jq -r '[.workflow_runs[]|select(.name=="AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[]|select(.name=="AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            if [[ "$STATUS" == completed ]]; then [[ "$CONCLUSION" == success ]]; exit; fi
            sleep 10
          done
          exit 1
      - name: Wait for exact-head AWS Staging Deploy
        if: steps.legacy_action.outputs.action == 'import-once'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 180); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API")"
            STATUS="$(jq -r '[.workflow_runs[]|select(.name=="AWS Staging Deploy")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[]|select(.name=="AWS Staging Deploy")][0].conclusion // ""' <<<"$JSON")"
            if [[ "$STATUS" == completed ]]; then [[ "$CONCLUSION" == success ]]; exit; fi
            sleep 10
          done
          echo "Timed out waiting for exact-head staging deployment." >&2
          exit 1
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - name: Verify AWS account and discover bootstrap
        id: instance
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "310356785722"
          IDS="$(aws ec2 describe-instances --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)"
          test "$(jq length <<<"$IDS")" -eq 1
          echo "id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"
      - name: Run guarded import plan/apply through SSM
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" publish "$SHA"
          python3 - "$SHA" > /tmp/params.json <<'PY'
          import json,shlex,sys
          import os, sys; sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts", "aws")); from ci_checkout import host_checkout
          sha=sys.argv[1]
          cmd=f"""set -euo pipefail
          D=$(mktemp -d /var/tmp/sns-legacy-import.XXXXXX)
          trap 'rm -rf "$D"' EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
          {host_checkout('$D', sha)}
          export LEGACY_USER_IMPORT_EXPECTED_SHA={sha}
          bash scripts/aws/legacy-user-import.sh
          """
          print(json.dumps({"executionTimeout":["3300"],"commands":["runuser -u ssm-user -- bash -lc "+shlex.quote(cmd)]}))
          PY
          CID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --timeout-seconds 3400 --parameters file:///tmp/params.json --query 'Command.CommandId' --output text)"
          for i in $(seq 1 680); do
            S="$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$S" in Pending|InProgress|Delayed) sleep 5;; *) break;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          jq -r '.StandardOutputContent // empty' /tmp/result.json
          jq -r '.StandardErrorContent // empty' /tmp/result.json >&2
          test "$(jq -r .Status /tmp/result.json)" = Success
          OUT="$(jq -r '.StandardOutputContent // empty' /tmp/result.json)"
          grep -Eq 'LEGACY_USER_IMPORT_(PLAN_ONLY_NO_APPLY|APPLY_VERIFIED)=true' <<<"$OUT"

      - name: Delete the host checkout bundle
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" cleanup
