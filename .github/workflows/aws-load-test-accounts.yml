name: AWS Load Test Accounts

# Round ARCH (Phase 1): the 50 load-test accounts (src/features/load-test/accounts.ts), run from the deployed web image
# through scripts/aws/load-test-accounts.sh. "plan" only counts; create-once and delete-once need an owner-merged arm
# and approval in staging-apply.

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/load-test-accounts.sh
      - scripts/aws/load-test-accounts-action.txt
      - scripts/aws/load-test-accounts.test.mjs
      - .github/workflows/aws-load-test-accounts.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-load-test-accounts
  cancel-in-progress: false

jobs:
  apply-gate:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    # Cost cut 7: a gate-only job on the 1-vCPU ubuntu-slim runner (a third of the ubuntu-latest rate).
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      # Cost cut 7 (owner-approved 14 Nov; proved in run 43619379498): the tools this gate uses must be on ubuntu-slim;
      # a missing one fails the gate (it refuses).
      - name: Check the gate's tools (ubuntu-slim)
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash curl jq python3 git; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }
          done
          echo "CUT7_TOOLS bash=${BASH_VERSION} curl=$(curl --version | head -1 | cut -d' ' -f2) $(jq --version) python3=$(python3 -c 'import platform; print(platform.python_version())') $(git --version)"
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/load-test-accounts-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/load-test-accounts-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Pre-private: GitHub Pro does not enforce the approval environment's required reviewer on a private repo. Any guard
      # value but plan/discover also needs its arm commit to be a pull request merged by adityaps70 whose guard file
      # names the exact commit it arms (scripts/aws/arm-commit-guard.sh).
      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/load-test-accounts-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/load-test-accounts-action.txt
          RUNNER_FILES: "scripts/aws/load-test-accounts.sh scripts/aws/load-test-accounts.test.mjs"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          watched = os.environ["RUNNER_FILES"].split()
          before, after = event.get("before") or "", event.get("after") or ""
          files = None
          # Cost cut 7 (14 Nov): the files this push changed, from the compare API. It is exact for any push, a pull
          # request merge included (the commit list in the event is not). Under 300 files only; any doubt runs the plan.
          if len(before) == 40 and before.strip("0") and len(after) == 40:
              try:
                  url = "%s/repos/%s/compare/%s...%s" % (os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], before, after)
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  data = json.load(urllib.request.urlopen(request, timeout=20))
                  changed = data.get("files") or []
                  if data.get("status") == "ahead" and 0 < len(changed) < 300:
                      files = {f["filename"] for f in changed} | {f["previous_filename"] for f in changed if f.get("previous_filename")}
              except Exception:
                  files = None
          if files is None:
              commits = event.get("commits") or []
              listed = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
              # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
              complete = bool(commits) and len(commits) < 2048 and bool(listed)
              files = listed if complete else None
          print("true" if files is not None and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ubuntu-slim
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  load-test-accounts:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') && (github.ref == 'refs/heads/feat/aws-native-phase-0-1') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head (with history, to check the deployed image)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify runner contract
        shell: bash
        run: |
          node --test scripts/aws/load-test-accounts.test.mjs

      - name: Resolve the action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/load-test-accounts-action.txt | tr -d '[:space:]')"
          case "$ACTION" in plan|create-once|delete-once) ;; *) echo "Unsupported load-test accounts action: $ACTION" >&2; exit 1 ;; esac
          if [[ "$ACTION" != plan ]]; then
            [[ "$GITHUB_EVENT_NAME" == push ]] || { echo "$ACTION is permitted only from an exact branch push." >&2; exit 1; }
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Guard against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || {
            echo "Branch moved after the load-test accounts run started; refusing stale execution." >&2
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || {
            echo "Refusing the load-test accounts run in unexpected AWS account $ACCOUNT_ID." >&2
            exit 1
          }

      # The task runs from the deployed web image, which must already contain the worker. A plan pushed before the
      # round's deploy stops here (green, nothing run); an apply refuses.
      - name: Require a deployed image that has the accounts worker
        id: image
        env:
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          TASKDEF="$(aws ecs describe-services --region "$AWS_REGION" --cluster sea-n-shore-staging --services sea-n-shore-staging-web --query 'services[0].taskDefinition' --output text)"
          IMAGE="$(aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$TASKDEF" --query "taskDefinition.containerDefinitions[?name=='web'].image | [0]" --output text)"
          IMAGE_SHA="$(sed -E 's/^.*:([0-9a-f]{40})(-[0-9]+)?$/\1/' <<<"$IMAGE")"
          echo "Deployed image tag: ${IMAGE##*:}"
          if [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$IMAGE_SHA:scripts/workers/load-test-accounts.ts" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [[ "$ACTION" == "plan" ]]; then
            echo "The deployed image predates the accounts worker; the plan runs after the Phase 1 deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "The deployed image does not contain the accounts worker; refusing." >&2
            exit 1
          fi

      - name: Discover bootstrap instance
        if: steps.image.outputs.ready == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "instance_id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"

      - name: Run the guarded load-test accounts task through SSM
        if: steps.image.outputs.ready == 'true'
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$ACTION" in plan|create-once|delete-once) ;; *) exit 1 ;; esac
          bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" publish "$TRIGGER_SHA"
          python3 - "$TRIGGER_SHA" "$ACTION" > /tmp/ssm-parameters.json <<'PYTHON'
          import json, shlex, sys
          import os, sys; sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts", "aws")); from ci_checkout import host_checkout
          sha = sys.argv[1]
          action = sys.argv[2]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-load-test-accounts.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
          {host_checkout('$WORK_DIR', sha)}
          export LOAD_TEST_ACCOUNTS_EXPECTED_SHA={sha}
          export LOAD_TEST_ACCOUNTS_ACTION={action}
          bash scripts/aws/load-test-accounts.sh
          """
          print(json.dumps({"executionTimeout": ["1200"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore load-test accounts $TRIGGER_SHA" --timeout-seconds 1200 --parameters file:///tmp/ssm-parameters.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface the accounts report
        if: steps.image.outputs.ready == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          STDOUT_CONTENT=$(jq -r '.StandardOutputContent // empty' /tmp/result.json)
          printf '%s\n' "$STDOUT_CONTENT"
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          [[ -z "$STDERR_CONTENT" ]] || printf '%s\n' "$STDERR_CONTENT" >&2
          [[ "$(jq -r '.Status' /tmp/result.json)" == Success ]]
          if [[ "$ACTION" == "plan" ]]; then
            grep -q '^LOAD_TEST_ACCOUNTS_PLAN_ONLY_NO_CHANGE$' <<<"$STDOUT_CONTENT"
          elif [[ "$ACTION" == "create-once" ]]; then
            grep -q '^LOAD_TEST_ACCOUNTS_CREATE_ONCE_VERIFIED=true$' <<<"$STDOUT_CONTENT"
          else
            grep -q '^LOAD_TEST_ACCOUNTS_DELETE_ONCE_VERIFIED=true$' <<<"$STDOUT_CONTENT"
          fi

      - name: Delete the host checkout bundle
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" cleanup
