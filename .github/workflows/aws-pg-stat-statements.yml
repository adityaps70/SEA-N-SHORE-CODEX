name: AWS pg_stat_statements

# Round P3 (B9): installs the pg_stat_statements extension on Aurora. It runs only when
# scripts/aws/pg-stat-statements-action.txt reads "install-once <sha>" from an owner-merged arm PR, after
# approval in staging-apply; "plan" only runs the contract test. The only change it can make is
# CREATE EXTENSION IF NOT EXISTS pg_stat_statements, and only when Aurora already preloads the library (no
# reboot); otherwise it reports PGSS_REBOOT_REQUIRED and changes nothing
# (scripts/aws/pg-stat-statements-guard.test.mjs).

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/pg-stat-statements-action.txt
      - scripts/aws/pg-stat-statements.cjs
      - scripts/aws/pg-stat-statements-remote.py
      - scripts/aws/pg-stat-statements-guard.test.mjs
      - .github/workflows/aws-pg-stat-statements.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-pg-stat-statements
  cancel-in-progress: false

jobs:
  apply-gate:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    # Gate-only job. Cost cut 7: vars.GATE_RUNNER=ubuntu-slim (a third of the ubuntu-latest rate) while the repo is private; GitHub does not serve ubuntu-slim to it while public.
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      # Cost cut 7 (owner-approved 14 Nov; proved in run 43619379498): the tools this gate uses must be on ubuntu-slim;
      # a missing one fails the gate (it refuses).
      - name: Check the gate's tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash curl jq python3 git; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }
          done
          echo "CUT7_TOOLS bash=${BASH_VERSION} curl=$(curl --version | head -1 | cut -d' ' -f2) $(jq --version) python3=$(python3 -c 'import platform; print(platform.python_version())') $(git --version)"
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/pg-stat-statements-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/pg-stat-statements-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            # Round 16 follow-up: read-only and test-data runs (E2E, audits, test-account cleanup) never wait.
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Pre-private: GitHub Pro does not enforce the approval environment's required reviewer on a private repo. Any guard
      # value but plan/discover also needs its arm commit to be a pull request merged by adityaps70 whose guard file
      # names the exact commit it arms (scripts/aws/arm-commit-guard.sh).
      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/pg-stat-statements-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/pg-stat-statements-action.txt
          RUNNER_FILES: "scripts/aws/pg-stat-statements.cjs scripts/aws/pg-stat-statements-remote.py scripts/aws/pg-stat-statements-guard.test.mjs"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          watched = os.environ["RUNNER_FILES"].split()
          before, after = event.get("before") or "", event.get("after") or ""
          files = None
          # Cost cut 7 (14 Nov): the files this push changed, from the compare API. It is exact for any push, a pull
          # request merge included (the commit list in the event is not). Under 300 files only; any doubt runs the plan.
          if len(before) == 40 and before.strip("0") and len(after) == 40:
              try:
                  url = "%s/repos/%s/compare/%s...%s" % (os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], before, after)
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  data = json.load(urllib.request.urlopen(request, timeout=20))
                  changed = data.get("files") or []
                  if data.get("status") == "ahead" and 0 < len(changed) < 300:
                      files = {f["filename"] for f in changed} | {f["previous_filename"] for f in changed if f.get("previous_filename")}
              except Exception:
                  files = None
          if files is None:
              commits = event.get("commits") or []
              listed = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
              # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
              complete = bool(commits) and len(commits) < 2048 and bool(listed)
              files = listed if complete else None
          print("true" if files is not None and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  pg-stat-statements:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') && (github.ref == 'refs/heads/feat/aws-native-phase-0-1') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify the pg_stat_statements contract
        run: node --test scripts/aws/pg-stat-statements-guard.test.mjs

      - name: Resolve the pg_stat_statements action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/pg-stat-statements-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            plan)
              echo "run_install=false" >> "$GITHUB_OUTPUT"
              ;;
            install-once)
              [[ "$GITHUB_EVENT_NAME" == push ]] || { echo "install-once is permitted only from an exact branch push." >&2; exit 1; }
              [[ "$GITHUB_REF" == refs/heads/feat/aws-native-phase-0-1 ]] || { echo "install-once is restricted to feat/aws-native-phase-0-1." >&2; exit 1; }
              echo "run_install=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported pg_stat_statements action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Guard against a moved branch
        if: steps.action.outputs.run_install == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after the run started; refusing a stale run." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.action.outputs.run_install == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        if: steps.action.outputs.run_install == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || { echo "Refusing pg_stat_statements in unexpected AWS account $ACCOUNT_ID." >&2; exit 1; }

      - name: Discover bootstrap instance
        if: steps.action.outputs.run_install == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          [[ "$COUNT" -eq 1 ]] || { echo "Expected exactly one running bootstrap; found $COUNT." >&2; exit 1; }
          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      - name: Install pg_stat_statements (no reboot)
        if: steps.action.outputs.run_install == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          PGSS_ACTION: install
        run: node scripts/aws/pg-stat-statements.cjs

      - name: Plan-only guard status
        if: steps.action.outputs.run_install != 'true'
        run: echo 'PG_STAT_STATEMENTS_PLAN_ONLY=true'
