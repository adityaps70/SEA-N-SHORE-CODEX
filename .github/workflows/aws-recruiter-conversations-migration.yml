name: AWS Recruiter Conversations Migration

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - infra/aws/database/migrations/0091_recruiter_conversations.sql
      - scripts/aws/recruiter-conversations-migration.sh
      - scripts/aws/recruiter-conversations-migration-action.txt
      - scripts/aws/recruiter-conversations-migration.test.mjs
      - .github/workflows/aws-recruiter-conversations-migration.yml
  workflow_dispatch:
    inputs:
      requested_action:
        description: "Plan only or apply the recruiter conversations migrations (0091)"
        required: true
        type: choice
        options:
          - plan
          - migrate-once
        default: plan
      expected_sha:
        description: "Exact feature-branch SHA approved for execution"
        required: false
        type: string
      confirmation:
        description: "Required only for migrate-once"
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-recruiter-conversations-migration
  cancel-in-progress: false

jobs:
  apply-gate:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/recruiter-conversations-migration-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/recruiter-conversations-migration-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Pre-private: GitHub Pro does not enforce the approval environment's required reviewer on a private repo. Any guard
      # value but plan/discover also needs its arm commit to be a pull request merged by adityaps70 whose guard file
      # names the exact commit it arms (scripts/aws/arm-commit-guard.sh).
      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/recruiter-conversations-migration-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GUARD_FILE: scripts/aws/recruiter-conversations-migration-action.txt
          RUNNER_FILES: "infra/aws/database/migrations/0091_recruiter_conversations.sql scripts/aws/recruiter-conversations-migration.sh scripts/aws/recruiter-conversations-migration.test.mjs"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          commits = event.get("commits") or []
          files = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
          watched = os.environ["RUNNER_FILES"].split()
          # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
          complete = bool(commits) and len(commits) < 2048 and bool(files)
          print("true" if complete and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ubuntu-latest
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  recruiter-conversations-migration:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') && (github.ref == 'refs/heads/feat/aws-native-phase-0-1') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify migration contract
        shell: bash
        run: |
          node scripts/aws/recruiter-conversations-migration.test.mjs

      - name: Validate migration action
        id: action
        env:
          REQUESTED_ACTION: ${{ inputs.requested_action }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            ACTION="${REQUESTED_ACTION:-plan}"
            case "$ACTION" in plan|migrate-once) ;; *) echo "Unsupported recruiter conversations migration action: $ACTION" >&2; exit 1 ;; esac
            if [[ "$ACTION" == "migrate-once" ]]; then
              [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be an exact commit SHA." >&2; exit 1; }
              [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "expected_sha does not match GITHUB_SHA." >&2; exit 1; }
              [[ "$CONFIRMATION" == "I_APPROVE_RECRUITER_CONVERSATIONS_STAGING_MIGRATION" ]] || { echo "Explicit launch confirmation is required." >&2; exit 1; }
            fi
          else
            ACTION="$(cut -d' ' -f1 < scripts/aws/recruiter-conversations-migration-action.txt | tr -d '[:space:]')"
            case "$ACTION" in plan|migrate-once) ;; *) echo "Unsupported recruiter conversations migration action: $ACTION" >&2; exit 1 ;; esac
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Guard migration against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || {
            echo "Branch moved after recruiter conversations migration started; refusing stale execution." >&2
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || {
            echo "Refusing recruiter conversations migration in unexpected AWS account $ACCOUNT_ID." >&2
            exit 1
          }

      - name: Discover bootstrap instance
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "instance_id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"

      - name: Send guarded recruiter conversations migration through SSM
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$ACTION" in plan|migrate-once) ;; *) exit 1 ;; esac
          bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" publish "$TRIGGER_SHA"
          python3 - "$TRIGGER_SHA" "$ACTION" > /tmp/ssm-parameters.json <<'PYTHON'
          import json, shlex, sys
          import os, sys; sys.path.insert(0, os.path.join(os.environ["GITHUB_WORKSPACE"], "scripts", "aws")); from ci_checkout import host_checkout
          sha = sys.argv[1]
          action = sys.argv[2]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-recruiter-conversations.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
          {host_checkout('$WORK_DIR', sha)}
          export RECRUITER_CONVERSATIONS_MIGRATION_EXPECTED_SHA={sha}
          export RECRUITER_CONVERSATIONS_MIGRATION_ACTION={action}
          bash scripts/aws/recruiter-conversations-migration.sh
          """
          print(json.dumps({"executionTimeout": ["1200"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore recruiter conversations migration $TRIGGER_SHA" --timeout-seconds 1200 --parameters file:///tmp/ssm-parameters.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface migration evidence
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          STDOUT_CONTENT=$(jq -r '.StandardOutputContent // empty' /tmp/result.json)
          printf '%s\n' "$STDOUT_CONTENT"
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          [[ -z "$STDERR_CONTENT" ]] || printf '%s\n' "$STDERR_CONTENT" >&2
          [[ "$(jq -r '.Status' /tmp/result.json)" == Success ]]
          # evidence:begin
          # Each path is judged only by the line that path prints last: a plan run ends with PLAN_ONLY_NO_APPLY, an
          # apply run with APPLY_VERIFIED=true, and a run with nothing pending with ALREADY_APPLIED=true.
          # PLAN_VERIFIED is printed on the plan path only, so it is never required here (requiring it on every run
          # turned successful apply runs red).
          if [[ "$ACTION" == "plan" ]]; then
            EVIDENCE='^RECRUITER_CONVERSATIONS_MIGRATION_PLAN_ONLY_NO_APPLY$\|^RECRUITER_CONVERSATIONS_MIGRATION_ALREADY_APPLIED=true$'
          else
            EVIDENCE='^RECRUITER_CONVERSATIONS_MIGRATION_APPLY_VERIFIED=true$\|^RECRUITER_CONVERSATIONS_MIGRATION_ALREADY_APPLIED=true$'
          fi
          grep -q "$EVIDENCE" <<<"$STDOUT_CONTENT" || { echo "No $ACTION evidence line in the runner output." >&2; exit 1; }
          # evidence:end

      - name: Delete the host checkout bundle
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" cleanup
