name: AWS Onboarding E2E

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/onboarding-e2e-action.txt
      - scripts/aws/onboarding-e2e-guard.test.mjs
      - scripts/aws/onboarding-staging-e2e.mjs
      - scripts/aws/onboarding-e2e-persistence-audit.sh
      - scripts/aws/feed-avatar-staging-e2e.mjs
      - .github/workflows/aws-onboarding-e2e.yml
  workflow_dispatch:
    inputs:
      requested_action:
        description: "Plan, read-only probe or run the one-shot onboarding E2E"
        required: true
        type: choice
        options:
          - plan
          - probe
          - run-once
        default: plan
      expected_sha:
        description: "Exact feature-branch SHA approved for E2E"
        required: false
        type: string
      confirmation:
        description: "Required only for run-once"
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-onboarding-e2e
  cancel-in-progress: false

jobs:
  onboarding-e2e:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
      COGNITO_POOL_NAME: sea-n-shore-staging-users
      SITE_URL: https://d3prih0q6jofyr.cloudfront.net

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Resolve onboarding E2E action
        id: action
        env:
          REQUESTED_ACTION: ${{ inputs.requested_action }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            ACTION="${REQUESTED_ACTION:-plan}"
          else
            ACTION="$(tr -d '[:space:]' < scripts/aws/onboarding-e2e-action.txt)"
          fi

          echo "ONBOARDING_E2E_ACTION=$ACTION" >> "$GITHUB_ENV"
          case "$ACTION" in
            plan)
              echo "run_probe=false" >> "$GITHUB_OUTPUT"
              echo "run_e2e=false" >> "$GITHUB_OUTPUT"
              ;;
            probe)
              echo "run_probe=true" >> "$GITHUB_OUTPUT"
              echo "run_e2e=false" >> "$GITHUB_OUTPUT"
              ;;
            run-once)
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "expected_sha must be an exact commit SHA." >&2; exit 1; }
                [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "expected_sha does not match GITHUB_SHA." >&2; exit 1; }
                [[ "$CONFIRMATION" == "I_APPROVE_MEMBERSHIP_STAGING_ONE_SHOT" ]] || { echo "Explicit launch confirmation is required." >&2; exit 1; }
              fi
              echo "run_probe=false" >> "$GITHUB_OUTPUT"
              echo "run_e2e=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported onboarding E2E action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.action.outputs.run_probe == 'true' || steps.action.outputs.run_e2e == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || { echo "Exact-head AWS Infrastructure CI is not green." >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-head AWS Infrastructure CI." >&2
          exit 1

      - name: Guard execution against a moved branch
        if: steps.action.outputs.run_probe == 'true' || steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || {
            echo "Branch moved after this onboarding E2E started; refusing stale execution." >&2
            exit 1
          }

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.action.outputs.run_probe == 'true' || steps.action.outputs.run_e2e == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Discover bootstrap instance
        if: steps.action.outputs.run_probe == 'true' || steps.action.outputs.run_e2e == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          [[ "$COUNT" -eq 1 ]] || { echo "Expected exactly one running bootstrap; found $COUNT." >&2; exit 1; }
          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      - name: Send read-only Cognito admin capability probe through SSM
        if: steps.action.outputs.run_probe == 'true'
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$COGNITO_POOL_NAME" > /tmp/onboarding-e2e-probe.json <<'PYTHON'
          import json, shlex, sys
          pool_name = sys.argv[1]
          script = f"""set -euo pipefail
          AWS_REGION=ap-south-1
          POOL_NAME={shlex.quote(pool_name)}
          POOL_ID=$(aws cognito-idp list-user-pools --region \"$AWS_REGION\" --max-results 60 --query \"UserPools[?Name=='$POOL_NAME'].Id | [0]\" --output text)
          [[ -n \"$POOL_ID\" && \"$POOL_ID\" != \"None\" ]] || {{ echo 'Cognito staging user pool was not found.' >&2; exit 1; }}
          PROBE_USERNAME=sea-n-shore-e2e-permission-probe@example.invalid
          set +e
          PROBE_OUTPUT=$(aws cognito-idp admin-get-user --region \"$AWS_REGION\" --user-pool-id \"$POOL_ID\" --username \"$PROBE_USERNAME\" 2>&1)
          PROBE_STATUS=$?
          set -e
          if [[ $PROBE_STATUS -eq 0 ]]; then
            echo 'Probe username unexpectedly exists; refusing to use an existing account as a capability probe.' >&2
            exit 1
          fi
          if grep -q 'UserNotFoundException' <<<\"$PROBE_OUTPUT\"; then
            echo 'COGNITO_ADMIN_PROBE_AVAILABLE=true'
            exit 0
          fi
          echo 'COGNITO_ADMIN_PROBE_AVAILABLE=false'
          printf '%s\n' \"$PROBE_OUTPUT\" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{{2,}}/[redacted-email]/g' >&2
          exit 1
          """
          print(json.dumps({"executionTimeout": ["300"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore onboarding E2E read-only probe $TRIGGER_SHA" --timeout-seconds 300 --parameters file:///tmp/onboarding-e2e-probe.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface read-only probe evidence
        if: steps.action.outputs.run_probe == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/onboarding-e2e-probe-result.json
          echo "=== ONBOARDING E2E COGNITO ADMIN PROBE STDOUT ==="
          jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-probe-result.json
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/onboarding-e2e-probe-result.json)
          [[ -z "$STDERR_CONTENT" ]] || { echo "=== ONBOARDING E2E COGNITO ADMIN PROBE STDERR ===" >&2; printf '%s\n' "$STDERR_CONTENT" >&2; }
          FINAL_STATUS=$(jq -r '.Status' /tmp/onboarding-e2e-probe-result.json)
          [[ "$FINAL_STATUS" == Success ]]
          jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-probe-result.json | grep -q '^COGNITO_ADMIN_PROBE_AVAILABLE=true$'

      - name: Use Node 22 for staging browser E2E
        if: steps.action.outputs.run_e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser E2E dependencies
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium

      - name: Generate disposable onboarding identities
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SEAFARER_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-seafarer@example.com"
          SHORE_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-shore@example.com"
          RECRUITER_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-recruiter@example.com"
          TRAINER_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-trainer@example.com"
          STUDENT_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-student@example.com"
          FAMILY_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-family@example.com"
          ENTHUSIAST_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-enthusiast@example.com"
          OTHER_EMAIL="sea-n-shore-e2e-${GITHUB_RUN_ID}-other@example.com"
          SEAFARER_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Seafarer9"
          SHORE_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Shore9"
          RECRUITER_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Recruiter9"
          TRAINER_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Trainer9"
          STUDENT_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Student9"
          FAMILY_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Family9"
          ENTHUSIAST_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Enthusiast9"
          OTHER_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Other9"
          for SECRET_VALUE in "$SEAFARER_PASSWORD" "$SHORE_PASSWORD" "$RECRUITER_PASSWORD" "$TRAINER_PASSWORD" "$STUDENT_PASSWORD" "$FAMILY_PASSWORD" "$ENTHUSIAST_PASSWORD" "$OTHER_PASSWORD"; do echo "::add-mask::$SECRET_VALUE"; done
          {
            echo "E2E_SEAFARER_EMAIL=$SEAFARER_EMAIL"
            echo "E2E_SHORE_EMAIL=$SHORE_EMAIL"
            echo "E2E_RECRUITER_EMAIL=$RECRUITER_EMAIL"
            echo "E2E_TRAINER_EMAIL=$TRAINER_EMAIL"
            echo "E2E_STUDENT_EMAIL=$STUDENT_EMAIL"
            echo "E2E_FAMILY_EMAIL=$FAMILY_EMAIL"
            echo "E2E_ENTHUSIAST_EMAIL=$ENTHUSIAST_EMAIL"
            echo "E2E_OTHER_EMAIL=$OTHER_EMAIL"
            echo "E2E_SEAFARER_PASSWORD=$SEAFARER_PASSWORD"
            echo "E2E_SHORE_PASSWORD=$SHORE_PASSWORD"
            echo "E2E_RECRUITER_PASSWORD=$RECRUITER_PASSWORD"
            echo "E2E_TRAINER_PASSWORD=$TRAINER_PASSWORD"
            echo "E2E_STUDENT_PASSWORD=$STUDENT_PASSWORD"
            echo "E2E_FAMILY_PASSWORD=$FAMILY_PASSWORD"
            echo "E2E_ENTHUSIAST_PASSWORD=$ENTHUSIAST_PASSWORD"
            echo "E2E_OTHER_PASSWORD=$OTHER_PASSWORD"
            echo "E2E_SEAFARER_NAME=E2E Seafarer ${GITHUB_RUN_ID}"
            echo "E2E_SHORE_NAME=E2E Shore ${GITHUB_RUN_ID}"
            echo "E2E_RECRUITER_NAME=E2E Recruiter ${GITHUB_RUN_ID}"
            echo "E2E_TRAINER_NAME=E2E Trainer ${GITHUB_RUN_ID}"
            echo "E2E_STUDENT_NAME=E2E Student ${GITHUB_RUN_ID}"
            echo "E2E_FAMILY_NAME=E2E Family ${GITHUB_RUN_ID}"
            echo "E2E_ENTHUSIAST_NAME=E2E Enthusiast ${GITHUB_RUN_ID}"
            echo "E2E_OTHER_NAME=E2E Other ${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"
      - name: Verify public sign-up UI creates eight disposable users
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: signup
        shell: bash
        run: node scripts/aws/onboarding-staging-e2e.mjs

      - name: Confirm disposable sign-ups through staging bootstrap
        if: steps.action.outputs.run_e2e == 'true'
        id: confirm
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$COGNITO_POOL_NAME" "$E2E_SEAFARER_EMAIL" "$E2E_SHORE_EMAIL" "$E2E_RECRUITER_EMAIL" "$E2E_TRAINER_EMAIL" "$E2E_STUDENT_EMAIL" "$E2E_FAMILY_EMAIL" "$E2E_ENTHUSIAST_EMAIL" "$E2E_OTHER_EMAIL" > /tmp/onboarding-e2e-confirm.json <<'PYTHON'
          import json, shlex, sys
          pool_name, *emails = sys.argv[1:]
          for email in emails:
              if not email.startswith('sea-n-shore-e2e-') or not email.endswith('@example.com'):
                  raise SystemExit('Unsafe disposable Cognito username')
          quoted = ' '.join(shlex.quote(x) for x in emails)
          script = f"""set -euo pipefail
          AWS_REGION=ap-south-1
          POOL_NAME={shlex.quote(pool_name)}
          POOL_ID=$(aws cognito-idp list-user-pools --region \"$AWS_REGION\" --max-results 60 --query \"UserPools[?Name=='$POOL_NAME'].Id | [0]\" --output text)
          [[ -n \"$POOL_ID\" && \"$POOL_ID\" != \"None\" ]]
          for EMAIL in {quoted}; do
            [[ \"$EMAIL\" == sea-n-shore-e2e-* && \"$EMAIL\" == *@example.com ]]
            aws cognito-idp admin-confirm-sign-up --region \"$AWS_REGION\" --user-pool-id \"$POOL_ID\" --username \"$EMAIL\"
          done
          echo 'ONBOARDING_E2E_ADMIN_CONFIRM_VERIFIED=true'
          """
          print(json.dumps({"executionTimeout": ["300"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore onboarding E2E confirm ${GITHUB_SHA}" --timeout-seconds 300 --parameters file:///tmp/onboarding-e2e-confirm.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for disposable sign-up confirmation
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.confirm.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/onboarding-e2e-confirm-result.json
          jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-confirm-result.json
          [[ "$(jq -r '.Status' /tmp/onboarding-e2e-confirm-result.json)" == Success ]]
          jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-confirm-result.json | grep -q '^ONBOARDING_E2E_ADMIN_CONFIRM_VERIFIED=true$'

      - name: Run staging sign-in and onboarding browser journeys
        id: journeys
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: journeys
        shell: bash
        run: node scripts/aws/onboarding-staging-e2e.mjs

      - name: Verify authenticated Home feed avatar hydration
        id: feed_avatar
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: node scripts/aws/feed-avatar-staging-e2e.mjs

      - name: Upload Home feed avatar proof
        if: always() && steps.action.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sea-n-shore-feed-avatar-e2e
          path: /tmp/sea-n-shore-feed-avatar-e2e.png
          if-no-files-found: warn
          retention-days: 3

      - name: Audit persona persistence through SSM
        if: always() && steps.action.outputs.run_e2e == 'true' && steps.journeys.outcome == 'success' && steps.instance.outputs.instance_id != ''
        id: audit
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TRIGGER_SHA" "$E2E_SEAFARER_EMAIL" "$E2E_SHORE_EMAIL" "$E2E_RECRUITER_EMAIL" "$E2E_TRAINER_EMAIL" "$E2E_STUDENT_EMAIL" "$E2E_FAMILY_EMAIL" "$E2E_ENTHUSIAST_EMAIL" "$E2E_OTHER_EMAIL" > /tmp/onboarding-e2e-audit.json <<'PYTHON'
          import json, shlex, sys
          sha, *emails = sys.argv[1:]
          keys = ['seafarer', 'shore', 'recruiter', 'trainer', 'student', 'family', 'enthusiast', 'other']
          if len(emails) != len(keys):
              raise SystemExit('Expected eight disposable onboarding identities')
          for key, email in zip(keys, emails):
              expected_prefix = f'sea-n-shore-e2e-'
              expected_suffix = f'-{key}@example.com'
              if not email.startswith(expected_prefix) or not email.endswith(expected_suffix):
                  raise SystemExit(f'Unsafe disposable onboarding identity for {key}')
          exports = '\n'.join(
              f"export E2E_{key.upper()}_EMAIL={shlex.quote(email)}"
              for key, email in zip(keys, emails)
          )
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-onboarding-audit.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$WORK_DIR/repo"
          cd "$WORK_DIR/repo"
          git checkout --quiet --detach {sha}
          test "$(git rev-parse HEAD)" = "{sha}"
          export ONBOARDING_E2E_EXPECTED_SHA={sha}
          {exports}
          bash scripts/aws/onboarding-e2e-persistence-audit.sh
          """
          print(json.dumps({"executionTimeout": ["600"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore onboarding E2E persistence audit $TRIGGER_SHA" --timeout-seconds 600 --parameters file:///tmp/onboarding-e2e-audit.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface persistence evidence
        if: steps.audit.outputs.command_id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.audit.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/onboarding-e2e-audit-result.json
          echo "=== ONBOARDING E2E PERSISTENCE AUDIT STDOUT ==="
          jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-audit-result.json
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/onboarding-e2e-audit-result.json)
          [[ -z "$STDERR_CONTENT" ]] || { echo "=== ONBOARDING E2E PERSISTENCE AUDIT STDERR ===" >&2; printf '%s\n' "$STDERR_CONTENT" >&2; }
          [[ "$(jq -r '.Status' /tmp/onboarding-e2e-audit-result.json)" == Success ]]
          jq -r '.StandardOutputContent // empty' /tmp/onboarding-e2e-audit-result.json | grep -q '^ONBOARDING_E2E_PERSONA_PERSISTENCE_VERIFIED=true$'
