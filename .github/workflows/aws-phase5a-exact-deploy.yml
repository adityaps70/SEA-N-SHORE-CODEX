name: AWS Phase 5A Exact Deploy

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-phase5a-exact-deploy.yml

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 35
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      AWS_COGNITO_ALLOW_INSECURE_HTTP_COOKIES: "true"
      AWS_MEDIA_BUCKET: sea-n-shore-staging-310356785722-media
      AURORA_HOST: sea-n-shore-staging-aurora.cluster-cvaiukw021g5.ap-south-1.rds.amazonaws.com
      AURORA_PORT: "5432"
      AURORA_DATABASE: sea_n_shore
      AURORA_SECRET_ARN: arn:aws:secretsmanager:ap-south-1:310356785722:secret:rds!cluster-7bd593b0-cb50-4dbb-9e93-6e7bbb6d3fc1-mL7X5H
      LOG_GROUP: /ecs/sea-n-shore-staging/web
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Wait for exact-head AWS Infrastructure CI
        run: |
          set -euo pipefail
          echo "Waiting for AWS Infrastructure CI on $GITHUB_SHA"
          for attempt in $(seq 1 120); do
            RUNS=$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=20")
            STATUS=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$RUNS")
            CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$RUNS")
            echo "CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || { echo "Exact-head CI did not pass." >&2; exit 1; }
              break
            fi
            sleep 5
          done
          test "$STATUS" = "completed" || { echo "Timed out waiting for exact-head CI." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate staging configuration
        run: |
          set -euo pipefail
          for name in AWS_REGION ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_DEFINITION ECS_CONTAINER_NAME NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY AWS_MEDIA_BUCKET AURORA_HOST AURORA_PORT AURORA_DATABASE AURORA_SECRET_ARN; do
            test -n "${!name:-}" || { echo "Missing staging value: $name" >&2; exit 1; }
          done
          OLD_TASK_ARN=$(aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          echo "OLD_TASK_ARN=$OLD_TASK_ARN" >> "$GITHUB_ENV"
          echo "Rollback task definition: $OLD_TASK_ARN"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable Phase 5A image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Register S3-enabled ECS task definition
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail
          AURORA_USER_SECRET="${AURORA_SECRET_ARN}:username::"
          AURORA_PASSWORD_SECRET="${AURORA_SECRET_ARN}:password::"
          aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$ECS_TASK_DEFINITION" --query taskDefinition --output json > /tmp/task-current.json
          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg NAME "$ECS_CONTAINER_NAME" \
            --arg SITE "$NEXT_PUBLIC_SITE_URL" \
            --arg SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL" \
            --arg SUPABASE_KEY "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
            --arg MEDIA_BUCKET "$AWS_MEDIA_BUCKET" \
            --arg AURORA_HOST "$AURORA_HOST" \
            --arg AURORA_PORT "$AURORA_PORT" \
            --arg AURORA_DATABASE "$AURORA_DATABASE" \
            --arg AURORA_USER_SECRET "$AURORA_USER_SECRET" \
            --arg AURORA_PASSWORD_SECRET "$AURORA_PASSWORD_SECRET" \
            '
            del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
            | .containerDefinitions |= map(
                if .name == $NAME then
                  .image = $IMAGE
                  | .environment = (
                      ((.environment // []) | map(select(
                        .name != "NEXT_PUBLIC_SITE_URL" and
                        .name != "NEXT_PUBLIC_SUPABASE_URL" and
                        .name != "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" and
                        .name != "AWS_COGNITO_ALLOW_INSECURE_HTTP_COOKIES" and
                        .name != "AWS_MEDIA_BUCKET" and
                        .name != "AURORA_HOST" and
                        .name != "AURORA_PORT" and
                        .name != "AURORA_DATABASE" and
                        .name != "AURORA_SSL"
                      ))) + [
                        {"name":"NEXT_PUBLIC_SITE_URL","value":$SITE},
                        {"name":"NEXT_PUBLIC_SUPABASE_URL","value":$SUPABASE_URL},
                        {"name":"NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY","value":$SUPABASE_KEY},
                        {"name":"AWS_COGNITO_ALLOW_INSECURE_HTTP_COOKIES","value":"true"},
                        {"name":"AWS_MEDIA_BUCKET","value":$MEDIA_BUCKET},
                        {"name":"AURORA_HOST","value":$AURORA_HOST},
                        {"name":"AURORA_PORT","value":$AURORA_PORT},
                        {"name":"AURORA_DATABASE","value":$AURORA_DATABASE},
                        {"name":"AURORA_SSL","value":"true"}
                      ]
                    )
                  | .secrets = (
                      ((.secrets // []) | map(select(.name != "AURORA_USER" and .name != "AURORA_PASSWORD"))) + [
                        {"name":"AURORA_USER","valueFrom":$AURORA_USER_SECRET},
                        {"name":"AURORA_PASSWORD","valueFrom":$AURORA_PASSWORD_SECRET}
                      ]
                    )
                else . end
              )
            ' /tmp/task-current.json > /tmp/task-new.json
          NEW_TASK_ARN=$(aws ecs register-task-definition --region "$AWS_REGION" --cli-input-json file:///tmp/task-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "NEW_TASK_ARN=$NEW_TASK_ARN" >> "$GITHUB_ENV"
          echo "New task definition: $NEW_TASK_ARN"

      - name: Deploy and wait for ECS stability
        run: |
          set -euo pipefail
          aws ecs update-service --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEW_TASK_ARN" --force-new-deployment >/dev/null
          aws ecs wait services-stable --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Verify live runtime shape
        run: |
          set -euo pipefail
          aws ecs describe-services --region "$AWS_REGION" --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --output json > /tmp/service.json
          jq '.services[0] | {taskDefinition,desiredCount,runningCount,pendingCount,deployments:[.deployments[]|{status,rolloutState,taskDefinition,desiredCount,runningCount,pendingCount,failedTasks}]}' /tmp/service.json
          test "$(jq -r '.services[0].taskDefinition' /tmp/service.json)" = "$NEW_TASK_ARN"
          test "$(jq -r '.services[0].desiredCount' /tmp/service.json)" = "1"
          test "$(jq -r '.services[0].runningCount' /tmp/service.json)" = "1"
          test "$(jq -r '.services[0].pendingCount' /tmp/service.json)" = "0"
          test "$(jq -r '.services[0].deployments[0].rolloutState' /tmp/service.json)" = "COMPLETED"
          test "$(jq -r '.services[0].deployments[0].failedTasks' /tmp/service.json)" = "0"
          aws ecs describe-task-definition --region "$AWS_REGION" --task-definition "$NEW_TASK_ARN" --query taskDefinition --output json > /tmp/live-task.json
          jq --arg NAME "$ECS_CONTAINER_NAME" -e '.containerDefinitions[] | select(.name==$NAME) | (.environment // []) | any(.name=="AWS_MEDIA_BUCKET" and .value=="sea-n-shore-staging-310356785722-media")' /tmp/live-task.json >/dev/null
          echo "AWS_MEDIA_BUCKET_PRESENT=true"

      - name: Verify staging HTTP health
        run: |
          set -euo pipefail
          for endpoint in /api/health/phase4 /api/health/home; do
            ok=false
            for attempt in $(seq 1 20); do
              if BODY=$(curl -fsS --max-time 15 "${NEXT_PUBLIC_SITE_URL%/}$endpoint"); then
                echo "$endpoint => $BODY"
                ok=true
                break
              fi
              sleep 5
            done
            test "$ok" = true || { echo "Health failed: $endpoint" >&2; exit 1; }
          done

      - name: Review CloudWatch final gate
        run: |
          set -euo pipefail
          START_MS=$(( ( $(date +%s) - 7200 ) * 1000 ))
          aws logs filter-log-events --region "$AWS_REGION" --log-group-name "$LOG_GROUP" --start-time "$START_MS" --output json > /tmp/cloudwatch.json
          TOTAL=$(jq '.events | length' /tmp/cloudwatch.json)
          MATCHES=$(jq -r '.events[].message' /tmp/cloudwatch.json | grep -Eai '(^|[^[:alpha:]])(error|exception|unhandled|fatal|ECONNREFUSED|ETIMEDOUT|password authentication failed|database[^[:cntrl:]]*(failed|error)|auth[^[:cntrl:]]*(failed|error)|HTTP[[:space:]]+5[0-9][0-9])([^[:alpha:]]|$)' || true)
          MATCH_COUNT=$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')
          echo "CLOUDWATCH_EVENTS_REVIEWED=$TOTAL"
          echo "STRONG_RUNTIME_ERROR_MATCHES=$MATCH_COUNT"
          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "Repeating runtime error signatures detected." >&2
            printf '%s\n' "$MATCHES" | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' | head -n 10 >&2
            exit 1
          fi

      - name: Record deployment summary
        run: |
          echo "### Phase 5A exact deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- New task: \`$NEW_TASK_ARN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback task: \`$OLD_TASK_ARN\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Media bucket: \`$AWS_MEDIA_BUCKET\`" >> "$GITHUB_STEP_SUMMARY"
