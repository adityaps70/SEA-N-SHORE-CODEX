name: AWS Capacity and Media Report

# Round P3: a read-only report of what the stack runs, what it used over the last 14 days and what media is
# stored. When scripts/aws/capacity-media-report-window.txt reads "compare <start> <end|now> [split <time>]" it runs
# only the before-and-after comparison of that window with the same hours a day earlier (Round ARCH, Phase 5). It runs only when scripts/aws/capacity-media-report-action.txt reads "report-once <sha>" from an
# owner-merged arm PR, after approval in staging-apply; "plan" only runs the read-only contract test. The
# remote script describes, gets and lists only (scripts/aws/capacity-media-report-guard.test.mjs) and prints
# aggregates, never member data.

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/capacity-media-report-action.txt
      - scripts/aws/capacity-media-report-window.txt
      - scripts/aws/capacity-media-report.cjs
      - scripts/aws/capacity-media-report-remote.py
      - scripts/aws/capacity-media-report-guard.test.mjs
      - .github/workflows/aws-capacity-media-report.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-capacity-media-report
  cancel-in-progress: false

jobs:
  apply-gate:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/capacity-media-report-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      # Round 16: runs that change AWS wait for the owner's approval in 'staging-apply';
      # plans (and other read-only guard values) never wait.
      - name: Decide whether this run changes AWS
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/capacity-media-report-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            # Round 16 follow-up: read-only and test-data runs (E2E, audits, test-account cleanup) never wait.
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Guard action: $ACTION"

      # Pre-private: GitHub Pro does not enforce the approval environment's required reviewer on a private repo. Any guard
      # value but plan/discover also needs its arm commit to be a pull request merged by adityaps70 whose guard file
      # names the exact commit it arms (scripts/aws/arm-commit-guard.sh).
      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/capacity-media-report-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan (or discover) run only reads AWS, so it is skipped when this push changed none of
      # this runner's own scripts or tests (only its guard file and/or this workflow, e.g. a rearm).
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GUARD_FILE: scripts/aws/capacity-media-report-action.txt
          RUNNER_FILES: "scripts/aws/capacity-media-report-window.txt scripts/aws/capacity-media-report.cjs scripts/aws/capacity-media-report-remote.py scripts/aws/capacity-media-report-guard.test.mjs"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          commits = event.get("commits") or []
          files = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
          watched = os.environ["RUNNER_FILES"].split()
          # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
          complete = bool(commits) and len(commits) < 2048 and bool(files)
          print("true" if complete and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ubuntu-latest
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for a run that changes AWS
        run: echo "Approved in staging-apply."

  capacity-media-report:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') && (github.ref == 'refs/heads/feat/aws-native-phase-0-1') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify the read-only report contract
        run: node --test scripts/aws/capacity-media-report-guard.test.mjs

      - name: Resolve the report action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/capacity-media-report-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            plan)
              echo "run_report=false" >> "$GITHUB_OUTPUT"
              ;;
            report-once)
              [[ "$GITHUB_EVENT_NAME" == push ]] || { echo "report-once is permitted only from an exact branch push." >&2; exit 1; }
              [[ "$GITHUB_REF" == refs/heads/feat/aws-native-phase-0-1 ]] || { echo "report-once is restricted to feat/aws-native-phase-0-1." >&2; exit 1; }
              echo "run_report=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported capacity report action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Guard against a moved branch
        if: steps.action.outputs.run_report == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after the report started; refusing a stale run." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.action.outputs.run_report == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        if: steps.action.outputs.run_report == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || { echo "Refusing the report in unexpected AWS account $ACCOUNT_ID." >&2; exit 1; }

      - name: Discover bootstrap instance
        if: steps.action.outputs.run_report == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          [[ "$COUNT" -eq 1 ]] || { echo "Expected exactly one running bootstrap; found $COUNT." >&2; exit 1; }
          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      - name: Run the read-only capacity and media report
        if: steps.action.outputs.run_report == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: node scripts/aws/capacity-media-report.cjs

      - name: Plan-only guard status
        if: steps.action.outputs.run_report != 'true'
        run: echo 'CAPACITY_MEDIA_REPORT_PLAN_ONLY=true'
