name: AWS Legacy Dump Secure Upload URL

on:
  push:
    branches: [feat/aws-native-phase-0-1]
    paths:
      - .github/workflows/aws-legacy-dump-upload-url.yml

permissions:
  id-token: write
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "310356785722"
      - name: Generate 15-minute private PUT URL
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, hashlib, hmac, os, urllib.parse

          method = 'PUT'
          region = 'ap-south-1'
          service = 's3'
          bucket = 'sea-n-shore-staging-310356785722-media'
          key = 'private-migrations/beaufortmarine.sql'
          host = f'{bucket}.s3.{region}.amazonaws.com'
          endpoint = f'https://{host}/{urllib.parse.quote(key, safe="/~")}'
          access = os.environ['AWS_ACCESS_KEY_ID']
          secret = os.environ['AWS_SECRET_ACCESS_KEY']
          token = os.environ['AWS_SESSION_TOKEN']
          now = datetime.datetime.now(datetime.timezone.utc)
          amzdate = now.strftime('%Y%m%dT%H%M%SZ')
          datestamp = now.strftime('%Y%m%d')
          scope = f'{datestamp}/{region}/{service}/aws4_request'
          params = {
              'X-Amz-Algorithm': 'AWS4-HMAC-SHA256',
              'X-Amz-Credential': f'{access}/{scope}',
              'X-Amz-Date': amzdate,
              'X-Amz-Expires': '3600',
              'X-Amz-Security-Token': token,
              'X-Amz-SignedHeaders': 'host',
          }
          canonical_query = '&'.join(
              f'{urllib.parse.quote(k, safe="-_.~")}={urllib.parse.quote(v, safe="-_.~")}'
              for k, v in sorted(params.items())
          )
          canonical_uri = '/' + urllib.parse.quote(key, safe='/~')
          canonical_headers = f'host:{host}\n'
          payload_hash = 'UNSIGNED-PAYLOAD'
          canonical_request = '\n'.join([
              method, canonical_uri, canonical_query,
              canonical_headers, 'host', payload_hash,
          ])
          string_to_sign = '\n'.join([
              'AWS4-HMAC-SHA256',
              amzdate,
              scope,
              hashlib.sha256(canonical_request.encode()).hexdigest(),
          ])
          def sign(key_bytes, msg):
              return hmac.new(key_bytes, msg.encode(), hashlib.sha256).digest()
          k_date = sign(('AWS4' + secret).encode(), datestamp)
          k_region = sign(k_date, region)
          k_service = sign(k_region, service)
          k_signing = sign(k_service, 'aws4_request')
          signature = hmac.new(k_signing, string_to_sign.encode(), hashlib.sha256).hexdigest()
          url = endpoint + '?' + canonical_query + '&X-Amz-Signature=' + signature
          open('/tmp/legacy-upload-url.txt','w',encoding='utf-8').write(url + '\n')

          import base64, html, json
          expiration = (now + datetime.timedelta(hours=1)).strftime('%Y-%m-%dT%H:%M:%S.000Z')
          credential = f'{access}/{scope}'
          policy_doc = {
              'expiration': expiration,
              'conditions': [
                  {'bucket': bucket},
                  ['eq', '$key', key],
                  ['content-length-range', 13693941, 13693941],
                  {'x-amz-algorithm': 'AWS4-HMAC-SHA256'},
                  {'x-amz-credential': credential},
                  {'x-amz-date': amzdate},
                  {'x-amz-security-token': token},
                  {'success_action_status': '201'},
              ],
          }
          policy = base64.b64encode(json.dumps(policy_doc,separators=(',',':')).encode()).decode()
          post_signature = hmac.new(k_signing, policy.encode(), hashlib.sha256).hexdigest()
          fields = {
              'key': key,
              'x-amz-algorithm': 'AWS4-HMAC-SHA256',
              'x-amz-credential': credential,
              'x-amz-date': amzdate,
              'x-amz-security-token': token,
              'policy': policy,
              'x-amz-signature': post_signature,
              'success_action_status': '201',
          }
          hidden = '\n'.join(
              f'<input type="hidden" name="{html.escape(k)}" value="{html.escape(v, quote=True)}">'
              for k,v in fields.items()
          )
          page = f"""<!doctype html>
          <html><head><meta charset="utf-8"><title>Sea N Shore Legacy Upload</title>
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          body{{font-family:system-ui,-apple-system,sans-serif;background:#f5f8fa;color:#102a43;margin:0;padding:32px}}
          main{{max-width:680px;margin:0 auto;background:white;border:1px solid #d9e2ec;border-radius:18px;padding:28px;box-shadow:0 12px 36px rgba(16,42,67,.08)}}
          h1{{margin-top:0}} code{{word-break:break-all}} input[type=file]{{display:block;margin:18px 0;padding:14px;border:1px solid #bcccdc;border-radius:12px;width:100%;box-sizing:border-box}}
          button{{background:#0f7197;color:white;border:0;border-radius:999px;padding:13px 22px;font-weight:700;cursor:pointer}} button:disabled{{opacity:.55}}
          .note{{background:#eef7fb;border-radius:12px;padding:14px}} #status{{margin-top:16px;font-weight:600}}
          </style></head><body><main>
          <h1>Sea N Shore legacy user import</h1>
          <p>Select the original Beaufort Marine SQL dump. This upload is private, restricted to one temporary S3 object, and expires at <strong>{expiration}</strong>.</p>
          <div class="note">Expected file size: <strong>13,693,941 bytes</strong><br>Expected SHA-256: <code>f2a2b6b537b5ec1a373ec656409828d889a294aa3a0c7f5895165c1103430efd</code></div>
          <form id="upload" action="https://{host}/" method="post" enctype="multipart/form-data">
          {hidden}
          <input id="file" name="file" type="file" accept=".sql,text/plain,application/sql" required>
          <button id="button" type="submit">Verify & upload securely</button>
          <div id="status" role="status"></div>
          </form>
          <script>
          const expectedSize=13693941;
          const expectedHash='f2a2b6b537b5ec1a373ec656409828d889a294aa3a0c7f5895165c1103430efd';
          const form=document.getElementById('upload'), file=document.getElementById('file'), button=document.getElementById('button'), status=document.getElementById('status');
          form.addEventListener('submit',async(e)=>{{
            e.preventDefault();
            if(!file.files.length)return;
            const f=file.files[0];
            if(f.size!==expectedSize){{status.textContent='Wrong file size. Please select the original SQL dump.';return;}}
            button.disabled=true;status.textContent='Checking file fingerprint…';
            const digest=await crypto.subtle.digest('SHA-256',await f.arrayBuffer());
            const hash=Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
            if(hash!==expectedHash){{status.textContent='Fingerprint mismatch. Upload stopped.';button.disabled=false;return;}}
            status.textContent='Verified. Uploading privately to AWS…';
            form.submit();
          }});
          </script></main></body></html>"""
          open('/tmp/legacy-upload.html','w',encoding='utf-8').write(page)
          PY

      - name: Store URL as short-lived private artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacy-upload-package
          path: |
            /tmp/legacy-upload-url.txt
            /tmp/legacy-upload.html
          retention-days: 1
          if-no-files-found: error

