name: Community and Organization Upload Tests
on:
  push:
    branches:
      - chatgpt/community-direct-s3-20261009
  workflow_dispatch:
jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx vitest run src/features/community src/features/organizations
