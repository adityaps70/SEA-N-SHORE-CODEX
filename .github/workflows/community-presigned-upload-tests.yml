name: Community and Organization Upload Tests
on:
  push:
    branches:
      - chatgpt/community-direct-s3-20261009
  workflow_dispatch:
jobs:
  targeted-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@11.6.0
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/features/community src/features/organizations
