name: RSC 503 Read-only AWS Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required only to authenticate GitHub OIDC with AWS; no GitHub repo write rights.

jobs:
  last-24h-503:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      AWS_REGION: ap-south-1
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
    steps:
      - name: Checkout diagnostic script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require staging ECS variables
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SERVICE"
      - name: Assume existing diagnostic OIDC role with read-only session policy
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
          role-session-name: rsc503-readonly
          # Intersects with the existing role: denies all AWS mutations even if the
          # same base role is used by deployment workflows. No new IAM grants.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":[
            "sts:GetCallerIdentity",
            "cloudfront:ListDistributions",
            "wafv2:ListWebACLs","wafv2:GetWebACL","wafv2:GetSampledRequests",
            "cloudwatch:GetMetricData",
            "elasticloadbalancing:DescribeLoadBalancers","elasticloadbalancing:DescribeTargetHealth",
            "ecs:DescribeServices","ecs:DescribeTaskDefinition","ecs:DescribeTasks","ecs:ListTasks",
            "logs:FilterLogEvents"],"Resource":"*"}]}
      - name: Correlate 24-hour CloudFront WAF ALB ECS and application evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import subprocess
          import tempfile
          from collections import defaultdict
          
          utc = dt.timezone.utc
          end = dt.datetime.now(utc).replace(second=0, microsecond=0)
          start = end - dt.timedelta(hours=24)
          region = "ap-south-1"
          edge_region = "us-east-1"
          cluster = os.environ["ECS_CLUSTER"]
          service = os.environ["ECS_SERVICE"]
          counts = defaultdict(int)
          buckets = defaultdict(dict)
          
          def iso(t):
              return t.strftime("%Y-%m-%dT%H:%M:%SZ")
          
          def aws(api, action, args=(), at=region):
              try:
                  p = subprocess.run(["aws", api, action, *[str(a) for a in args],
                                      "--region", at, "--output", "json"],
                                     text=True, capture_output=True, timeout=120)
              except (OSError, subprocess.TimeoutExpired) as exc:
                  counts["errors"] += 1
                  print("ERROR:", api + ":" + action, type(exc).__name__, flush=True)
                  return None
              if p.returncode != 0:
                  if re.search(r"AccessDenied|not authorized|UnauthorizedOperation", p.stderr, re.I):
                      counts["skipped"] += 1
                      print("SKIPPED (no permission):", api + ":" + action, flush=True)
                  else:
                      counts["errors"] += 1
                      message = re.sub(r"arn:aws:\S+", "[ARN]", p.stderr.strip())
                      print("ERROR:", api + ":" + action, message[-240:], flush=True)
                  return None
              counts["ran"] += 1
              try:
                  return json.loads(p.stdout)
              except json.JSONDecodeError:
                  print("ERROR:", api + ":" + action, "invalid JSON", flush=True)
                  counts["errors"] += 1
                  return None
          
          def query(name, metric_query, at=region):
              with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as f:
                  json.dump([metric_query], f)
                  path = f.name
              try:
                  data = aws("cloudwatch", "get-metric-data", [
                      "--start-time", iso(start), "--end-time", iso(end),
                      "--metric-data-queries", "file://" + path], at)
              finally:
                  os.unlink(path)
              if data is None:
                  print("METRIC", name, "SKIPPED_OR_ERROR", flush=True)
                  return
              populated = 0
              for result in data.get("MetricDataResults", []):
                  values = result.get("Values", [])
                  if not values:
                      continue
                  populated += 1
                  label = result.get("Label", name).replace("\n", " ")[:150]
                  print("METRIC", name, "label=" + repr(label),
                        "samples=" + str(len(values)),
                        "sum=" + str(round(sum(values), 3)),
                        "max=" + str(round(max(values), 3)), flush=True)
                  for timestamp, value in zip(result.get("Timestamps", []), values):
                      t = dt.datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
                      t = t.replace(minute=t.minute // 5 * 5, second=0, microsecond=0)
                      key = iso(t)
                      buckets[key][name] = max(buckets[key].get(name, float(value)), float(value))
              if not populated:
                  print("METRIC", name, "NO_DATA (not zero)", flush=True)
          
          def search(ns, metric, dimensions, term, stat):
              expr = "SEARCH('{" + ns + "," + dimensions + '} MetricName="' + metric + '" AND "' + term + '", ' + "'" + stat + "', 300)"
              return {"Id": "search", "Expression": expr, "Period": 300, "ReturnData": True}
          
          def direct(ns, metric, dimensions, stat):
              return {"Id": "measure", "MetricStat": {
                  "Metric": {"Namespace": ns, "MetricName": metric,
                             "Dimensions": [{"Name": k, "Value": v} for k, v in dimensions.items()]},
                  "Period": 300, "Stat": stat}, "ReturnData": True}
          
          print("UTC_WINDOW", iso(start), iso(end), flush=True)
          print("=== 1 CLOUDWATCH: INDEPENDENT METRIC QUERIES ===")
          terraform = pathlib.Path("infra/aws/app/main.tf").read_text()
          prefix = "sea-n-shore-staging"
          assert 'resource "aws_lb" "app"' in terraform
          assert 'resource "aws_lb_target_group" "app"' in terraform
          assert 'default     = "sea-n-shore"' in terraform
          assert 'default     = "staging"' in terraform
          print("TERRAFORM_NAMES", "ALB=" + prefix + "-alb", "TARGET_GROUP=" + prefix + "-web")
          # CloudFront metrics live in us-east-1. SEARCH yields distribution-labeled series
          # without calling cloudfront:ListDistributions.
          for name, metric in [("cf5xx", "5xxErrorRate"), ("originlat", "OriginLatency")]:
              query(name, search("AWS/CloudFront", metric, "DistributionId,Region", "Global", "Average"), edge_region)
          # ALB ARN suffixes are AWS-generated; GetMetricData SEARCH matches Terraform names.
          # No elasticloadbalancing:DescribeLoadBalancers or ListMetrics call is needed.
          for name, metric, dims, term, stat in [
              ("alb503", "HTTPCode_ELB_503_Count", "LoadBalancer", prefix + "-alb", "Sum"),
              ("target5xx", "HTTPCode_Target_5XX_Count", "LoadBalancer,TargetGroup", prefix + "-web", "Sum"),
              ("healthymin", "HealthyHostCount", "LoadBalancer,TargetGroup", prefix + "-web", "Minimum"),
              ("unhealthymax", "UnHealthyHostCount", "LoadBalancer,TargetGroup", prefix + "-web", "Maximum")]:
              query(name, search("AWS/ApplicationELB", metric, dims, term, stat))
          for name, metric in [("ecscpu", "CPUUtilization"), ("ecsmem", "MemoryUtilization")]:
              query(name, direct("AWS/ECS", metric,
                                 {"ClusterName": cluster, "ServiceName": service}, "Maximum"))
          print("=== TIMESTAMP-ALIGNED FIVE-MINUTE ANOMALIES ===")
          for timestamp, values in sorted(buckets.items()):
              if (values.get("cf5xx", 0) > 0 or values.get("alb503", 0) > 0 or
                  values.get("target5xx", 0) > 0 or values.get("healthymin", 1) == 0 or
                  values.get("unhealthymax", 0) > 0 or values.get("ecscpu", 0) > 75 or
                  values.get("ecsmem", 0) > 75):
                  print("BUCKET", timestamp, " ".join(
                      k + "=" + str(round(v, 2)) for k, v in sorted(values.items())))
          
          print("=== 2 ECS EVENTS AND STOPPED TASKS ===")
          service_data = aws("ecs", "describe-services", [
              "--cluster", cluster, "--services", service])
          if service_data and service_data.get("services"):
              ecs = service_data["services"][0]
              print("ECS_COUNTS", ecs.get("runningCount"), ecs.get("desiredCount"),
                    ecs.get("pendingCount"))
              for event in ecs.get("events", []):
                  try:
                      when = dt.datetime.fromisoformat(event["createdAt"].replace("Z", "+00:00"))
                  except (KeyError, ValueError):
                      continue
                  if when >= start:
                      print("SERVICE_EVENT", iso(when), str(event.get("message", ""))[:300])
          else:
              print("SERVICE_EVENTS UNAVAILABLE")
          task_list = aws("ecs", "list-tasks", [
              "--cluster", cluster, "--service-name", service, "--desired-status", "STOPPED"])
          if task_list is not None:
              ids = task_list.get("taskArns", [])[:100]
              print("STOPPED_TASK_IDS", len(ids))
              for i in range(0, len(ids), 100):
                  batch = aws("ecs", "describe-tasks", [
                      "--cluster", cluster, "--tasks", *ids[i:i + 100]])
                  if batch is None:
                      continue
                  for task in batch.get("tasks", []):
                      if not task.get("stoppedAt"):
                          continue
                      when = dt.datetime.fromisoformat(task["stoppedAt"].replace("Z", "+00:00"))
                      if when < start:
                          continue
                      print("STOPPED_TASK", iso(when), task.get("stopCode"),
                            str(task.get("stoppedReason", ""))[:300])
                      for c in task.get("containers", []):
                          print("CONTAINER_EXIT", c.get("name"), c.get("exitCode"),
                                str(c.get("reason", ""))[:240])
          else:
              print("STOPPED_TASKS UNAVAILABLE")
          
          print("=== 3 WEB CLOUDWATCH LOGS ===")
          log_group = "/ecs/" + prefix + "/web"  # Terraform aws_cloudwatch_log_group.app
          for term in ["503", "ECONNRESET", "timeout", "ERROR", "OOM", "out of memory"]:
              result = aws("logs", "filter-log-events", [
                  "--log-group-name", log_group,
                  "--start-time", int(start.timestamp() * 1000),
                  "--end-time", int(end.timestamp() * 1000),
                  "--filter-pattern", '"' + term + '"', "--max-items", 120])
              if result is None:
                  print("LOG_PATTERN", term, "SKIPPED_OR_ERROR")
                  continue
              events = result.get("events", [])
              print("LOG_PATTERN", term, "received=" + str(len(events)),
                    "truncated=" + str(bool(result.get("nextToken"))))
              for event in events[:60]:
                  when = dt.datetime.fromtimestamp(event["timestamp"] / 1000, utc)
                  msg = event.get("message", "").replace("\n", " ").replace("\r", " ")
                  msg = re.sub(r"[\w.+%-]+@[\w.-]+\.[A-Za-z]{2,}", "[email]", msg)
                  msg = re.sub(r"(?i)(authorization|cookie|password|secret|token)[\s=:]+[^\s,;]+",
                               r"\1=[redacted]", msg)
                  msg = re.sub(r"(?:\d{1,3}\.){3}\d{1,3}", "[ip]", msg)
                  print("WEB_LOG", iso(when), term, msg[:260])
          
          print("=== 4 WAF PER-IP RATE LIMIT ===")
          query("wafblocked", direct("AWS/WAFV2", "BlockedRequests",
              {"WebACL": prefix + "-edge", "Rule": prefix + "-rate-limit",
               "Region": "CloudFront"}, "Sum"), edge_region)
          acls = aws("wafv2", "list-web-acls", ["--scope", "CLOUDFRONT"], edge_region)
          if acls is not None:
              acl = next((a for a in acls.get("WebACLs", [])
                          if a.get("Name") == prefix + "-edge"), None)
              if acl is None:
                  print("WAF_SAMPLES NO_MATCHING_ACL")
              else:
                  since = max(start, end - dt.timedelta(hours=3))
                  sample = aws("wafv2", "get-sampled-requests", [
                      "--scope", "CLOUDFRONT", "--web-acl-arn", acl["ARN"],
                      "--rule-metric-name", prefix + "-rate-limit",
                      "--time-window", "StartTime=" + iso(since) + ",EndTime=" + iso(end),
                      "--max-items", 100], edge_region)
                  if sample is not None:
                      print("WAF_SAMPLES", len(sample.get("SampledRequests", [])),
                            "WINDOW", iso(since), iso(end))
                      for item in sample.get("SampledRequests", [])[:60]:
                          req = item.get("Request", {})
                          print("WAF_SAMPLE", item.get("Timestamp"), item.get("Action"),
                                req.get("Method"), str(req.get("URI", ""))[:140])
          
          print("ACTION_SUMMARY", json.dumps(dict(counts)), flush=True)
          print("READ_ONLY_DIAGNOSTIC_COMPLETE=true", flush=True)
          PYTHON
