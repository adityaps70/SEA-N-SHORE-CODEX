name: AWS Organization Hiring E2E

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/organization-hiring-e2e-action.txt
      - scripts/aws/organization-hiring-e2e-guard.test.mjs
      - scripts/aws/organization-hiring-staging-e2e.mjs
      - scripts/aws/organization-hiring-e2e-ssm.mjs
      - scripts/aws/organization-hiring-e2e-remote.sh
      - .github/workflows/aws-organization-hiring-e2e.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-organization-hiring-e2e
  cancel-in-progress: false

jobs:
  organization-hiring-e2e:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      COGNITO_POOL_NAME: sea-n-shore-staging-users
      SITE_URL: https://d3prih0q6jofyr.cloudfront.net

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Resolve organization hiring E2E action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/organization-hiring-e2e-action.txt)"
          echo "ORGANIZATION_HIRING_E2E_ACTION=$ACTION" >> "$GITHUB_ENV"
          case "$ACTION" in
            plan)
              echo "run_e2e=false" >> "$GITHUB_OUTPUT"
              ;;
            run-once)
              [[ "$GITHUB_EVENT_NAME" == push ]] || { echo "run-once is permitted only from an exact branch push." >&2; exit 1; }
              [[ "$GITHUB_REF" == refs/heads/feat/aws-native-phase-0-1 ]] || { echo "run-once is restricted to feat/aws-native-phase-0-1." >&2; exit 1; }
              echo "run_e2e=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported organization hiring E2E action: $ACTION" >&2
              exit 1
              ;;
          esac

      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == completed ]]; then
              [[ "$CONCLUSION" == success ]] || { echo "Exact-head AWS Infrastructure CI is not green." >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-head AWS Infrastructure CI." >&2
          exit 1

      - name: Guard push E2E against a moved branch
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after organization hiring E2E started; refusing stale execution." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        if: steps.action.outputs.run_e2e == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || { echo "Refusing E2E in unexpected AWS account $ACCOUNT_ID." >&2; exit 1; }

      - name: Discover bootstrap instance
        if: steps.action.outputs.run_e2e == 'true'
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          [[ "$COUNT" -eq 1 ]] || { echo "Expected exactly one running bootstrap; found $COUNT." >&2; exit 1; }
          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      - name: Generate disposable hiring identities
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="sea-n-shore-hiring-e2e-${GITHUB_RUN_ID}"
          APPLICANT_EMAIL="${PREFIX}-applicant@example.com"
          ADMIN_EMAIL="${PREFIX}-admin@example.com"
          UNAUTHORIZED_EMAIL="${PREFIX}-unauthorized@example.com"
          APPLICANT_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Applicant9"
          ADMIN_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Admin9"
          UNAUTHORIZED_PASSWORD="SeaNShore!${GITHUB_RUN_ID}Unauthorized9"
          for SECRET_VALUE in "$APPLICANT_PASSWORD" "$ADMIN_PASSWORD" "$UNAUTHORIZED_PASSWORD"; do echo "::add-mask::$SECRET_VALUE"; done
          {
            echo "E2E_APPLICANT_EMAIL=$APPLICANT_EMAIL"
            echo "E2E_ADMIN_EMAIL=$ADMIN_EMAIL"
            echo "E2E_UNAUTHORIZED_EMAIL=$UNAUTHORIZED_EMAIL"
            echo "E2E_APPLICANT_PASSWORD=$APPLICANT_PASSWORD"
            echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "E2E_UNAUTHORIZED_PASSWORD=$UNAUTHORIZED_PASSWORD"
            echo "E2E_APPLICANT_NAME=E2E Hiring Applicant ${GITHUB_RUN_ID}"
            echo "E2E_ADMIN_NAME=E2E Hiring Admin ${GITHUB_RUN_ID}"
            echo "E2E_UNAUTHORIZED_NAME=E2E Hiring Visitor ${GITHUB_RUN_ID}"
            echo "E2E_ORGANIZATION_NAME=E2E Hiring Organization ${GITHUB_RUN_ID}"
            echo "E2E_JOB_TITLE=E2E Chief Officer ${GITHUB_RUN_ID}"
          } >> "$GITHUB_ENV"

      - name: Use Node 22 for staging browser E2E
        if: steps.action.outputs.run_e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser E2E dependencies
        if: steps.action.outputs.run_e2e == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium

      - name: Create disposable public sign-ups
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: signup
        run: node scripts/aws/organization-hiring-staging-e2e.mjs

      - name: Confirm disposable sign-ups through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs confirm)"
          printf '%s\n' "$OUTPUT"
          grep -q '^ORGANIZATION_HIRING_E2E_ADMIN_CONFIRM_VERIFIED=true$' <<<"$OUTPUT"

      - name: Complete disposable user onboarding
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: onboarding
        run: node scripts/aws/organization-hiring-staging-e2e.mjs

      - name: Grant disposable platform administrator through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs grant-admin)"
          printf '%s\n' "$OUTPUT"
          grep -q '^ORGANIZATION_HIRING_E2E_ADMIN_ROLE_VERIFIED=true$' <<<"$OUTPUT"

      - name: Submit organization application through live UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: applicant-submit
        run: node scripts/aws/organization-hiring-staging-e2e.mjs

      - name: Resolve disposable organization application through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs resolve-application)"
          printf '%s\n' "$OUTPUT"
          APPLICATION_ID="$(sed -n 's/^ORGANIZATION_HIRING_E2E_APPLICATION_ID=//p' <<<"$OUTPUT" | tail -n1)"
          COMPANY_ID="$(sed -n 's/^ORGANIZATION_HIRING_E2E_COMPANY_ID=//p' <<<"$OUTPUT" | tail -n1)"
          [[ "$APPLICATION_ID" =~ ^[0-9a-f-]{36}$ && "$COMPANY_ID" =~ ^[0-9a-f-]{36}$ ]]
          echo "E2E_APPLICATION_ID=$APPLICATION_ID" >> "$GITHUB_ENV"
          echo "E2E_COMPANY_ID=$COMPANY_ID" >> "$GITHUB_ENV"

      - name: Approve organization through live admin UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: admin-approve
        run: node scripts/aws/organization-hiring-staging-e2e.mjs

      - name: Verify approved company and owner membership through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs verify-approval)"
          printf '%s\n' "$OUTPUT"
          grep -q '^ORGANIZATION_HIRING_E2E_APPROVAL_VERIFIED=true$' <<<"$OUTPUT"

      - name: Create published maritime job through live owner UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: owner-post
        run: node scripts/aws/organization-hiring-staging-e2e.mjs

      - name: Verify published job ownership through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs resolve-job)"
          printf '%s\n' "$OUTPUT"
          grep -q '^ORGANIZATION_HIRING_E2E_JOB_VERIFIED=true$' <<<"$OUTPUT"
          JOB_ID="$(sed -n 's/^ORGANIZATION_HIRING_E2E_JOB_ID=//p' <<<"$OUTPUT" | tail -n1)"
          [[ "$JOB_ID" =~ ^[0-9a-f-]{36}$ ]]
          echo "E2E_JOB_ID=$JOB_ID" >> "$GITHUB_ENV"

      - name: Verify unauthorized identity has no hiring authority through SSM
        if: steps.action.outputs.run_e2e == 'true'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs verify-unauthorized)"
          printf '%s\n' "$OUTPUT"
          grep -q '^ORGANIZATION_HIRING_E2E_UNAUTHORIZED_VERIFIED=true$' <<<"$OUTPUT"

      - name: Verify unauthorized and cross-company denial through live UI
        if: steps.action.outputs.run_e2e == 'true'
        env:
          E2E_PHASE: unauthorized
        run: node scripts/aws/organization-hiring-staging-e2e.mjs

      - name: Cleanup every disposable organization hiring artifact
        if: always() && steps.action.outputs.run_e2e == 'true' && steps.instance.outputs.instance_id != ''
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(node scripts/aws/organization-hiring-e2e-ssm.mjs cleanup)"
          printf '%s\n' "$OUTPUT"
          grep -q '^ORGANIZATION_HIRING_E2E_CLEANUP_VERIFIED=true$' <<<"$OUTPUT"
