name: AWS Load Test

# Round P3: the one-off load test the owner approved. Signed-out, read-only page fetches of the live site
# (landing, /jobs, one job page, one course page, privacy) from LOAD_TEST_SHARDS GitHub runners, ramping
# 100 -> 300 -> 600 -> 1,000 -> 2,000 -> 3,000 requests/min, 5 minutes per step, starting at 01:00 IST.
# Stop rules (scripts/load-test/stop-watch.mjs): any step's p95 over 2 s, server errors over 1% or WAF blocks
# over 1% stops every shard at once.
#
# It sends traffic only when scripts/aws/load-test-action.txt reads "run-once <sha>" (signed-out mix) or
# "run-signed-in-once <sha>" (Round ARCH: the 50 hidden load-test accounts, src/features/load-test) from an
# owner-merged arm PR (the merge is the approval; GitHub Pro does not enforce staging-apply reviewers on a private
# repository). Merging the arm sends nothing: the push run only checks the arm. The nightly start
# (.github/workflows/load-test-nightly.yml, a schedule on the default branch at 01:05 IST) starts this workflow
# on the feature branch, and the window job then requires: started by that schedule, between 01:00 and 01:45
# IST, the branch head still the armed merge commit, and no earlier nightly start on that commit.
# Signed in, a sessions job gets each account a fresh session sealed end to end (scripts/load-test/sessions.mjs,
# GitHub secret LOAD_TEST_HANDOFF_KEY), a monitor job stops the run if Aurora stays at its maximum ACU for 5
# minutes, and every session is signed out afterwards. The sessions task hands the sealed sessions over as one
# S3 object (infra/aws/app/load-test-handoff.tf): the sessions job reads it, deletes it and proves the prefix is
# empty, and the report job deletes it again whatever happened.
# "sessions-only-once <sha>" (owner-merged arm; the merge itself starts it, as it sends no traffic to the site):
# the hand-off proof. It creates the 50 accounts, hands their sessions off, checks the count, opens each shard's
# part with no k6 at all, then signs out and deletes everything and reports what is left (0).
# "plan" sends no traffic to the site: it runs the contract test and the whole pipeline against a local
# server on the runner.

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/load-test-action.txt
      - scripts/aws/load-test.test.mjs
      - scripts/load-test/**
      - .github/workflows/aws-load-test.yml
      - .github/workflows/load-test-nightly.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-load-test
  cancel-in-progress: false

env:
  LOAD_TEST_SHARDS: "8"
  LOAD_TEST_TOTAL_RPM: "100,300,600,1000,2000,3000"
  LOAD_TEST_STEP_SECONDS: "300"
  LOAD_TEST_BASE_URL: https://seanshore.in
  K6_DEB_URL: https://dl.k6.io/deb/dists/stable/main/binary-amd64/k6-v2.2.0-amd64.deb
  K6_DEB_SHA256: 58b6468440332f882dba76efa87fb3b6d6eea0e3bd96090e3a5d5159f35832e0

jobs:
  apply-gate:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    # Gate-only job. Cost cut 7: vars.GATE_RUNNER=ubuntu-slim (a third of the ubuntu-latest rate) while the repo is private; GitHub does not serve ubuntu-slim to it while public.
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approval: ${{ steps.apply_guard.outputs.approval }}
      action: ${{ steps.apply_guard.outputs.action }}
      skip: ${{ steps.plan_scope.outputs.skip }}
    timeout-minutes: 10
    steps:
      # Cost cut 7 (owner-approved 14 Nov; proved in run 43619379498): the tools this gate uses must be on ubuntu-slim;
      # a missing one fails the gate (it refuses).
      - name: Check the gate's tools
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash curl jq python3 git; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is missing on this runner"; exit 1; }
          done
          echo "CUT7_TOOLS bash=${BASH_VERSION} curl=$(curl --version | head -1 | cut -d' ' -f2) $(jq --version) python3=$(python3 -c 'import platform; print(platform.python_version())') $(git --version)"
      - name: Checkout the guard file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/aws/load-test-action.txt
            scripts/aws/arm-commit-guard.sh
          sparse-checkout-cone-mode: false

      - name: Decide whether this run sends traffic to the site
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(cut -d' ' -f1 < scripts/aws/load-test-action.txt | tr -d '[:space:]')"
          case "$ACTION" in
            plan|discover) echo "approval=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "approval=true" >> "$GITHUB_OUTPUT" ;;
          esac
          [[ "$ACTION" =~ ^[a-z-]+$ ]] && echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Guard action: $ACTION"

      - name: Require an owner-merged arm naming the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/load-test-action.txt
        shell: bash
        run: bash scripts/aws/arm-commit-guard.sh

      # Actions minutes: a plan run is skipped when this push changed none of the load test's own files.
      - name: Skip a plan run when none of this runner's scripts changed
        id: plan_scope
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_FILE: scripts/aws/load-test-action.txt
          RUNNER_FILES: "scripts/aws/load-test.test.mjs scripts/load-test/** .github/workflows/load-test-nightly.yml"
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          ACTION="$(cut -d' ' -f1 < "$GUARD_FILE" | tr -d '[:space:]')"
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$ACTION" == "plan" || "$ACTION" == "discover" ) ]]; then
            SKIP="$(python3 -c '
          import fnmatch, json, os, sys, urllib.request
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          watched = os.environ["RUNNER_FILES"].split()
          before, after = event.get("before") or "", event.get("after") or ""
          files = None
          # Cost cut 7 (14 Nov): the files this push changed, from the compare API. It is exact for any push, a pull
          # request merge included (the commit list in the event is not). Under 300 files only; any doubt runs the plan.
          if len(before) == 40 and before.strip("0") and len(after) == 40:
              try:
                  url = "%s/repos/%s/compare/%s...%s" % (os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], before, after)
                  request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
                  data = json.load(urllib.request.urlopen(request, timeout=20))
                  changed = data.get("files") or []
                  if data.get("status") == "ahead" and 0 < len(changed) < 300:
                      files = {f["filename"] for f in changed} | {f["previous_filename"] for f in changed if f.get("previous_filename")}
              except Exception:
                  files = None
          if files is None:
              commits = event.get("commits") or []
              listed = {f for c in commits for k in ("added", "modified", "removed") for f in (c.get(k) or [])}
              # Only a complete, non-empty list of changed files can show that nothing of this runner changed.
              complete = bool(commits) and len(commits) < 2048 and bool(listed)
              files = listed if complete else None
          print("true" if files is not None and not any(fnmatch.fnmatch(f, p) for f in files for p in watched) else "false")
          ')"
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Plan run skipped: $SKIP"

  plan:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && needs.apply-gate.outputs.approval != 'true' && (needs.apply-approval.result == 'success' || needs.apply-approval.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the load test contract
        run: node --test scripts/aws/load-test.test.mjs

      - name: Install the pinned k6
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/k6.deb "$K6_DEB_URL"
          echo "$K6_DEB_SHA256  /tmp/k6.deb" | sha256sum -c -
          sudo dpkg -i /tmp/k6.deb
          k6 version

      - name: Run the whole pipeline against a local server (no traffic to the site)
        shell: bash
        env:
          LOAD_TEST_BASE_URL: http://127.0.0.1:8099
          LOAD_TEST_SHARD: "0"
          LOAD_TEST_SHARDS: "1"
          LOAD_TEST_TOTAL_RPM: "60,120"
          LOAD_TEST_STEP_SECONDS: "40"
          LOAD_TEST_JOB_PATH: /jobs/00000000-0000-4000-8000-000000000000
          LOAD_TEST_COURSE_PATH: /learn/courses/smoke-course
        run: |
          set -euo pipefail
          node scripts/load-test/smoke-server.mjs 8099 &
          sleep 1
          k6 run --quiet --out csv=/tmp/k6.csv scripts/load-test/p3-load-test.js &
          K6=$!
          node scripts/load-test/stop-watch.mjs watch /tmp/k6.csv "$K6" /tmp/stop.txt &
          wait "$K6"
          mkdir -p /tmp/shards
          node scripts/load-test/stop-watch.mjs summarize /tmp/k6.csv /tmp/shards/shard-0.json
          node scripts/load-test/report.mjs /tmp/shards "$LOAD_TEST_TOTAL_RPM" "$LOAD_TEST_STEP_SECONDS" /tmp/stop.txt | tee /tmp/report.txt
          grep -q '^LOAD_TEST_RESULT highest_step_within_limits=2 ' /tmp/report.txt
          [[ ! -f /tmp/stop.txt ]]
          # The signed-in mix, with fake sessions and action ids the local server accepts.
          node -e "require('fs').writeFileSync('/tmp/sessions.json', JSON.stringify(Array.from({length: 7}, (_, i) => ({index: i + 1, accessToken: 'smoke-access-' + (i + 1), refreshToken: null}))))"
          rm -rf /tmp/shards-in && mkdir -p /tmp/shards-in
          LOAD_TEST_MIX=signed-in LOAD_TEST_SESSIONS_FILE=/tmp/sessions.json LOAD_TEST_ACTIONS="{\"loadTopFeedPage\":\"$(printf 'a%.0s' {1..42})\",\"loadUnreadNotificationCount\":\"$(printf 'b%.0s' {1..42})\"}" \
            k6 run --quiet --out csv=/tmp/k6-in.csv scripts/load-test/p3-load-test.js &
          K6=$!
          node scripts/load-test/stop-watch.mjs watch /tmp/k6-in.csv "$K6" /tmp/stop-in.txt &
          wait "$K6"
          node scripts/load-test/stop-watch.mjs summarize /tmp/k6-in.csv /tmp/shards-in/shard-0.json
          node scripts/load-test/report.mjs /tmp/shards-in "$LOAD_TEST_TOTAL_RPM" "$LOAD_TEST_STEP_SECONDS" /tmp/stop-in.txt | tee /tmp/report-in.txt
          grep -q '^LOAD_TEST_RESULT highest_step_within_limits=2 ' /tmp/report-in.txt
          grep -q 'auth_refused_pct=0.00 other_4xx_pct=0.00' /tmp/report-in.txt
          [[ ! -f /tmp/stop-in.txt ]]
          echo "LOAD_TEST_PLAN_ONLY_NO_TRAFFIC"

  apply-approval:
    needs: apply-gate
    if: needs.apply-gate.outputs.approval == 'true'
    runs-on: ${{ vars.GATE_RUNNER || 'ubuntu-latest' }}
    environment: staging-apply
    timeout-minutes: 10
    steps:
      - name: Approved for the load test
        run: echo "Armed by an owner-merged arm PR. Only the nightly start at 01:05 IST sends traffic; a push run sends none."

  # Traffic is started only by the nightly start (01:05 IST, from main: by hand, or its schedule as a backup). Refuses
  # a start outside 01:00-01:45 IST (the ramp then ends by about 02:20, inside the 01:00-03:00 window), and a second
  # start on the same armed commit. The sessions-only proof sends no traffic: its arm's merge (the push) starts it, once.
  window:
    needs:
      - apply-gate
      - apply-approval
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && needs.apply-approval.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.apply-gate.outputs.action == 'sessions-only-once')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      job_path: ${{ steps.pages.outputs.job_path }}
      course_path: ${{ steps.pages.outputs.course_path }}
      started_at: ${{ steps.pages.outputs.started_at }}
      mix: ${{ steps.mix.outputs.mix }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify the load test contract and the armed action
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/aws/load-test.test.mjs

      - name: Resolve the mix from the armed action
        id: mix
        shell: bash
        run: |
          set -euo pipefail
          case "$(cut -d' ' -f1 < scripts/aws/load-test-action.txt)" in
            run-once) echo "mix=signed-out" >> "$GITHUB_OUTPUT" ;;
            run-signed-in-once) echo "mix=signed-in" >> "$GITHUB_OUTPUT" ;;
            sessions-only-once) echo "mix=sessions-only" >> "$GITHUB_OUTPUT" ;;
            *) echo "Not armed for a run." >&2; exit 1 ;;
          esac

      - name: Require the nightly start inside 01:00-01:45 IST, once per arm
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          MIX: ${{ steps.mix.outputs.mix }}
        shell: bash
        run: |
          set -euo pipefail
          # The sessions-only proof: only from its arm's merge (a push), never re-run, and no traffic to the site.
          if [[ "$MIX" == sessions-only || "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$MIX" == sessions-only && "$GITHUB_EVENT_NAME" == push ]] || { echo "Only the sessions-only proof starts from its arm's merge; traffic needs the nightly start." >&2; exit 1; }
            [[ "$GITHUB_RUN_ATTEMPT" == 1 ]] || { echo "The sessions-only proof runs once per arm; re-arm for another." >&2; exit 1; }
            echo "LOAD_TEST_SESSIONS_ONLY_NO_TRAFFIC"
            exit 0
          fi
          [[ "$TRIGGERING_ACTOR" == "github-actions[bot]" ]] || { echo "Only the nightly start may begin the load test (started by $TRIGGERING_ACTOR)." >&2; exit 1; }
          NOW=$(date -u +%s)
          START=$(date -u -d "$(date -u +%F) 19:30:00" +%s)
          if (( NOW < START || NOW > START + 2700 )); then echo "Started outside 01:00-01:45 IST; refusing so the run stays inside 01:00-03:00 IST." >&2; exit 1; fi
          EARLIER=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/aws-load-test.yml/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length")
          [[ "$EARLIER" == 0 ]] || { echo "This arm was already started once; re-arm for another run." >&2; exit 1; }

      - name: Guard against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after the load test was approved; refusing a stale run." >&2; exit 1; }

      - name: Pick one public job page and one public course page
        id: pages
        if: steps.mix.outputs.mix != 'sessions-only'
        shell: bash
        run: |
          set -euo pipefail
          UA='SeaNShore-LoadTest/1'
          JOBS_HTML=$(curl -fsS --max-time 20 -A "$UA" -H 'X-SNS-Load-Test: P3' "$LOAD_TEST_BASE_URL/jobs")
          LEARN_HTML=$(curl -fsS --max-time 20 -A "$UA" -H 'X-SNS-Load-Test: P3' "$LOAD_TEST_BASE_URL/learn")
          # Links may carry a query string (e.g. /jobs/<id>?src=jobs); keep only the path.
          JOB=$(grep -oE 'href="/jobs/[0-9a-f-]{36}["?]' <<<"$JOBS_HTML" | head -1 | sed -E 's/^href="//; s/["?]$//' || true)
          COURSE=$(grep -oE 'href="/learn/courses/[a-z0-9-]+["?]' <<<"$LEARN_HTML" | head -1 | sed -E 's/^href="//; s/["?]$//' || true)
          [[ "$JOB" =~ ^/jobs/[0-9a-f-]{36}$ ]] || { echo "No public job page found." >&2; exit 1; }
          [[ "$COURSE" =~ ^/learn/courses/[a-z0-9-]+$ ]] || { echo "No public course page found." >&2; exit 1; }
          echo "job_path=$JOB" >> "$GITHUB_OUTPUT"
          echo "course_path=$COURSE" >> "$GITHUB_OUTPUT"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:00Z)" >> "$GITHUB_OUTPUT"
          echo "LOAD_TEST_WINDOW_OPEN"

  # Signed-in mix and the sessions-only proof: each test account gets a fresh session, sealed to a key pair made here;
  # the private key never leaves this job. The sessions task stores the sealed sessions as the run's one S3 object;
  # this job reads it, deletes it and proves the prefix is empty. The shards get their own accounts' sessions
  # re-sealed with LOAD_TEST_HANDOFF_KEY.
  sessions:
    needs:
      - apply-gate
      - apply-approval
      - window
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && needs.apply-approval.result == 'success' && needs.window.result == 'success' && (needs.window.outputs.mix == 'signed-in' || needs.window.outputs.mix == 'sessions-only') }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      AWS_REGION: ap-south-1
      LOAD_TEST_HANDOFF_BUCKET: sea-n-shore-staging-310356785722-load-test-handoff
      LOAD_TEST_HANDOFF_OBJECT: sessions/${{ github.run_id }}-${{ github.run_attempt }}.sealed
    outputs:
      sealed: ${{ steps.handoff.outputs.sealed }}
      actions: ${{ steps.handoff.outputs.actions }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Get every test account a sealed session
        id: handoff
        env:
          LOAD_TEST_HANDOFF_KEY: ${{ secrets.LOAD_TEST_HANDOFF_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 310356785722 ]]
          WORK="$(mktemp -d)"; trap 'rm -rf "$WORK"' EXIT; trap 'exit 129' HUP; trap 'exit 130' INT; trap 'exit 143' TERM
          # The 50 accounts are created for this run and deleted after it (report job), with counts reported.
          # On failure, show the task's own count and failure lines (never a key, name or address), then stop.
          CREATED="$(bash scripts/aws/load-test-host-command.sh create-once "$GITHUB_SHA" "$GITHUB_RUN_ID")" || { grep -E '^LOAD_TEST_ACCOUNTS_' <<<"${CREATED:-}" >&2 || true; exit 1; }
          grep -E '^LOAD_TEST_ACCOUNTS_(CREATED|CREATE_ONCE_VERIFIED)' <<<"$CREATED"
          grep -q '^LOAD_TEST_ACCOUNTS_CREATE_ONCE_VERIFIED=true$' <<<"$CREATED" || { echo "The test accounts were not created." >&2; exit 1; }
          PUBLIC_KEY="$(node scripts/load-test/sessions.mjs keypair "$WORK")"
          OUTPUT="$(bash scripts/aws/load-test-host-command.sh sessions "$GITHUB_SHA" "$GITHUB_RUN_ID" "$PUBLIC_KEY" "$LOAD_TEST_HANDOFF_OBJECT")" || { grep -E '^LOAD_TEST_ACCOUNTS_' <<<"${OUTPUT:-}" >&2 || true; exit 1; }
          grep -q '^LOAD_TEST_SESSIONS_READY=true$' <<<"$OUTPUT" || { echo "The host did not prepare the sessions." >&2; exit 1; }
          grep -E '^LOAD_TEST_SESSIONS_STORED count=50 bytes=[0-9]+$' <<<"$OUTPUT"
          ACTIONS="$(sed -n 's/^LOAD_TEST_ACTIONS //p' <<<"$OUTPUT" | head -1)"
          # The run's one hand-off object: read it (it must carry the hand-off key), delete it, prove nothing is left.
          aws s3api get-object --bucket "$LOAD_TEST_HANDOFF_BUCKET" --key "$LOAD_TEST_HANDOFF_OBJECT" "$WORK/sealed" > "$WORK/object.json"
          jq -e '.ServerSideEncryption == "aws:kms" and .BucketKeyEnabled == true and (.SSEKMSKeyId | startswith("arn:aws:kms:ap-south-1:310356785722:key/"))' "$WORK/object.json" >/dev/null || { echo "The hand-off object is not encrypted with the hand-off key." >&2; exit 1; }
          aws s3api delete-object --bucket "$LOAD_TEST_HANDOFF_BUCKET" --key "$LOAD_TEST_HANDOFF_OBJECT" >/dev/null
          LEFT="$(aws s3api list-objects-v2 --bucket "$LOAD_TEST_HANDOFF_BUCKET" --prefix sessions/ --query 'length(Contents || `[]`)' --output text)"
          echo "LOAD_TEST_HANDOFF_OBJECTS_LEFT=$LEFT"
          [[ "$LEFT" == 0 ]] || { echo "The hand-off bucket still holds sessions objects." >&2; exit 1; }
          node scripts/load-test/sessions.mjs open "$WORK/private.pem" "$WORK/sealed" > "$WORK/sessions.json"
          jq -e 'type == "array" and length == 50 and all(.[]; (.accessToken | type) == "string" and (.accessToken | length) > 0)' "$WORK/sessions.json" >/dev/null || { echo "The opened hand-off does not hold 50 sessions." >&2; exit 1; }
          echo "LOAD_TEST_SESSIONS_OPENED count=50"
          SEALED="$(node scripts/load-test/sessions.mjs seal-shards "$WORK/sessions.json" "$LOAD_TEST_SHARDS")"
          jq -e 'type == "object" and length == ('"$LOAD_TEST_SHARDS"')' <<<"$SEALED" >/dev/null
          jq -e '.loadTopFeedPage and .loadUnreadNotificationCount' <<<"$ACTIONS" >/dev/null
          echo "sealed=$SEALED" >> "$GITHUB_OUTPUT"
          echo "actions=$ACTIONS" >> "$GITHUB_OUTPUT"
          echo "LOAD_TEST_SESSIONS_HANDED_OFF shards=$LOAD_TEST_SHARDS"

      # Whatever happened above: the run's hand-off object is gone and the sessions/ prefix is empty.
      - name: Delete the hand-off object and count what is left
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          aws s3api delete-object --bucket "$LOAD_TEST_HANDOFF_BUCKET" --key "$LOAD_TEST_HANDOFF_OBJECT" >/dev/null
          LEFT="$(aws s3api list-objects-v2 --bucket "$LOAD_TEST_HANDOFF_BUCKET" --prefix sessions/ --query 'length(Contents || `[]`)' --output text)"
          echo "LOAD_TEST_HANDOFF_OBJECTS_LEFT=$LEFT"
          [[ "$LEFT" == 0 ]]

      - name: Delete the host checkout bundle
        if: always()
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" cleanup

  # Round DB (owner-approved 11 Nov): server-side stop rules, read-only CloudWatch every minute. The run is cancelled
  # when the last 3 one-minute values of any one are over its limit: Aurora CPU >= 90%, DB load (Performance Insights
  # DBLoad) >= 1.5 sessions, or ALB target response p95 > 2 s (scripts/load-test/monitor-stop.mjs). Aurora at its
  # maximum ACU is logged as information only: it is Aurora scaling up, not running out.
  monitor:
    needs:
      - apply-gate
      - apply-approval
      - window
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && needs.apply-approval.result == 'success' && needs.window.result == 'success' && needs.window.outputs.mix != 'sessions-only' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 50
    permissions:
      id-token: write
      contents: read
      actions: write
    env:
      AWS_REGION: ap-south-1
      LOAD_TEST_AURORA_CLUSTER: sea-n-shore-staging-aurora
      LOAD_TEST_AURORA_WRITER: sea-n-shore-staging-aurora-writer
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/load-test
            scripts/aws/alb-metric-dimension.sh
          sparse-checkout-cone-mode: false

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Watch Aurora CPU, DB load and server-side p95 until the shards finish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ALB="$(bash scripts/aws/alb-metric-dimension.sh)"
          mkdir -p /tmp/monitor
          # The last 6 minutes of one metric, one value per minute, oldest first.
          series() {
            local namespace="$1" name="$2" dimension="$3" stat="$4" field="$5"
            aws cloudwatch get-metric-statistics --region "$AWS_REGION" --namespace "$namespace" --metric-name "$name" \
              --dimensions "$dimension" $stat --period 60 \
              --start-time "$(date -u -d '-6 minutes' +%FT%TZ)" --end-time "$(date -u +%FT%TZ)" --output json \
              | jq -c "[.Datapoints | sort_by(.Timestamp) | .[] | $field]"
          }
          for minute in $(seq 1 45); do
            sleep 60
            CPU="$(series AWS/RDS CPUUtilization "Name=DBClusterIdentifier,Value=$LOAD_TEST_AURORA_CLUSTER" "--statistics Maximum" .Maximum)"
            LOAD="$(series AWS/RDS DBLoad "Name=DBInstanceIdentifier,Value=$LOAD_TEST_AURORA_WRITER" "--statistics Average" .Average)"
            P95="$(series AWS/ApplicationELB TargetResponseTime "Name=LoadBalancer,Value=$ALB" "--extended-statistics p95" '.ExtendedStatistics.p95')"
            ACU="$(series AWS/RDS ServerlessDatabaseCapacity "Name=DBClusterIdentifier,Value=$LOAD_TEST_AURORA_CLUSTER" "--statistics Maximum" .Maximum)"
            echo "LOAD_TEST_MONITOR minute=$minute aurora_cpu=$CPU db_load=$LOAD server_p95_s=$P95 aurora_acu_info=$ACU"
            if REASON="$(node scripts/load-test/monitor-stop.mjs "$(jq -nc --argjson cpu "$CPU" --argjson dbLoad "$LOAD" --argjson p95 "$P95" '{cpu: $cpu, dbLoad: $dbLoad, p95: $p95}')")"; then
              echo "LOAD_TEST_STOP $REASON" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$REASON" > /tmp/monitor/stop-monitor.txt
              curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API/cancel" >/dev/null
              exit 0
            fi
            # Run 42486602879: before the shards exist (the signed-in sessions job still running) no load job is listed,
            # so count the sessions job too and stop only once the load jobs exist and all have finished.
            JOBS="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$API/jobs?per_page=100")"
            LEFT="$(jq '[.jobs[] | select(.name == "sessions" or (.name | startswith("load"))) | select(.status != "completed")] | length' <<<"$JOBS")"
            SHARDS="$(jq '[.jobs[] | select(.name | startswith("load"))] | length' <<<"$JOBS")"
            [[ "$LEFT" == 0 && "$SHARDS" -gt 0 && $minute -gt 2 ]] && { echo "Every shard has finished."; exit 0; }
          done

      # The report counts a monitor stop like a shard stop (stopped=true and its reason).
      - name: Upload the monitor's stop reason
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-test-monitor
          path: /tmp/monitor
          retention-days: 14
          if-no-files-found: ignore

  load:
    needs:
      - apply-gate
      - window
      - sessions
    if: ${{ !cancelled() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && needs.window.result == 'success' && (needs.sessions.result == 'success' || (needs.sessions.result == 'skipped' && needs.window.outputs.mix == 'signed-out')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      LOAD_TEST_SHARD: ${{ matrix.shard }}
      LOAD_TEST_JOB_PATH: ${{ needs.window.outputs.job_path }}
      LOAD_TEST_COURSE_PATH: ${{ needs.window.outputs.course_path }}
      LOAD_TEST_MIX: ${{ needs.window.outputs.mix }}
      LOAD_TEST_ACTIONS: ${{ needs.sessions.outputs.actions }}
      LOAD_TEST_SESSIONS_FILE: ${{ github.workspace }}/../load-test-sessions.json
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: |
            scripts/load-test
          sparse-checkout-cone-mode: false

      - name: Install the pinned k6
        if: env.LOAD_TEST_MIX != 'sessions-only'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/k6.deb "$K6_DEB_URL"
          echo "$K6_DEB_SHA256  /tmp/k6.deb" | sha256sum -c -
          sudo dpkg -i /tmp/k6.deb

      - name: Open this shard's sessions (signed-in mix and the sessions-only proof)
        if: env.LOAD_TEST_MIX == 'signed-in' || env.LOAD_TEST_MIX == 'sessions-only'
        env:
          LOAD_TEST_HANDOFF_KEY: ${{ secrets.LOAD_TEST_HANDOFF_KEY }}
          LOAD_TEST_SHARD_SEALED: ${{ fromJSON(needs.sessions.outputs.sealed || '{}')[format('{0}', matrix.shard)] }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/load-test/sessions.mjs open-shard "$LOAD_TEST_SESSIONS_FILE"
          mkdir -p /tmp/shard
          jq 'length' "$LOAD_TEST_SESSIONS_FILE" > "/tmp/shard/handoff-count-$LOAD_TEST_SHARD.txt"

      # The sessions-only proof stops here: no k6, no request to the site.
      - name: Sessions-only proof (no traffic)
        if: env.LOAD_TEST_MIX == 'sessions-only'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$LOAD_TEST_SESSIONS_FILE"
          echo "LOAD_TEST_SHARD_PROOF_NO_TRAFFIC shard=$LOAD_TEST_SHARD"

      - name: Run this shard with the stop rules
        if: env.LOAD_TEST_MIX != 'sessions-only'
        shell: bash
        run: |
          set -euo pipefail
          k6 run --quiet --out csv=/tmp/k6.csv scripts/load-test/p3-load-test.js &
          K6=$!
          node scripts/load-test/stop-watch.mjs watch /tmp/k6.csv "$K6" /tmp/stop.txt &
          wait "$K6" || echo "k6 exited with $?"
          rm -f "$LOAD_TEST_SESSIONS_FILE"

      - name: Summarize this shard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shard
          if [[ -f /tmp/k6.csv ]]; then node scripts/load-test/stop-watch.mjs summarize /tmp/k6.csv "/tmp/shard/shard-$LOAD_TEST_SHARD.json"; fi
          if [[ -f /tmp/stop.txt ]]; then cp /tmp/stop.txt "/tmp/shard/stop-$LOAD_TEST_SHARD.txt"; fi

      - name: Upload this shard's numbers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-test-shard-${{ matrix.shard }}
          path: /tmp/shard
          retention-days: 14
          if-no-files-found: ignore

      # A stop on any shard stops every shard: cancelling the run interrupts the others' k6 (they still
      # summarize and upload), and the report job still runs.
      - name: Stop every shard when a stop rule fired
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/stop.txt ]]; then
            echo "LOAD_TEST_STOP $(cat /tmp/stop.txt)"
            curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel" >/dev/null
          fi

  report:
    needs:
      - apply-gate
      - apply-approval
      - window
      - sessions
      - load
      # Round DB: the monitor's stop reason (load-test-monitor) must be uploaded before the report downloads it.
      - monitor
    if: ${{ always() && needs.apply-gate.result == 'success' && needs.apply-gate.outputs.skip != 'true' && needs.apply-approval.result == 'success' && needs.window.result == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the shards' numbers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # The shards' numbers and, when the monitor stopped the run, its reason (load-test-monitor).
          pattern: load-test-*
          path: /tmp/shards

      - name: Load test report (aggregates only)
        if: needs.window.outputs.mix != 'sessions-only'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t STOPS < <(find /tmp/shards -name 'stop-*.txt' 2>/dev/null)
          node scripts/load-test/report.mjs /tmp/shards "$LOAD_TEST_TOTAL_RPM" "$LOAD_TEST_STEP_SECONDS" "${STOPS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Whatever happened above (no shards when the run stopped before any traffic), so the sign-out and deletion
      # below always have credentials.
      - name: Configure AWS credentials with GitHub OIDC
        if: always()
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || { echo "Refusing the report in unexpected AWS account $ACCOUNT_ID." >&2; exit 1; }

      - name: Discover bootstrap instance
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          [[ "$COUNT" -eq 1 ]] || { echo "Expected exactly one running bootstrap; found $COUNT." >&2; exit 1; }
          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      # The read-only capacity report's usage section over the test window: ALB, ECS, Aurora, CloudFront and
      # Lambda metrics (describe, get and list only; scripts/aws/capacity-media-report-guard.test.mjs).
      - name: Site metrics during the test (read-only)
        if: needs.window.outputs.mix != 'sessions-only'
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          REPORT_SECTIONS: usage
          REPORT_START: ${{ needs.window.outputs.started_at }}
          LOAD_TEST_STEP_RPM: ${{ env.LOAD_TEST_TOTAL_RPM }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 300
          export REPORT_END="$(date -u +%Y-%m-%dT%H:%M:00Z)"
          # Round DB: the server-side (ALB) times per step, which judge "p95 under 1 s", go to the summary too.
          node scripts/aws/capacity-media-report.cjs | tee /tmp/site-metrics.txt
          grep -E '^LOAD_TEST_(STEP_SERVER|P95_UNDER_1S_SERVER) ' /tmp/site-metrics.txt | tee -a "$GITHUB_STEP_SUMMARY" || true

      # The sessions-only proof: every shard opened its part, and the parts add up to the 50 sessions.
      - name: Sessions-only proof (counts only)
        if: needs.window.outputs.mix == 'sessions-only'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t COUNTS < <(find /tmp/shards -name 'handoff-count-*.txt' 2>/dev/null)
          SUM=0
          for file in "${COUNTS[@]}"; do VALUE="$(tr -d '[:space:]' < "$file")"; [[ "$VALUE" =~ ^[0-9]+$ ]]; SUM=$((SUM + VALUE)); done
          echo "LOAD_TEST_HANDOFF_SHARDS opened=${#COUNTS[@]} of=$LOAD_TEST_SHARDS sessions=$SUM" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "${#COUNTS[@]}" == "$LOAD_TEST_SHARDS" && "$SUM" == 50 ]] || { echo "The shards did not open all 50 sessions." >&2; exit 1; }
          echo "LOAD_TEST_HANDOFF_PROOF_VERIFIED=true"

      # Signed-in mix and the sessions-only proof: every test account's sessions end now (Cognito global sign-out),
      # whatever happened above.
      - name: Sign out and delete every test account (signed-in mix)
        if: always() && (needs.window.outputs.mix == 'signed-in' || needs.window.outputs.mix == 'sessions-only')
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(bash scripts/aws/load-test-host-command.sh sign-out "$GITHUB_SHA" "$GITHUB_RUN_ID")"
          grep -q '^LOAD_TEST_SIGNED_OUT=true$' <<<"$OUTPUT"
          echo "LOAD_TEST_SIGNED_OUT=true"
          DELETED="$(bash scripts/aws/load-test-host-command.sh delete-once "$GITHUB_SHA" "$GITHUB_RUN_ID")"
          grep -E '^LOAD_TEST_ACCOUNTS_(DELETED|AFTER_DELETE|DELETE_ONCE_VERIFIED)' <<<"$DELETED" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '^LOAD_TEST_ACCOUNTS_DELETE_ONCE_VERIFIED=true$' <<<"$DELETED"

      # Whatever happened above: the run's hand-off object is gone and the sessions/ prefix is empty.
      - name: Delete the hand-off object and count what is left
        if: always() && (needs.window.outputs.mix == 'signed-in' || needs.window.outputs.mix == 'sessions-only')
        env:
          LOAD_TEST_HANDOFF_BUCKET: sea-n-shore-staging-310356785722-load-test-handoff
          LOAD_TEST_HANDOFF_OBJECT: sessions/${{ github.run_id }}-${{ github.run_attempt }}.sealed
        shell: bash
        run: |
          set -euo pipefail
          aws s3api delete-object --bucket "$LOAD_TEST_HANDOFF_BUCKET" --key "$LOAD_TEST_HANDOFF_OBJECT" >/dev/null
          LEFT="$(aws s3api list-objects-v2 --bucket "$LOAD_TEST_HANDOFF_BUCKET" --prefix sessions/ --query 'length(Contents || `[]`)' --output text)"
          echo "LOAD_TEST_HANDOFF_OBJECTS_LEFT=$LEFT" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$LEFT" == 0 ]]

      - name: Delete the host checkout bundle
        if: always() && (needs.window.outputs.mix == 'signed-in' || needs.window.outputs.mix == 'sessions-only')
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/aws/ci-checkout.sh" cleanup
