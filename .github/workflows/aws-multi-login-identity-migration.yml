name: AWS Multi Login Identity Migration

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - infra/aws/database/migrations/0031_multi_login_identity.sql
      - scripts/aws/multi-login-identity-migration.sh
      - scripts/aws/multi-login-identity-migration-action.txt
      - scripts/aws/multi-login-identity-schema.test.mjs
      - .github/workflows/aws-multi-login-identity-migration.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-multi-login-identity-migration
  cancel-in-progress: false

jobs:
  multi-login-identity-migration:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Verify migration contract
        shell: bash
        run: node scripts/aws/multi-login-identity-schema.test.mjs

      - name: Validate migration action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/multi-login-identity-migration-action.txt)"
          case "$ACTION" in plan|migrate-once) ;; *) echo "Unsupported multi-login identity migration action: $ACTION" >&2; exit 1 ;; esac
          if [[ "$ACTION" == "migrate-once" && "${GITHUB_EVENT_NAME}" != "push" ]]; then
            echo "migrate-once is allowed only from an exact branch push." >&2
            exit 1
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Guard migration against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after multi-login identity migration started; refusing stale execution." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT_ID" == 310356785722 ]] || { echo "Refusing multi-login identity migration in unexpected AWS account $ACCOUNT_ID." >&2; exit 1; }

      - name: Discover bootstrap instance
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "instance_id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"

      - name: Send guarded multi-login identity migration through SSM
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TRIGGER_SHA" > /tmp/ssm-parameters.json <<'PYTHON'
          import json, shlex, sys
          sha = sys.argv[1]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-multi-login.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$WORK_DIR/repo"
          cd "$WORK_DIR/repo"
          git checkout --quiet --detach {sha}
          test "$(git rev-parse HEAD)" = "{sha}"
          export MULTI_LOGIN_IDENTITY_MIGRATION_EXPECTED_SHA={sha}
          bash scripts/aws/multi-login-identity-migration.sh
          """
          print(json.dumps({"executionTimeout": ["1200"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore multi-login identity migration $TRIGGER_SHA" --timeout-seconds 1200 --parameters file:///tmp/ssm-parameters.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface migration evidence
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          STDOUT_CONTENT=$(jq -r '.StandardOutputContent // empty' /tmp/result.json)
          printf '%s\n' "$STDOUT_CONTENT"
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          [[ -z "$STDERR_CONTENT" ]] || printf '%s\n' "$STDERR_CONTENT" >&2
          [[ "$(jq -r '.Status' /tmp/result.json)" == Success ]]
          grep -q 'MULTI_LOGIN_IDENTITY_MIGRATION_PLAN_VERIFIED=true\|MULTI_LOGIN_IDENTITY_MIGRATION_ALREADY_APPLIED=true' <<<"$STDOUT_CONTENT"
          if [[ "$ACTION" == "plan" ]]; then
            grep -q 'MULTI_LOGIN_IDENTITY_MIGRATION_PLAN_ONLY_NO_APPLY\|MULTI_LOGIN_IDENTITY_MIGRATION_ALREADY_APPLIED=true' <<<"$STDOUT_CONTENT"
          else
            grep -q 'MULTI_LOGIN_IDENTITY_MIGRATION_APPLY_VERIFIED=true\|MULTI_LOGIN_IDENTITY_MIGRATION_ALREADY_APPLIED=true' <<<"$STDOUT_CONTENT"
          fi
