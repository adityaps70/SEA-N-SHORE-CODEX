name: AWS Learning Quiz Resilience Migration

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - 'infra/aws/database/migrations/0021_learning_quiz_attempt_resilience.sql'
      - 'scripts/aws/learning-quiz-resilience-migration.sh'
      - 'scripts/aws/learning-quiz-resilience-migration-action.txt'
      - 'scripts/aws/learning-quiz-resilience-migration.test.mjs'
      - '.github/workflows/aws-learning-quiz-resilience-migration.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: ap-south-1
  EXPECTED_ACCOUNT: '310356785722'
  BRANCH: feat/aws-native-phase-0-1
  DEPLOY_ROLE: arn:aws:iam::310356785722:role/sea-n-shore-staging-github-deploy

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate guard
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/learning-quiz-resilience-migration-action.txt)"
          case "$ACTION" in
            plan|migrate-once) ;;
            *) echo "Unsupported action: $ACTION" >&2; exit 1 ;;
          esac
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "LEARNING_QUIZ_RESILIENCE_MIGRATION_ACTION=$ACTION"

      - name: Plan-only guard status
        if: steps.guard.outputs.action == 'plan'
        run: echo 'Learning quiz resilience migration is plan-only; no AWS write is permitted.'

      - name: Require exact branch push for migration
        if: steps.guard.outputs.action == 'migrate-once'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.event_name }}" == "push" ]]
          [[ "${{ github.ref }}" == "refs/heads/${BRANCH}" ]]

      - name: Wait for exact-head AWS Infrastructure CI
        if: steps.guard.outputs.action == 'migrate-once'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100")"
            ROW="$(jq -c '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0] // empty' <<<"$JSON")"
            if [[ -n "$ROW" ]]; then
              STATUS="$(jq -r '.status' <<<"$ROW")"
              CONCLUSION="$(jq -r '.conclusion // ""' <<<"$ROW")"
              echo "AWS Infrastructure CI status=$STATUS conclusion=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                [[ "$CONCLUSION" == "success" ]]
                exit 0
              fi
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head AWS Infrastructure CI.' >&2
          exit 1

      - name: Guard moved branch
        if: steps.guard.outputs.action == 'migrate-once'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          [[ "$(git rev-parse "origin/$BRANCH")" == "$GITHUB_SHA" ]]

      - name: Configure AWS credentials
        if: steps.guard.outputs.action == 'migrate-once'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assert AWS account
        if: steps.guard.outputs.action == 'migrate-once'
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT" == "$EXPECTED_ACCOUNT" ]]
          echo "AWS_ACCOUNT_VERIFIED=$ACCOUNT"

      - name: Discover staging bootstrap
        if: steps.guard.outputs.action == 'migrate-once'
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          INSTANCE_ID="$(jq -r '.[0]' <<<"$IDS")"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Send guarded quiz resilience migration through SSM
        if: steps.guard.outputs.action == 'migrate-once'
        id: command
        env:
          INSTANCE_ID: ${{ steps.bootstrap.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TRIGGER_SHA" > /tmp/ssm-parameters.json <<'PYTHON'
          import json, shlex, sys
          sha = sys.argv[1]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-learning-quiz-resilience.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$WORK_DIR/repo"
          cd "$WORK_DIR/repo"
          git checkout --quiet --detach {sha}
          test "$(git rev-parse HEAD)" = "{sha}"
          export LEARNING_QUIZ_RESILIENCE_MIGRATION_EXPECTED_SHA={sha}
          export AWS_REGION=ap-south-1
          bash scripts/aws/learning-quiz-resilience-migration.sh
          """
          print(json.dumps({"executionTimeout": ["1200"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore learning quiz resilience migration $TRIGGER_SHA" --timeout-seconds 1200 --parameters file:///tmp/ssm-parameters.json --query 'Command.CommandId' --output text)
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface migration evidence
        if: steps.guard.outputs.action == 'migrate-once'
        env:
          INSTANCE_ID: ${{ steps.bootstrap.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          echo "=== LEARNING QUIZ RESILIENCE MIGRATION STDOUT ==="
          jq -r '.StandardOutputContent // empty' /tmp/result.json
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          [[ -z "$STDERR_CONTENT" ]] || { echo "=== LEARNING QUIZ RESILIENCE MIGRATION STDERR ===" >&2; printf '%s\n' "$STDERR_CONTENT" >&2; }
          FINAL_STATUS=$(jq -r '.Status' /tmp/result.json)
          [[ "$FINAL_STATUS" == Success ]]
          STDOUT_CONTENT=$(jq -r '.StandardOutputContent // empty' /tmp/result.json)
          grep -q 'LEARNING_QUIZ_RESILIENCE_MIGRATION_APPLY_VERIFIED=true\|LEARNING_QUIZ_RESILIENCE_MIGRATION_ALREADY_APPLIED=true' <<<"$STDOUT_CONTENT"
