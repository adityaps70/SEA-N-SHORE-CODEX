name: AWS Phase 5B SES Account Read Patch

on:
  push:
    branches: [feat/aws-native-phase-0-1]
    paths:
      - .github/workflows/aws-phase5b-ses-account-read-patch.yml

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: ap-south-1
      EXPECTED_ACCOUNT_ID: "310356785722"
      TARGET_ROLE: sea-n-shore-staging-github-deploy
      TARGET_POLICY: sea-n-shore-staging-github-deploy
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for exact-head AWS Infrastructure CI." >&2
          exit 1

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Patch exact live IAM statement through bootstrap SSM
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$ACCOUNT" == "$EXPECTED_ACCOUNT_ID" ]]

          INSTANCE_ID="$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters 'Name=tag:Name,Values=sea-n-shore-bootstrap' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" && "$INSTANCE_ID" != *$'\t'* ]] || {
            echo "Expected exactly one running sea-n-shore-bootstrap instance." >&2
            exit 1
          }

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -euo pipefail
          ROLE_NAME="sea-n-shore-staging-github-deploy"
          POLICY_NAME="sea-n-shore-staging-github-deploy"
          CURRENT_JSON="$(aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --query PolicyDocument --output json)"
          export CURRENT_JSON
          python3 -c 'import json, os, urllib.parse; raw=json.loads(os.environ["CURRENT_JSON"]); doc=json.loads(urllib.parse.unquote(raw)) if isinstance(raw,str) else raw; statements=doc.get("Statement",[]); statements=[s for s in statements if s.get("Sid") != "Phase5bSesAccountRead"]; statements.append({"Sid":"Phase5bSesAccountRead","Effect":"Allow","Action":["ses:GetAccount"],"Resource":"*"}); doc["Statement"]=statements; open("/tmp/phase5b-github-deploy-policy.json","w").write(json.dumps(doc,separators=(",",":")))'
          aws iam put-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --policy-document file:///tmp/phase5b-github-deploy-policy.json
          VERIFY_JSON="$(aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$POLICY_NAME" --query PolicyDocument --output json)"
          export VERIFY_JSON
          python3 -c 'import json, os, urllib.parse; raw=json.loads(os.environ["VERIFY_JSON"]); doc=json.loads(urllib.parse.unquote(raw)) if isinstance(raw,str) else raw; matches=[s for s in doc.get("Statement",[]) if s.get("Sid")=="Phase5bSesAccountRead"]; assert matches==[{"Sid":"Phase5bSesAccountRead","Effect":"Allow","Action":["ses:GetAccount"],"Resource":"*"}], matches'
          rm -f /tmp/phase5b-github-deploy-policy.json
          echo PHASE5B_SES_ACCOUNT_READ_READY
          REMOTE
          )

          PARAMETERS="$(jq -cn --arg command "$REMOTE_SCRIPT" '{commands:[$command]}')"
          COMMAND_ID="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$PARAMETERS" \
            --comment "Sea N Shore Phase 5B exact SES account-read IAM patch" \
            --query 'Command.CommandId' \
            --output text)"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent \
                  --output text >&2 || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Timed out waiting for bootstrap IAM patch." >&2
          exit 1
