name: AWS Realtime E2E

on:
  push:
    branches: [feat/aws-native-phase-0-1]
    paths:
      - scripts/aws/realtime-e2e-action.txt
      - scripts/aws/realtime-e2e-guard.test.mjs
      - scripts/aws/realtime-staging-e2e.mjs
      - scripts/aws/realtime-e2e-ssm.mjs
      - scripts/aws/realtime-e2e-remote.sh
      - .github/workflows/aws-realtime-e2e.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-realtime-e2e
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.guard.outputs.run_e2e }}
      messaging_only: ${{ steps.guard.outputs.messaging_only }}
      run_probe: ${{ steps.guard.outputs.run_probe }}
      run_cleanup: ${{ steps.guard.outputs.run_cleanup }}
      cleanup_source_run_id: ${{ steps.guard.outputs.cleanup_source_run_id }}
      run_diagnostic: ${{ steps.guard.outputs.run_diagnostic }}
      diagnostic_source_run_id: ${{ steps.guard.outputs.diagnostic_source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - id: guard
        shell: bash
        run: |
          set -euo pipefail
          ACTION=$(tr -d '[:space:]' < scripts/aws/realtime-e2e-action.txt)
          case "$ACTION" in
            plan)
              echo 'run_e2e=false' >> "$GITHUB_OUTPUT"
              echo 'messaging_only=false' >> "$GITHUB_OUTPUT"
              echo 'run_probe=false' >> "$GITHUB_OUTPUT"
              echo 'run_cleanup=false' >> "$GITHUB_OUTPUT"
              echo 'cleanup_source_run_id=' >> "$GITHUB_OUTPUT"
              echo 'run_diagnostic=false' >> "$GITHUB_OUTPUT"
              echo 'diagnostic_source_run_id=' >> "$GITHUB_OUTPUT"
              ;;
            run-once)
              echo 'run_e2e=true' >> "$GITHUB_OUTPUT"
              echo 'messaging_only=false' >> "$GITHUB_OUTPUT"
              echo 'run_probe=false' >> "$GITHUB_OUTPUT"
              echo 'run_cleanup=false' >> "$GITHUB_OUTPUT"
              echo 'cleanup_source_run_id=' >> "$GITHUB_OUTPUT"
              echo 'run_diagnostic=false' >> "$GITHUB_OUTPUT"
              echo 'diagnostic_source_run_id=' >> "$GITHUB_OUTPUT"
              ;;
            messaging-once)
              echo 'run_e2e=true' >> "$GITHUB_OUTPUT"
              echo 'messaging_only=true' >> "$GITHUB_OUTPUT"
              echo 'run_probe=false' >> "$GITHUB_OUTPUT"
              echo 'run_cleanup=false' >> "$GITHUB_OUTPUT"
              echo 'cleanup_source_run_id=' >> "$GITHUB_OUTPUT"
              echo 'run_diagnostic=false' >> "$GITHUB_OUTPUT"
              echo 'diagnostic_source_run_id=' >> "$GITHUB_OUTPUT"
              ;;
            probe-connect-once)
              echo 'run_e2e=false' >> "$GITHUB_OUTPUT"
              echo 'messaging_only=false' >> "$GITHUB_OUTPUT"
              echo 'run_probe=true' >> "$GITHUB_OUTPUT"
              echo 'run_cleanup=false' >> "$GITHUB_OUTPUT"
              echo 'cleanup_source_run_id=' >> "$GITHUB_OUTPUT"
              echo 'run_diagnostic=false' >> "$GITHUB_OUTPUT"
              echo 'diagnostic_source_run_id=' >> "$GITHUB_OUTPUT"
              ;;
            cleanup-once:*)
              SOURCE_RUN_ID=${ACTION#cleanup-once:}
              [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid cleanup source run id: $SOURCE_RUN_ID" >&2; exit 1; }
              echo 'run_e2e=false' >> "$GITHUB_OUTPUT"
              echo 'messaging_only=false' >> "$GITHUB_OUTPUT"
              echo 'run_probe=false' >> "$GITHUB_OUTPUT"
              echo 'run_cleanup=true' >> "$GITHUB_OUTPUT"
              echo "cleanup_source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
              echo 'run_diagnostic=false' >> "$GITHUB_OUTPUT"
              echo 'diagnostic_source_run_id=' >> "$GITHUB_OUTPUT"
              ;;
            diagnose-connect-once:*)
              SOURCE_RUN_ID=${ACTION#diagnose-connect-once:}
              [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid diagnostic source run id: $SOURCE_RUN_ID" >&2; exit 1; }
              echo 'run_e2e=false' >> "$GITHUB_OUTPUT"
              echo 'messaging_only=false' >> "$GITHUB_OUTPUT"
              echo 'run_probe=false' >> "$GITHUB_OUTPUT"
              echo 'run_cleanup=false' >> "$GITHUB_OUTPUT"
              echo 'cleanup_source_run_id=' >> "$GITHUB_OUTPUT"
              echo 'run_diagnostic=true' >> "$GITHUB_OUTPUT"
              echo "diagnostic_source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unsupported REALTIME_E2E_ACTION=$ACTION" >&2; exit 1 ;;
          esac

  realtime-e2e:
    needs: guard
    if: needs.guard.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    env:
      AWS_REGION: ap-south-1
      SITE_URL: https://d3prih0q6jofyr.cloudfront.net
      COGNITO_POOL_NAME: sea-n-shore-staging-users
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API")
            STATUS=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")
            CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")
            if [[ "$STATUS" == completed ]]; then
              [[ "$CONCLUSION" == success ]] || { echo 'Exact-head AWS Infrastructure CI is not green.' >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head AWS Infrastructure CI.' >&2
          exit 1

      - name: Guard push E2E against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'Branch moved; refusing stale Realtime E2E.' >&2; exit 1; }

      - name: Verify live staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 "$SITE_URL/" >/dev/null
          curl -fsS --retry 3 --retry-delay 2 "$SITE_URL/api/health/home" | jq -e '.status == "ok"' >/dev/null

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 310356785722 ]]

      - name: Discover bootstrap instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters 'Name=tag:Name,Values=sea-n-shore-bootstrap' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "INSTANCE_ID=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_ENV"

      - name: Initialize disposable Realtime E2E data
        shell: bash
        run: |
          set -euo pipefail
          SENDER_PASSWORD="SnS!RealtimeSend${GITHUB_RUN_ID}Aa9#"
          RECIPIENT_PASSWORD="SnS!RealtimeRecv${GITHUB_RUN_ID}Bb8#"
          echo "::add-mask::$SENDER_PASSWORD"
          echo "::add-mask::$RECIPIENT_PASSWORD"
          {
            echo "E2E_SENDER_EMAIL=sea-n-shore-realtime-e2e-${GITHUB_RUN_ID}-sender@example.com"
            echo "E2E_RECIPIENT_EMAIL=sea-n-shore-realtime-e2e-${GITHUB_RUN_ID}-recipient@example.com"
            echo 'E2E_SENDER_NAME=Realtime E2E Sender'
            echo 'E2E_RECIPIENT_NAME=Realtime E2E Recipient'
            echo "E2E_SENDER_PASSWORD=$SENDER_PASSWORD"
            echo "E2E_RECIPIENT_PASSWORD=$RECIPIENT_PASSWORD"
            echo "E2E_MESSAGE_BODY=Realtime canonical message ${GITHUB_RUN_ID}"
            echo "E2E_INJECTED_BODY=Realtime forbidden socket write ${GITHUB_RUN_ID}"
            echo "E2E_SOCIAL_POST_BODY=Realtime social canonical post ${GITHUB_RUN_ID}"
            echo "E2E_SOCIAL_COMMENT_BODY=Realtime social canonical comment ${GITHUB_RUN_ID}"
            echo "E2E_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public sign-up disposable users
        run: E2E_PHASE=signup node scripts/aws/realtime-staging-e2e.mjs
      - name: Confirm disposable users through guarded AWS control plane
        run: node scripts/aws/realtime-e2e-ssm.mjs confirm
      - name: Complete authenticated maritime onboarding
        run: E2E_PHASE=onboarding node scripts/aws/realtime-staging-e2e.mjs
      - name: Verify live authenticated social realtime invalidations
        if: needs.guard.outputs.messaging_only != 'true'
        run: E2E_PHASE=social node scripts/aws/realtime-staging-e2e.mjs

      - name: Prepare UI-accepted disposable connection and conversation
        shell: bash
        env:
          MESSAGING_ONLY: ${{ needs.guard.outputs.messaging_only }}
        run: |
          set -euo pipefail
          PREPARE_PHASE=prepare
          if [[ "$MESSAGING_ONLY" == true ]]; then PREPARE_PHASE=prepare-messaging; fi
          OUTPUT=$(node scripts/aws/realtime-e2e-ssm.mjs "$PREPARE_PHASE")
          printf '%s\n' "$OUTPUT"
          CONVERSATION_ID=$(sed -n 's/^REALTIME_E2E_CONVERSATION_ID=//p' <<<"$OUTPUT" | tail -1)
          [[ "$CONVERSATION_ID" =~ ^[0-9a-f-]{36}$ ]]
          echo "E2E_CONVERSATION_ID=$CONVERSATION_ID" >> "$GITHUB_ENV"

      - name: Verify live authenticated realtime messaging
        run: E2E_PHASE=realtime node scripts/aws/realtime-staging-e2e.mjs
      - name: Verify canonical Aurora message and outbox state
        run: node scripts/aws/realtime-e2e-ssm.mjs verify-durable
      - name: verify-social-durable Aurora social and outbox state
        if: needs.guard.outputs.messaging_only != 'true'
        run: node scripts/aws/realtime-e2e-ssm.mjs verify-social-durable
      - name: Verify realtime DynamoDB SQS CloudWatch and privacy health
        run: node scripts/aws/realtime-e2e-ssm.mjs verify-infra

      - name: Cleanup disposable Realtime E2E data
        if: always()
        run: node scripts/aws/realtime-e2e-ssm.mjs cleanup

  realtime-connect-probe:
    needs: guard
    if: needs.guard.outputs.run_probe == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1
      SITE_URL: https://d3prih0q6jofyr.cloudfront.net
      COGNITO_POOL_NAME: sea-n-shore-staging-users
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API")
            STATUS=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")
            CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")
            if [[ "$STATUS" == completed ]]; then
              [[ "$CONCLUSION" == success ]] || { echo 'Exact-head AWS Infrastructure CI is not green.' >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head AWS Infrastructure CI.' >&2
          exit 1

      - name: Guard push connect probe against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'Branch moved; refusing stale Realtime connect probe.' >&2; exit 1; }

      - name: Verify live staging endpoints
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 "$SITE_URL/" >/dev/null
          curl -fsS --retry 3 --retry-delay 2 "$SITE_URL/api/health/home" | jq -e '.status == "ok"' >/dev/null

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 310356785722 ]]

      - name: Discover bootstrap instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters 'Name=tag:Name,Values=sea-n-shore-bootstrap' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "INSTANCE_ID=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_ENV"

      - name: Initialize disposable Realtime connect probe data
        shell: bash
        run: |
          set -euo pipefail
          SENDER_PASSWORD="SnS!RealtimeSend${GITHUB_RUN_ID}Aa9#"
          RECIPIENT_PASSWORD="SnS!RealtimeRecv${GITHUB_RUN_ID}Bb8#"
          echo "::add-mask::$SENDER_PASSWORD"
          echo "::add-mask::$RECIPIENT_PASSWORD"
          {
            echo "E2E_SENDER_EMAIL=sea-n-shore-realtime-e2e-${GITHUB_RUN_ID}-sender@example.com"
            echo "E2E_RECIPIENT_EMAIL=sea-n-shore-realtime-e2e-${GITHUB_RUN_ID}-recipient@example.com"
            echo 'E2E_SENDER_NAME=Realtime E2E Sender'
            echo 'E2E_RECIPIENT_NAME=Realtime E2E Recipient'
            echo "E2E_SENDER_PASSWORD=$SENDER_PASSWORD"
            echo "E2E_RECIPIENT_PASSWORD=$RECIPIENT_PASSWORD"
            echo "E2E_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public sign-up disposable probe users
        run: E2E_PHASE=signup node scripts/aws/realtime-staging-e2e.mjs
      - name: Confirm disposable probe users through guarded AWS control plane
        run: node scripts/aws/realtime-e2e-ssm.mjs confirm
      - name: Complete authenticated maritime onboarding for probe users
        run: E2E_PHASE=onboarding node scripts/aws/realtime-staging-e2e.mjs
      - name: Attempt one authenticated Realtime WebSocket connect
        run: E2E_PHASE=connect-probe node scripts/aws/realtime-staging-e2e.mjs

      - name: Cleanup disposable Realtime connect probe data
        if: always()
        run: node scripts/aws/realtime-e2e-ssm.mjs cleanup

  realtime-cleanup:
    needs: guard
    if: needs.guard.outputs.run_cleanup == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      AWS_REGION: ap-south-1
      COGNITO_POOL_NAME: sea-n-shore-staging-users
      SOURCE_RUN_ID: ${{ needs.guard.outputs.cleanup_source_run_id }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API")
            STATUS=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")
            CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")
            if [[ "$STATUS" == completed ]]; then
              [[ "$CONCLUSION" == success ]] || { echo 'Exact-head AWS Infrastructure CI is not green.' >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head AWS Infrastructure CI.' >&2
          exit 1

      - name: Guard push E2E against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'Branch moved; refusing stale Realtime cleanup.' >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 310356785722 ]]

      - name: Discover bootstrap instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters 'Name=tag:Name,Values=sea-n-shore-bootstrap' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "INSTANCE_ID=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_ENV"

      - name: Initialize targeted disposable cleanup data
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          {
            echo "E2E_SENDER_EMAIL=sea-n-shore-realtime-e2e-${SOURCE_RUN_ID}-sender@example.com"
            echo "E2E_RECIPIENT_EMAIL=sea-n-shore-realtime-e2e-${SOURCE_RUN_ID}-recipient@example.com"
          } >> "$GITHUB_ENV"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cleanup prior disposable Realtime E2E data
        run: node scripts/aws/realtime-e2e-ssm.mjs cleanup

  realtime-connect-diagnostic:
    needs: guard
    if: needs.guard.outputs.run_diagnostic == 'true'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      AWS_REGION: ap-south-1
      SOURCE_RUN_ID: ${{ needs.guard.outputs.diagnostic_source_run_id }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$API")
            STATUS=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")
            CONCLUSION=$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")
            if [[ "$STATUS" == completed ]]; then
              [[ "$CONCLUSION" == success ]] || { echo 'Exact-head AWS Infrastructure CI is not green.' >&2; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for exact-head AWS Infrastructure CI.' >&2
          exit 1

      - name: Guard diagnostic against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)" == "$GITHUB_SHA" ]] || { echo 'Branch moved; refusing stale Realtime diagnostic.' >&2; exit 1; }

      - name: Resolve bounded failed-run window
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
          [[ "$(jq -r '.name' <<<"$JSON")" == 'AWS Realtime E2E' ]]
          [[ "$(jq -r '.head_branch' <<<"$JSON")" == 'feat/aws-native-phase-0-1' ]]
          START=$(jq -r '.run_started_at' <<<"$JSON")
          END=$(jq -r '.updated_at' <<<"$JSON")
          START_MS=$(( $(date -u -d "$START - 2 minutes" +%s) * 1000 ))
          END_MS=$(( $(date -u -d "$END + 2 minutes" +%s) * 1000 ))
          (( END_MS >= START_MS ))
          (( END_MS - START_MS <= 3600000 ))
          {
            echo "E2E_DIAGNOSTIC_START_MS=$START_MS"
            echo "E2E_DIAGNOSTIC_END_MS=$END_MS"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 310356785722 ]]

      - name: Discover bootstrap instance
        shell: bash
        run: |
          set -euo pipefail
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters 'Name=tag:Name,Values=sea-n-shore-bootstrap' 'Name=instance-state-name,Values=running' --query 'Reservations[].Instances[].InstanceId' --output json)
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "INSTANCE_ID=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_ENV"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read failed realtime connect evidence
        run: node scripts/aws/realtime-e2e-ssm.mjs diagnose-connect
