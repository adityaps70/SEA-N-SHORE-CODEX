name: AWS Live Error Diagnostic

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-live-error-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-http-probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Probe public staging routes
        run: |
          set -euo pipefail
          test -n "$SITE_URL" || (echo "Missing staging variable NEXT_PUBLIC_SITE_URL" >&2 && exit 1)

          for path in / /auth/sign-in /auth/sign-up /api/health/phase4; do
            body="/tmp/body-$(echo "$path" | tr '/?' '__').txt"
            headers="/tmp/headers-$(echo "$path" | tr '/?' '__').txt"
            status=$(curl --show-error --silent --max-time 45 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              "${SITE_URL%/}${path}")
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{print $2}' "$headers" | tr -d '\r' | tail -n 1)
            echo "ROUTE $path => HTTP $status content-type=${content_type:-unknown} bytes=$(wc -c < "$body")"
            if [ "$status" -ge 500 ]; then
              echo "SERVER_ERROR_ROUTE=$path"
              grep -Eo 'digest[^,}<]{0,120}|ERROR[[:space:]]+[0-9]+' "$body" | head -n 10 || true
            fi
          done
