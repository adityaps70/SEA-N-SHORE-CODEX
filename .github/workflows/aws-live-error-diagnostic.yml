name: AWS Live Error Diagnostic

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-live-error-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-sign-in-probe:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Reproduce live sign-in page in browser
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test'

          const siteUrl = process.env.SITE_URL
          if (!siteUrl) throw new Error('Missing staging variable NEXT_PUBLIC_SITE_URL')

          const browser = await chromium.launch()
          const context = await browser.newContext()
          const page = await context.newPage()
          const diagnostics = []

          page.on('pageerror', (error) => diagnostics.push(`PAGEERROR ${error.name}: ${error.message}`))
          page.on('console', (message) => {
            if (message.type() === 'error') diagnostics.push(`CONSOLE_ERROR ${message.text()}`)
          })
          page.on('requestfailed', (request) => {
            diagnostics.push(`REQUEST_FAILED ${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`)
          })
          page.on('response', (response) => {
            if (response.status() >= 400) diagnostics.push(`HTTP_${response.status()} ${response.url()}`)
          })

          const response = await page.goto(`${siteUrl.replace(/\/$/, '')}/auth/sign-in?rev=11`, {
            waitUntil: 'networkidle',
            timeout: 60000,
          })

          console.log(`NAV_STATUS ${response?.status() ?? 'none'}`)
          console.log(`TITLE ${await page.title()}`)
          const text = (await page.locator('body').innerText()).replace(/\s+/g, ' ').trim()
          console.log(`BODY_TEXT ${text.slice(0, 1000)}`)

          for (const line of diagnostics) console.log(line)

          const hasExpectedForm = await page.getByRole('heading', { name: 'Welcome back' }).count()
          const hasServerError = /This page couldn.?t load|A server error occurred/i.test(text)
          console.log(`EXPECTED_FORM_COUNT ${hasExpectedForm}`)
          console.log(`SERVER_ERROR_PAGE ${hasServerError}`)

          await browser.close()

          if (hasExpectedForm !== 1 || hasServerError || diagnostics.some((line) => line.startsWith('PAGEERROR '))) {
            process.exit(1)
          }
          NODE
