name: AWS Phase 5A Bootstrap Diagnostic

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-phase5a-bootstrap-diagnostic.yml

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Discover bootstrap instance
        id: instance
        run: |
          IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          test "$(jq 'length' <<<"$IDS")" -eq 1
          echo "instance_id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"

      - name: Query media state through SSM
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          cat > /tmp/commands.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "CLUSTER_JSON=$(aws rds describe-db-clusters --region ap-south-1 --db-cluster-identifier sea-n-shore-staging-aurora --output json)",
              "CLUSTER_ARN=$(jq -r '.DBClusters[0].DBClusterArn' <<<\"$CLUSTER_JSON\")",
              "SECRET_ARN=$(jq -r '.DBClusters[0].MasterUserSecret.SecretArn' <<<\"$CLUSTER_JSON\")",
              "RESULT=$(aws rds-data execute-statement --region ap-south-1 --resource-arn \"$CLUSTER_ARN\" --secret-arn \"$SECRET_ARN\" --database sea_n_shore --sql \"select count(*)::bigint, coalesce(min(storage_path),'') from public.post_media\" --output json)",
              "COUNT=$(jq -r '.records[0][0].longValue // 0' <<<\"$RESULT\")",
              "SAMPLE=$(jq -r '.records[0][1].stringValue // empty' <<<\"$RESULT\")",
              "echo POST_MEDIA_COUNT=$COUNT",
              "if [ -n \"$SAMPLE\" ]; then echo SAMPLE_PATH=$SAMPLE; TD=$(aws ecs describe-task-definition --region ap-south-1 --task-definition sea-n-shore-staging-web --query taskDefinition --output json); SUPABASE_URL=$(jq -r '.containerDefinitions[] | select(.name==\"web\") | .environment[] | select(.name==\"NEXT_PUBLIC_SUPABASE_URL\") | .value' <<<\"$TD\"); STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \"${SUPABASE_URL%/}/storage/v1/object/public/post-media/$SAMPLE\" || true); echo SAMPLE_PUBLIC_HTTP=$STATUS; fi",
              "S3_COUNT=$(aws s3api list-objects-v2 --region ap-south-1 --bucket sea-n-shore-staging-310356785722-media --query 'KeyCount' --output text)",
              "echo S3_OBJECT_COUNT=$S3_COUNT",
              "echo MEDIA_STATE_DIAGNOSTIC_COMPLETE"
            ]
          }
          JSON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --timeout-seconds 300 --parameters file:///tmp/commands.json --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and print result
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          jq -r '.StandardOutputContent // empty' /tmp/result.json
          STDERR=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          if [ -n "$STDERR" ]; then printf '%s\n' "$STDERR" >&2; fi
          test "$(jq -r '.Status' /tmp/result.json)" = "Success"
