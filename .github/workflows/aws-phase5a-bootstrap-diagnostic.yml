name: AWS Phase 5A Bootstrap Diagnostic

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-phase5a-bootstrap-diagnostic.yml

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Discover bootstrap instance
        id: instance
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)
          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          test "$COUNT" -eq 1 || { echo "Expected exactly one running bootstrap instance; found $COUNT." >&2; exit 1; }
          INSTANCE_ID=$(jq -r '.[0]' <<<"$INSTANCE_IDS")
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Inspect trusted Supabase credential sources through SSM
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          cat > /tmp/commands.json <<'JSON'
          {
            "commands": [
              "set -euo pipefail",
              "echo '=== BOOTSTRAP IDENTITY ==='",
              "aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json",
              "echo '=== ENV SERVICE ROLE KEY ==='",
              "if [ -n \"${SUPABASE_SERVICE_ROLE_KEY:-}\" ]; then echo PRESENT; else echo ABSENT; fi",
              "echo '=== REPOSITORY ENV FILES WITH SERVICE ROLE NAME ==='",
              "grep -RIl --exclude-dir=.git --exclude='*.log' 'SUPABASE_SERVICE_ROLE_KEY' /home/ssm-user/SEA-N-SHORE-CODEX 2>/dev/null | sed 's#^/home/ssm-user/SEA-N-SHORE-CODEX/##' | head -20 || true",
              "echo '=== SECRETS MANAGER NAMES MATCHING SUPABASE ==='",
              "aws secretsmanager list-secrets --region ap-south-1 --query \"SecretList[?contains(Name, 'supabase') || contains(Name, 'Supabase')].[Name,ARN]\" --output json 2>/dev/null || echo ACCESS_DENIED_OR_NONE",
              "echo '=== SSM PARAMETER NAMES MATCHING SUPABASE ==='",
              "aws ssm describe-parameters --region ap-south-1 --query \"Parameters[?contains(Name, 'supabase') || contains(Name, 'Supabase')].[Name,Type]\" --output json 2>/dev/null || echo ACCESS_DENIED_OR_NONE",
              "echo '=== DIAGNOSTIC COMPLETE ==='"
            ]
          }
          JSON
          COMMAND_ID=$(aws ssm send-command --region "$AWS_REGION" --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --comment "Sea N Shore Phase 5A credential diagnostic" --timeout-seconds 300 --parameters file:///tmp/commands.json --query 'Command.CommandId' --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and print safe diagnostic output
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          STATUS=Pending
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          jq -r '.StandardOutputContent // empty' /tmp/result.json
          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/result.json)
          if [ -n "$STDERR_CONTENT" ]; then printf '%s\n' "$STDERR_CONTENT" >&2; fi
          test "$(jq -r '.Status' /tmp/result.json)" = "Success"
