name: AWS Phase 4 Final Gate

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - .github/workflows/aws-phase4-final-gate.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cloudwatch-review:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      LOG_GROUP: /ecs/sea-n-shore-staging/web
      LOOKBACK_SECONDS: "7200"

    steps:
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Discover bootstrap instance
        id: instance
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=sea-n-shore-bootstrap" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output json)

          COUNT=$(jq 'length' <<<"$INSTANCE_IDS")
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected exactly one running sea-n-shore-bootstrap instance; found $COUNT." >&2
            exit 1
          fi

          echo "instance_id=$(jq -r '.[0]' <<<"$INSTANCE_IDS")" >> "$GITHUB_OUTPUT"

      - name: Review recent application errors through SSM
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          cat > /tmp/phase4-cloudwatch-review.sh <<'SCRIPT'
          set -euo pipefail
          START_MS=$(( ( $(date +%s) - 7200 ) * 1000 ))
          aws logs filter-log-events \
            --region ap-south-1 \
            --log-group-name /ecs/sea-n-shore-staging/web \
            --start-time "$START_MS" \
            --output json > /tmp/phase4-cloudwatch.json

          TOTAL=$(jq '.events | length' /tmp/phase4-cloudwatch.json)
          MATCHES=$(jq -r '.events[].message' /tmp/phase4-cloudwatch.json \
            | grep -Eai '(^|[^[:alpha:]])(error|exception|unhandled|fatal|ECONNREFUSED|ETIMEDOUT|password authentication failed|database[^[:cntrl:]]*(failed|error)|auth[^[:cntrl:]]*(failed|error)|HTTP[[:space:]]+5[0-9][0-9])([^[:alpha:]]|$)' \
            || true)
          MATCH_COUNT=$(printf '%s\n' "$MATCHES" | sed '/^$/d' | wc -l | tr -d ' ')

          echo "CLOUDWATCH_EVENTS_REVIEWED=$TOTAL"
          echo "STRONG_RUNTIME_ERROR_MATCHES=$MATCH_COUNT"

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "Repeating runtime error signatures detected in the last two hours." >&2
            printf '%s\n' "$MATCHES" \
              | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[redacted-email]/g' \
              | head -n 10 >&2
            exit 1
          fi

          if [ "$MATCH_COUNT" -eq 1 ]; then
            echo "One non-repeating runtime error signature was observed; no repeating error pattern was detected."
          else
            echo "No strong runtime error signatures were observed."
          fi
          SCRIPT

          jq -Rs '{commands:[.]}' < /tmp/phase4-cloudwatch-review.sh > /tmp/ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Sea N Shore Phase 4 CloudWatch review" \
            --timeout-seconds 300 \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          test -n "$COMMAND_ID" || { echo "SSM did not return a command ID." >&2; exit 1; }
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Surface CloudWatch review result
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
        run: |
          STATUS="Pending"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json > /tmp/ssm-result.json

          echo "=== PHASE 4 CLOUDWATCH REVIEW ==="
          jq -r '.StandardOutputContent // empty' /tmp/ssm-result.json

          STDERR_CONTENT=$(jq -r '.StandardErrorContent // empty' /tmp/ssm-result.json)
          if [ -n "$STDERR_CONTENT" ]; then
            printf '%s\n' "$STDERR_CONTENT" >&2
          fi

          FINAL_STATUS=$(jq -r '.Status' /tmp/ssm-result.json)
          echo "SSM final status: $FINAL_STATUS"
          test "$FINAL_STATUS" = "Success"
