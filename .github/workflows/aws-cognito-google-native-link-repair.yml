name: AWS Cognito Google Native Link Repair

on:
  push:
    branches:
      - feat/aws-native-phase-0-1
    paths:
      - scripts/aws/cognito-google-native-link-repair.sh
      - scripts/aws/cognito-google-native-link-repair-action.txt
      - scripts/aws/cognito-google-native-link-repair.test.mjs
      - .github/workflows/aws-cognito-google-native-link-repair.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: sea-n-shore-cognito-google-native-link-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/feat/aws-native-phase-0-1'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      AWS_REGION: ap-south-1

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Verify repair contract
        run: node --test scripts/aws/cognito-google-native-link-repair.test.mjs

      - name: Validate repair action
        id: action
        shell: bash
        run: |
          set -euo pipefail
          ACTION="$(tr -d '[:space:]' < scripts/aws/cognito-google-native-link-repair-action.txt)"
          case "$ACTION" in plan|repair-once|send-reset-once) ;; *) echo "Unsupported repair action: $ACTION" >&2; exit 1 ;; esac
          if [[ "$ACTION" != "plan" && "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "$ACTION is allowed only from an exact branch push." >&2
            exit 1
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head AWS Infrastructure CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100"
          for attempt in $(seq 1 90); do
            JSON="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API")"
            STATUS="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].status // "missing"' <<<"$JSON")"
            CONCLUSION="$(jq -r '[.workflow_runs[] | select(.name == "AWS Infrastructure CI")][0].conclusion // ""' <<<"$JSON")"
            echo "exact-head CI status=$STATUS conclusion=${CONCLUSION:-pending}"
            if [[ "$STATUS" == "completed" ]]; then
              [[ "$CONCLUSION" == "success" ]] || exit 1
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Guard repair against a moved branch
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/feat/aws-native-phase-0-1 | cut -f1)"
          [[ "$REMOTE_HEAD" == "$GITHUB_SHA" ]] || { echo "Branch moved after repair started; refusing stale execution." >&2; exit 1; }

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1

      - name: Verify staging AWS account
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "310356785722" ]]

      - name: Discover bootstrap instance
        id: instance
        shell: bash
        run: |
          set -euo pipefail
          IDS="$(aws ec2 describe-instances --region "$AWS_REGION" --filters "Name=tag:Name,Values=sea-n-shore-bootstrap" "Name=instance-state-name,Values=running" --query 'Reservations[].Instances[].InstanceId' --output json)"
          [[ "$(jq 'length' <<<"$IDS")" -eq 1 ]]
          echo "instance_id=$(jq -r '.[0]' <<<"$IDS")" >> "$GITHUB_OUTPUT"

      - name: Send guarded repair through SSM
        id: command
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TRIGGER_SHA" =~ ^[0-9a-f]{40}$ ]]
          python3 - "$TRIGGER_SHA" > /tmp/ssm-parameters.json <<'PYTHON'
          import json, shlex, sys
          sha = sys.argv[1]
          script = f"""set -euo pipefail
          umask 077
          WORK_DIR=$(mktemp -d /var/tmp/sea-n-shore-cognito-repair-run.XXXXXXXX)
          trap 'rm -rf -- "$WORK_DIR"' EXIT
          git clone --quiet --single-branch --branch feat/aws-native-phase-0-1 https://github.com/adityaps70/SEA-N-SHORE-CODEX.git "$WORK_DIR/repo"
          cd "$WORK_DIR/repo"
          git checkout --quiet --detach {sha}
          test "$(git rev-parse HEAD)" = "{sha}"
          export COGNITO_GOOGLE_NATIVE_LINK_REPAIR_EXPECTED_SHA={sha}
          bash scripts/aws/cognito-google-native-link-repair.sh
          """
          print(json.dumps({"executionTimeout": ["1200"], "commands": ["runuser -u ssm-user -- bash -lc " + shlex.quote(script)]}))
          PYTHON

          COMMAND_ID="$(aws ssm send-command             --region "$AWS_REGION"             --instance-ids "$INSTANCE_ID"             --document-name AWS-RunShellScript             --comment "Sea N Shore Cognito Google/native repair $TRIGGER_SHA"             --timeout-seconds 1200             --parameters file:///tmp/ssm-parameters.json             --query 'Command.CommandId'             --output text)"
          test -n "$COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait and surface repair evidence
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
          COMMAND_ID: ${{ steps.command.outputs.command_id }}
          ACTION: ${{ steps.action.outputs.action }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS=Pending
          for attempt in $(seq 1 240); do
            STATUS="$(aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)"
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done

          aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json > /tmp/result.json
          STDOUT_CONTENT="$(jq -r '.StandardOutputContent // empty' /tmp/result.json)"
          STDERR_CONTENT="$(jq -r '.StandardErrorContent // empty' /tmp/result.json)"
          printf '%s\n' "$STDOUT_CONTENT"
          [[ -z "$STDERR_CONTENT" ]] || printf '%s\n' "$STDERR_CONTENT" >&2
          [[ "$(jq -r '.Status' /tmp/result.json)" == "Success" ]]

          if [[ "$ACTION" == "plan" ]]; then
            grep -q 'COGNITO_GOOGLE_NATIVE_REPAIR_PLAN_ONLY_NO_APPLY=true' <<<"$STDOUT_CONTENT"
          elif [[ "$ACTION" == "send-reset-once" ]]; then
            grep -q 'COGNITO_GOOGLE_HISTORICAL_RESET_SENT=true' <<<"$STDOUT_CONTENT"
          else
            grep -q 'COGNITO_GOOGLE_NATIVE_REPAIR_APPLY_VERIFIED=true' <<<"$STDOUT_CONTENT"
          fi
