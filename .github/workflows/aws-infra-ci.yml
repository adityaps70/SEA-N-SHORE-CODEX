name: AWS Infrastructure CI

on:
  workflow_dispatch:
  # Round DB (Actions minutes, owner-approved 11 Nov): pushes to the feature branch and main, and pull requests into
  # them. A PR branch is checked by its pull_request run, not by a push run too; a branch push with no PR runs nothing.
  push:
    branches:
      - feat/aws-native-phase-0-1
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - src/**
      - public/brand/**
      - infra/aws/**
      - scripts/aws/**
      - scripts/load-test/**
      - scripts/migration/**
      - scripts/workers/**
      - vitest.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/aws-*.yml
  pull_request:
    branches: [main, feat/aws-native-phase-0-1]
    # Cost cut 1 (owner-approved 14 Nov): a draft runs only the cheap jobs; "Ready for review" starts the full run.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - src/**
      - public/brand/**
      - infra/aws/**
      - scripts/aws/**
      - scripts/load-test/**
      - scripts/migration/**
      - scripts/workers/**
      - vitest.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/aws-*.yml

permissions:
  contents: read

# Actions minutes: a newer push to the same ref supersedes this run (a guarded runner on an older
# commit refuses anyway once the branch has moved).
concurrency:
  group: aws-infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Actions minutes: a heavy job below is skipped only when every file it reads is byte-identical to a
  # commit whose Infra CI passed (a merge of an up-to-date PR branch, a rearm, a workflow-only change);
  # see scripts/aws/infra-ci-scope.sh. This job (guard and runner contract tests) always runs, and decides the scope
  # first (cost cut 2, owner-approved 14 Nov: no separate scope job, so no extra rounded-up job minute per run). A
  # pull request is scoped against its base branch tip; a manual run, or any doubt, runs everything.
  remote-execution-contract:
    name: GitHub SSM execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      application: ${{ steps.scope.outputs.application }}
      terraform: ${{ steps.scope.outputs.terraform }}
      guard: ${{ steps.scope.outputs.guard }}
      container: ${{ steps.scope.outputs.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Decide which heavy jobs this commit needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/aws/infra-ci-scope.sh
      # Cost cut 1: say plainly on a draft that the full application tests have not run yet.
      - name: Draft pull request (Application verify waits for Ready for review)
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo "::notice title=Draft pull request::Application verify is skipped on drafts. Mark the pull request Ready for review to run it; merge only after it shows green (not skipped) on the final commit."
          echo "### Draft pull request: Application verify skipped. Mark Ready for review to run it; merge only after it is green on the final commit." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify edge recovery plan guard
        run: python3 scripts/aws/check-edge-plan.test.py
      - name: Verify edge recovery distribution inventory contract
        run: node --test scripts/aws/edge-recovery-distributions.test.mjs
      - name: Verify Server Action edge header contract
        run: python3 scripts/aws/server-action-edge-header.test.py
      - name: Verify canonical host redirect function
