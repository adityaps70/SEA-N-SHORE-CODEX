name: AWS Infrastructure CI

on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - src/**
      - public/brand/**
      - infra/aws/**
      - scripts/aws/**
      - scripts/migration/**
      - scripts/workers/**
      - vitest.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/aws-*.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - src/**
      - public/brand/**
      - infra/aws/**
      - scripts/aws/**
      - scripts/migration/**
      - scripts/workers/**
      - vitest.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/aws-*.yml

jobs:
  remote-execution-contract:
    name: GitHub SSM execution contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify edge recovery plan guard
        run: python3 scripts/aws/check-edge-plan.test.py
      - name: Verify remote execution security contract
        run: node --test scripts/aws/remote-execution-config.test.mjs
      - name: Verify staging deploy guard contract
        run: node --test scripts/aws/staging-deploy-guard.test.mjs
      - name: Verify onboarding e2e guard contract
        run: node --test scripts/aws/onboarding-e2e-guard.test.mjs
      - name: Verify post media migration contract
        run: node --test scripts/aws/migrate-post-media-to-s3.test.mjs
      - name: Verify database reconciliation contract
        run: node --test scripts/migration/reconcile-postgres.test.mjs
      - name: Verify storage reconciliation contract
        run: node --test scripts/migration/reconcile-storage.test.mjs
      - name: Verify identity reconciliation contract
        run: node --test scripts/migration/reconcile-identities.test.mjs
      - name: Verify Phase 5B SES readiness contract
        run: node --test scripts/aws/phase5b-ses-readiness.test.mjs
      - name: Verify Phase 5B SES Terraform contract
        run: node --test scripts/aws/phase5b-ses-terraform.test.mjs
      - name: Verify Phase 5B SES cutover contract
        run: node --test scripts/aws/phase5b-ses-cutover.test.mjs
      - name: Verify event outbox schema contract
        run: node --test scripts/aws/event-outbox-schema.test.mjs
      - name: Verify profile media schema contract
        run: node --test scripts/aws/profile-media-schema.test.mjs
      - name: Verify exact profile identity schema contract
        run: node --test scripts/aws/profile-identity-schema.test.mjs
      - name: Verify social event Terraform contract
        run: node --test scripts/aws/social-events-terraform.test.mjs
      - name: Verify social infrastructure plan classifier
        run: node --test scripts/aws/check-social-plan.test.mjs
      - name: Verify social event parity runtime audit contract
        run: node --test scripts/aws/social-event-parity.test.mjs
      - name: Verify Aurora migration semantic audit contract
        run: node --test scripts/aws/aurora-migration-semantic-audit.test.mjs
      - name: Verify Aurora identity parity audit contract
        run: node --test scripts/aws/aurora-identity-parity.test.mjs
      - name: Verify origin TLS certificate state selector contract
        run: node --test scripts/aws/origin-tls-certificate-state.test.mjs
      - name: Verify social worker contract
        run: node --test scripts/workers/social-event-worker.test.mjs

  application:
    name: Application verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify AWS application independence
        run: bash scripts/aws/check-phase4-supabase-runtime.sh
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with known-good npm
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --run

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=https://staging.example.com -t sea-n-shore-ci:${GITHUB_SHA} .

  terraform-app:
    name: Terraform validate (infra/aws/app)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform -chdir=infra/aws/app fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=infra/aws/app init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/aws/app validate

  terraform-bootstrap:
    name: Terraform validate (infra/aws/bootstrap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform format
        run: terraform -chdir=infra/aws/bootstrap fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=infra/aws/bootstrap init -backend=false
      - name: Terraform validate
        run: terraform -chdir=infra/aws/bootstrap validate

  terraform-guard:
    name: Terraform plan guard tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with known-good npm
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Run guard tests
        run: npm test -- --run scripts/aws/check-edge-plan.test.ts scripts/aws/check-social-plan.test.ts
