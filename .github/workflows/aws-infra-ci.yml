  application:
    name: Application verify
    needs: remote-execution-contract
    # Cost cut 1: not on a draft pull request; it runs on "Ready for review" and on every push after that.
    if: needs.remote-execution-contract.outputs.application == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # The full unit suite (7,000+ tests) takes 15-22 minutes on a hosted runner; 25 cut a passing run.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify AWS application independence
        run: bash scripts/aws/check-phase4-supabase-runtime.sh
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Cost cut 3: cache ~/.npm, keyed on package.json and this workflow (it pins the npm version below).
          cache: npm
          cache-dependency-path: |
            package.json
            .github/workflows/aws-infra-ci.yml
      - name: Install dependencies with known-good npm
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Verify worker imports load without the web environment
        run: node --test scripts/workers/worker-imports.test.mjs
      # Cost cut 4: the Terraform plan guard tests, here when this job runs (same tests as the guard job below).
      - name: Run guard tests
        if: needs.remote-execution-contract.outputs.guard == 'true'
        run: npm test -- scripts/aws/check-terraform-plan.test.mjs
      - name: Verify realtime authorizer origin allowlist
        if: needs.remote-execution-contract.outputs.guard == 'true'
        run: node --test scripts/aws/realtime-authorizer-origins.test.mjs
      - name: Verify realtime typing token check in the connection Lambda
        if: needs.remote-execution-contract.outputs.guard == 'true'
        run: node --test scripts/aws/realtime-typing-lambda.test.mjs
      - name: Verify the app database secret rotation Lambda
        if: needs.remote-execution-contract.outputs.guard == 'true'
        run: node --test scripts/aws/aurora-app-secret-rotation.test.mjs
      - name: Verify disposable email block in the pre-sign-up Lambda
        if: needs.remote-execution-contract.outputs.guard == 'true'
        run: node --test scripts/aws/cognito-pre-sign-up-disposable.test.mjs
      - name: Verify live Google auth probe contract
        if: needs.remote-execution-contract.outputs.guard == 'true'
        run: node --test scripts/aws/google-auth-live-probe.test.mjs

  terraform:
    name: Terraform validate
    needs: remote-execution-contract
    if: needs.remote-execution-contract.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/aws/bootstrap
          - infra/aws/app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - name: Terraform format
        run: terraform fmt -check -diff -recursive infra/aws
      - name: Terraform init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.directory }}

  guard:
    name: Terraform plan guard tests
    needs: remote-execution-contract
    # Cost cut 4: when Application verify runs, it runs these same guard tests; this job then has nothing to do.
    # On a draft (cost cut 1) Application verify does not run, so this job runs the guard tests instead.
    if: needs.remote-execution-contract.outputs.guard == 'true' && (needs.remote-execution-contract.outputs.application != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Cost cut 3: cache ~/.npm, keyed on package.json and this workflow (it pins the npm version below).
          cache: npm
          cache-dependency-path: |
            package.json
            .github/workflows/aws-infra-ci.yml
      - name: Install dependencies with known-good npm
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Run guard tests
        run: npm test -- scripts/aws/check-terraform-plan.test.mjs
      - name: Verify realtime authorizer origin allowlist
        run: node --test scripts/aws/realtime-authorizer-origins.test.mjs
      - name: Verify realtime typing token check in the connection Lambda
        run: node --test scripts/aws/realtime-typing-lambda.test.mjs
      - name: Verify the app database secret rotation Lambda
        run: node --test scripts/aws/aurora-app-secret-rotation.test.mjs
      - name: Verify disposable email block in the pre-sign-up Lambda
        run: node --test scripts/aws/cognito-pre-sign-up-disposable.test.mjs
      - name: Verify live Google auth probe contract
        run: node --test scripts/aws/google-auth-live-probe.test.mjs

  container:
    name: Docker build
    needs: remote-execution-contract
    if: needs.remote-execution-contract.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Round H: PR CI has no AWS sign-in, and anonymous Amazon ECR Public pulls from shared runner IPs sometimes
      # fail with 429 "Data limit exceeded". Pull the pinned base image (scripts/aws/node-base-image.env) first; if
      # ECR Public refuses, pull the same digest from Google's mirror of the official Docker image. The build below
      # uses whichever reference was pulled, so it finds the image locally without a registry call.
      - name: Pull the node base image
        run: |
          set -euo pipefail
          source scripts/aws/node-base-image.env
          image="public.ecr.aws/docker/library/node@$NODE_BASE_DIGEST"
          for wait_seconds in 10 30 0; do
            if docker pull --quiet "$image"; then echo "NODE_BASE_IMAGE=$image" >> "$GITHUB_ENV"; exit 0; fi
            sleep "$wait_seconds"
          done
          echo "::warning::Amazon ECR Public refused the anonymous base image pull; using the mirror.gcr.io copy of the official node image."
          image="mirror.gcr.io/library/node@$NODE_BASE_DIGEST"
          docker pull --quiet "$image"
          echo "NODE_BASE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Build production image
        run: |
          docker build \
            --build-arg NODE_BASE_IMAGE="$NODE_BASE_IMAGE" \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            -t sea-n-shore:ci .
