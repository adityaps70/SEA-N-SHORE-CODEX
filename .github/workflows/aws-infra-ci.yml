name: AWS Infrastructure CI

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - src/**
      - public/brand/**
      - infra/aws/**
      - scripts/aws/**
      - scripts/migration/**
      - scripts/workers/**
      - vitest.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/aws-*.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - src/**
      - public/brand/**
      - infra/aws/**
      - scripts/aws/**
      - scripts/migration/**
      - scripts/workers/**
      - vitest.config.ts
      - tsconfig.json
      - package.json
      - package-lock.json
      - .github/workflows/aws-*.yml

permissions:
  contents: read

# Actions minutes: a newer push to the same ref supersedes this run (a guarded runner on an older
# commit refuses anyway once the branch has moved).
concurrency:
  group: aws-infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Actions minutes: a heavy job below is skipped only when every file it reads is byte-identical to a
  # commit whose Infra CI passed (a merge of an up-to-date PR branch, a rearm, a workflow-only change);
  # see scripts/aws/infra-ci-scope.sh. The SSM execution contract job (guard and runner contract
  # tests) always runs. A non-push event, or any doubt, runs everything.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      application: ${{ steps.scope.outputs.application }}
      terraform: ${{ steps.scope.outputs.terraform }}
      guard: ${{ steps.scope.outputs.guard }}
      container: ${{ steps.scope.outputs.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
      - name: Decide which heavy jobs this commit needs
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: bash scripts/aws/infra-ci-scope.sh

  remote-execution-contract:
    name: GitHub SSM execution contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify edge recovery plan guard
        run: python3 scripts/aws/check-edge-plan.test.py
      - name: Verify edge recovery distribution inventory contract
        run: node --test scripts/aws/edge-recovery-distributions.test.mjs
      - name: Verify Server Action edge header contract
        run: python3 scripts/aws/server-action-edge-header.test.py
      - name: Verify canonical host redirect function
        run: node --test scripts/aws/canonical-host-redirect.test.mjs
      - name: Verify legacy domain redirect function and guarded release contract
        run: node --test scripts/aws/legacy-domain-redirect.test.mjs scripts/aws/seaandshore-domain.test.mjs
      - name: Verify edge state audit contract
        run: node --test scripts/aws/audit-edge-state.test.mjs
      - name: Verify guarded Terraform state unlock contract
        run: node --test scripts/aws/terraform-state-unlock.test.mjs
      - name: Verify remote execution security contract
        run: node --test scripts/aws/remote-execution-config.test.mjs
      - name: Verify remote runtime log window contract
        run: node --test scripts/aws/remote-verify-log-window.test.mjs
      - name: Verify staging deploy guard contract
        run: node --test scripts/aws/staging-deploy-guard.test.mjs
      - name: Verify health check token header contract
        run: node --test scripts/aws/health-check-token.test.mjs
      - name: Verify web memory diagnostic stays read-only
        run: node --test scripts/aws/web-memory-diagnostic.test.mjs
      - name: Verify web resilience infrastructure release contract
        run: node --test scripts/aws/web-resilience-infra.test.mjs
      - name: Verify SMS retirement infrastructure release contract
        run: node --test scripts/aws/sms-retirement-infra.test.mjs
      - name: Verify bootstrap budget retirement release contract
        run: node --test scripts/aws/bootstrap-budget-retirement.test.mjs
      - name: Verify phase 3 reliability release contract
        run: node --test scripts/aws/phase3-reliability-infra.test.mjs
      - name: Verify bootstrap host concurrency contract
        run: node --test scripts/aws/bootstrap-host-concurrency.test.mjs
      - name: Verify private migration relocate release contract
        run: node --test scripts/aws/private-migration-relocate.test.mjs
      - name: Verify account security release contract
        run: node --test scripts/aws/account-security-infra.test.mjs
      - name: Verify Cognito Google/native repair contract
        run: node --test scripts/aws/cognito-google-native-link-repair.test.mjs
      - name: Verify admin identity audit contract
        run: node --test scripts/aws/admin-identity-audit.test.mjs
      - name: Verify identity cleanup contract
        run: node --test scripts/aws/identity-cleanup.test.mjs
      - name: Verify Actions minutes contract
        run: node --test scripts/aws/actions-minutes.test.mjs
      - name: Verify staging-apply approval gate contract
        run: node --test scripts/aws/apply-approval-gate.test.mjs
      - name: Verify CI checkout bundle IAM contract
        run: node --test scripts/aws/github-deploy-iam-ci-checkouts.test.mjs
      - name: Verify ECR Public sign-in IAM and deploy step contract
        run: node --test scripts/aws/github-deploy-iam-ecr-public.test.mjs
      - name: Verify bootstrap host checkout contract (no GitHub access on the host)
        run: node --test scripts/aws/host-checkout.test.mjs
      - name: Verify owner-merged arm guard contract
        run: node --test scripts/aws/arm-commit-guard.test.mjs
      - name: Verify Social Events notification rule contract
        run: node --test scripts/aws/social-events-rule.test.mjs
      - name: Verify stale sign-in cleanup contract
        run: node --test scripts/aws/stale-sign-in-cleanup.test.mjs
      - name: Verify worker drift contract
        run: node --test scripts/aws/worker-drift-plan.test.mjs
      - name: Verify runtime error diagnostic contract (read-only; digests and CSP summaries)
        run: node --test scripts/aws/runtime-error-diagnostic.test.mjs
      - name: Verify host Terraform init and SHA-guard contracts
        run: node --test scripts/aws/terraform-init-providers.test.mjs scripts/aws/round-9b-migration.test.mjs scripts/aws/learning-round-a-migration.test.mjs scripts/aws/learning-course-list-items.test.mjs scripts/aws/learning-round-b-migration.test.mjs scripts/aws/learning-round-c-migration.test.mjs scripts/aws/gst-tax-migration.test.mjs scripts/aws/learning-round-d-migration.test.mjs scripts/aws/company-training-migration.test.mjs scripts/aws/legacy-reminder-migration.test.mjs scripts/aws/site-fixes-round-f-migration.test.mjs scripts/aws/round-g-release-1-migration.test.mjs scripts/aws/round-g-release-2-migration.test.mjs scripts/aws/sire-course-transfer-migration.test.mjs scripts/aws/site-fixes-round-h-release-1-migration.test.mjs scripts/aws/site-fixes-round-h-release-2-migration.test.mjs scripts/aws/site-fixes-round-h-release-3-migration.test.mjs scripts/aws/site-fixes-round-h-h9-event-migration.test.mjs
      - name: Verify guarded migration runner template (evidence check per path)
        run: node --test scripts/aws/guarded-migration-template.test.mjs
      - name: Verify onboarding e2e guard contract
        run: node --test scripts/aws/onboarding-e2e-guard.test.mjs
      - name: Verify membership launch sequence contract
        run: node --test scripts/aws/membership-launch-sequence.test.mjs
      - name: Verify membership launch child workflow contract
        run: node --test scripts/aws/membership-launch-child-workflows.test.mjs
      - name: Verify organization hiring e2e guard contract
        run: node --test scripts/aws/organization-hiring-e2e-guard.test.mjs
      - name: Verify learning assignment review e2e guard contract
        run: node --test scripts/aws/learning-assignment-review-e2e-guard.test.mjs
      - name: Verify events e2e guard contract
        run: node --test scripts/aws/events-e2e-guard.test.mjs
      - name: Verify realtime messaging e2e guard contract
        run: node --test scripts/aws/realtime-e2e-guard.test.mjs
      - name: Verify public marketing home resilience contract
        run: node --test scripts/aws/marketing-home-resilience.test.mjs
      - name: Verify post media migration contract
        run: node --test scripts/aws/migrate-post-media-to-s3.test.mjs
      - name: Verify post media video schema contract
        run: node --test scripts/aws/post-media-video-schema.test.mjs
      - name: Verify feed social interaction schema contract
        run: node --test scripts/aws/feed-social-interactions-schema.test.mjs
      - name: Verify jobs intelligence schema contract
        run: node --test scripts/aws/jobs-intelligence-schema.test.mjs
      - name: Verify organization hiring approval schema contract
        run: node --test scripts/aws/organization-hiring-approval-schema.test.mjs
      - name: Verify learning foundation schema contract
        run: node --test scripts/aws/learning-foundation-schema.test.mjs
      - name: Verify direct media upload CORS contract
        run: node --test scripts/aws/post-media-upload-cors.test.mjs
      - name: Verify deterministic AWS SDK install contract
        run: node --test scripts/aws/aws-sdk-version-contract.test.mjs
      - name: Verify deterministic npm transitive resolution
        run: node --test scripts/aws/npm-resolution-contract.test.mjs
      - name: Verify database reconciliation contract
        run: node --test scripts/migration/reconcile-postgres.test.mjs
      - name: Verify storage reconciliation contract
        run: node --test scripts/migration/reconcile-storage.test.mjs
      - name: Verify identity reconciliation contract
        run: node --test scripts/migration/reconcile-identities.test.mjs
      - name: Verify Phase 5B SES readiness contract
        run: node --test scripts/aws/phase5b-ses-readiness.test.mjs
      - name: Verify Phase 5B SES Terraform contract
        run: node --test scripts/aws/phase5b-ses-terraform.test.mjs
      - name: Verify Phase 5B SES cutover contract
        run: node --test scripts/aws/phase5b-ses-cutover.test.mjs
      - name: Verify event outbox schema contract
        run: node --test scripts/aws/event-outbox-schema.test.mjs
      - name: Verify profile media schema contract
        run: node --test scripts/aws/profile-media-schema.test.mjs
      - name: Verify exact profile identity schema contract
        run: node --test scripts/aws/profile-identity-schema.test.mjs
      - name: Verify Maritime Passport schema contract
        run: node --test scripts/aws/profile-passport-schema.test.mjs
      - name: Verify social event Terraform contract
        run: node --test scripts/aws/social-events-terraform.test.mjs
      - name: Verify realtime messaging Terraform contract
        run: node --test scripts/aws/realtime-messaging-terraform.test.mjs
      - name: Verify shared IAM runtime audit contract
        run: node --test scripts/aws/social-shared-iam-runtime-audit.test.mjs
      - name: Verify ECS Resend secret policy release contract
        run: node --test scripts/aws/ecs-resend-secret-policy-release.test.mjs
      - name: Verify newsletter signing secret release contract
        run: node --test scripts/aws/newsletter-signing-secret-release.test.mjs
      - name: Verify Resend delivery webhook runner contract
        run: node --test scripts/aws/resend-delivery-webhook.test.mjs
      - name: Verify guarded staging data cleanup contract
        run: node scripts/aws/staging-data-cleanup.test.mjs
      - name: Verify social event parity runtime audit contract
        run: node --test scripts/aws/audit-social-event-parity.test.mjs
      - name: Verify Aurora migration semantic audit contract
        run: node --test scripts/aws/audit-aurora-migration-parity.test.mjs
      - name: Verify Aurora identity parity audit contract
        run: node --test scripts/aws/audit-aurora-data-parity.test.mjs
      - name: Verify social worker contract
        run: node --test scripts/workers/worker-contract.test.mjs

  application:
    name: Application verify
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify AWS application independence
        run: bash scripts/aws/check-phase4-supabase-runtime.sh
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies with known-good npm
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Verify worker imports load without the web environment
        run: node --test scripts/workers/worker-imports.test.mjs

  terraform:
    name: Terraform validate
    needs: scope
    if: needs.scope.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/aws/bootstrap
          - infra/aws/app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
      - name: Terraform format
        run: terraform fmt -check -diff -recursive infra/aws
      - name: Terraform init
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.directory }}

  guard:
    name: Terraform plan guard tests
    needs: scope
    if: needs.scope.outputs.guard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install dependencies with known-good npm
        run: npx -y npm@11.6.0 install --include=dev --no-audit --no-fund --package-lock=false
      - name: Run guard tests
        run: npm test -- scripts/aws/check-terraform-plan.test.mjs
      - name: Verify realtime authorizer origin allowlist
        run: node --test scripts/aws/realtime-authorizer-origins.test.mjs
      - name: Verify realtime typing token check in the connection Lambda
        run: node --test scripts/aws/realtime-typing-lambda.test.mjs
      - name: Verify the app database secret rotation Lambda
        run: node --test scripts/aws/aurora-app-secret-rotation.test.mjs
      - name: Verify disposable email block in the pre-sign-up Lambda
        run: node --test scripts/aws/cognito-pre-sign-up-disposable.test.mjs
      - name: Verify live Google auth probe contract
        run: node --test scripts/aws/google-auth-live-probe.test.mjs

  container:
    name: Docker build
    needs: scope
    if: needs.scope.outputs.container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Round H: PR CI has no AWS sign-in, and anonymous Amazon ECR Public pulls from shared runner IPs sometimes
      # fail with 429 "Data limit exceeded". Pull the base image first; if ECR Public refuses, use Google's mirror of
      # the same official Docker image and tag it locally, so the build below finds it without a registry call.
      - name: Pull the node base image
        run: |
          image=public.ecr.aws/docker/library/node:22-bookworm-slim
          for wait_seconds in 10 30; do
            if docker pull --quiet "$image"; then exit 0; fi
            sleep "$wait_seconds"
          done
          if docker pull --quiet "$image"; then exit 0; fi
          echo "::warning::Amazon ECR Public refused the anonymous base image pull; using the mirror.gcr.io copy of the official node image."
          docker pull --quiet mirror.gcr.io/library/node:22-bookworm-slim
          docker tag mirror.gcr.io/library/node:22-bookworm-slim "$image"
      - name: Build production image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            -t sea-n-shore:ci .
