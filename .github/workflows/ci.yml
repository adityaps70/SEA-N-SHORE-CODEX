name: Application CI

on:
  push:
    branches: [main, feature/home-feed]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cost cut 8 (owner-approved 14 Nov): a newer push to the same ref supersedes this run.
concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          # Cost cut 8: cache ~/.npm, keyed on package.json, the lock file and this workflow; the install command is unchanged.
          cache: npm
          cache-dependency-path: |
            package.json
            package-lock.json
            .github/workflows/ci.yml

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
